[package]
name = "gungnir-association"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NN/GNN, Hungarian/JV, gating, JPDA, MHT."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
gungnir-filters = { path = "../gungnir-filters", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
# The scipy oracle fixtures in testdata/oracles/association/ are JSON; serde_json is
# an already-approved workspace dependency (agentic-coding-standards.md 2.9), dev-only.
serde_json.workspace = true
gungnir-testkit = { path = "../gungnir-testkit", version = "0.1.0" }

[[bench]]
name = "hungarian_solve_100x100"
harness = false
