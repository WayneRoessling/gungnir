[package]
name = "gungnir-data"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "File I/O for point cloud / VTK scientific mesh / terrain / glTF, per rust-3d-data-ecosystem-build-vs-adopt.md §1. No egui/three-d/wgpu dependency -- unit-testable with plain cargo test."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[features]
# Real-world CRS conversion for a DEM (GAP-023, D-41): off by default because `proj`
# links `libproj` via `proj-sys`, which this feature builds from its own vendored
# source (`bundled_proj`) with `cmake` and a C/C++ toolchain -- a heavier, more
# environment-dependent build than the rest of this crate's pure-Rust or
# already-workspace-approved native deps. `docs/agentic-coding-standards.md` §2.9's
# D-41 entry records the tradeoff and what CI actually verifies; a default build's
# `cargo check`/`cargo test` never needs `cmake` at all as a result. The same shape
# `gpu-tests` (`gungnir-data-fusion`) already uses for an environment-gated capability.
crs-projection = ["dep:proj"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
las.workspace = true
vtkio.workspace = true
gltf.workspace = true
tiff.workspace = true
# copc-rs, pasture-core, pasture-io: young/pre-1.0 crates named in the source doc.
# Pin exact tested minor versions in the PR that introduces them (agentic coding
# standard: dependency discipline) rather than here. oxigdal-3d was the DEM route
# the source doc named; the owner chose `tiff` instead on 2026-09-06 (GAP-023).
# GAP-023, D-41: real-world CRS conversion for a DEM, behind the `crs-projection`
# feature above. Optional so a default build never resolves `proj-sys`'s build script.
proj = { workspace = true, optional = true }
