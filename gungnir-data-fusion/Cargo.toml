[package]
name = "gungnir-data-fusion"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU-accelerated point cloud registration/fusion (point-to-plane ICP) on wgpu compute, per rust-3d-data-ecosystem-build-vs-adopt.md §3. The one genuine ecosystem gap identified -- kept as its own crate, separate from gungnir-data, because it's the only data-layer crate that needs a wgpu::Device (borrowed from gungnir-render)."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[features]
# GPU-vs-CPU validation runs only on GPU-enabled runners (gpu-fusion.yml), never
# inside plain `cargo test`.
gpu-tests = []

[dependencies]
nalgebra.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true
gungnir-data = { path = "../gungnir-data", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
# GAP-024: `tests/gpu_vs_cpu.rs` (`gpu-tests` feature) blocks on `wgpu`'s async
# adapter/device request the same way `gungnir-app` blocks on `GpuContext::new`
# (`state.rs`'s `desktop_runtime`) -- already an approved workspace dependency
# (`docs/agentic-coding-standards.md` §2.9), not a new one; this is a dev-only,
# per-crate reference to it, no new `[workspace.dependencies]` entry.
tokio.workspace = true
