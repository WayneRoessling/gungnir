[package]
name = "gungnir-metrics"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "MOTA/MOTP, purity/fragmentation, track-to-truth assignment."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
gungnir-track = { path = "../gungnir-track", version = "0.1.0" }
# The CLEAR MOT frame matching is a minimum-cost assignment, and this is the one the
# oracle uses too (scipy's linear_sum_assignment); it is already gated against scipy.
# gungnir-track already depends on gungnir-association, so the graph is unchanged in
# shape -- see ARCHITECTURE.md section 7.1.
gungnir-association = { path = "../gungnir-association", version = "0.1.0" }

[dev-dependencies]
# The py-motmetrics oracle fixture in testdata/oracles/metrics/ is JSON; serde_json is
# an already-approved workspace dependency (agentic-coding-standards.md 2.9), dev-only.
serde_json.workspace = true
proptest.workspace = true
gungnir-testkit = { path = "../gungnir-testkit", version = "0.1.0" }
