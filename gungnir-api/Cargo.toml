[package]
name = "gungnir-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Versioned, security-gated external contract (v1: snapshot, event stream, detection submit, plan decision) so remote desktops, peer C2 systems, analytics tools, or enterprise data services can integrate with a service node. Transport-neutral types here; the HTTP/JSON + WebSocket transport is the next stack addition. docs/gungnir-capabilities.md §5.5 -- High."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# GAP-041, D-18: the node's HTTP surface and the event stream. Recorded in
# agentic-coding-standards.md section 2.9; the `ws` feature is the server side, so no
# separate server WebSocket crate is needed.
axum.workspace = true
# GAP-060, D-18: mutual TLS on the node's surface. Signed off 2026-09-05 and unused
# until now; `rustls::pki_types::pem` reads the PEM and never logs what it read.
rustls.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tokio.workspace = true
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
gungnir-eventing = { path = "../gungnir-eventing", version = "0.1.0" }
gungnir-security = { path = "../gungnir-security", version = "0.1.0" }
gungnir-tracking-service = { path = "../gungnir-tracking-service", version = "0.1.0" }
gungnir-intercept-service = { path = "../gungnir-intercept-service", version = "0.1.0" }
# ARCHITECTURE.md §7.1 edge (f), GAP-006: `GET /v2/coverage` publishes a
# `CoverageReport`, so the crate defining the contract names the type rather than
# defining a second one that would drift from the picture.
gungnir-analytics = { path = "../gungnir-analytics", version = "0.1.0" }

[dev-dependencies]
serde_json.workspace = true
# The party test builds tracks, whose state is an nalgebra vector.
nalgebra.workspace = true
# D-22, dev only: mutual TLS cannot be verified without certificates, and a private key
# checked into the repository would be key material in the repository.
rcgen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
