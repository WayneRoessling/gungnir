# cargo-deny configuration: the software-assurance half of release governance
# (docs/release-governance.md). Run `cargo deny check` locally; release.yml runs it.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

# Every entry here is an acceptance with a reason and a condition, not a mute. An entry
# whose condition stops being true is a defect, and the test named in it is what makes
# that visible rather than a matter of memory.
ignore = [
    # RUSTSEC-2026-0194 (quadratic run time checking a start tag for duplicate attribute
    # names) and RUSTSEC-2026-0195 (unbounded namespace-declaration allocation in
    # `NsReader`), both denial of service, both in `quick-xml 0.36.2`.
    #
    # Accepted 2026-09-07 by the owner, under GAP-094, on this condition and no other:
    # **the vulnerable parser is not reachable.** `quick-xml` enters the graph only
    # through `vtkio`, and only for the XML VTK family; `gungnir-data` has only ever read
    # legacy `POLYDATA`, and `scientific::refuse_xml_vtk` now refuses the XML family by
    # extension *and* by content before `Vtk::import` opens the file.
    #
    # The condition is tested, not asserted: `gungnir-data/tests/vtk_gltf.rs`, module
    # `xml_vtk_is_refused`, covers all ten XML extensions, XML content hiding under a
    # `.vtk` name, and that a legacy file still loads. **If those tests are removed or
    # weakened, these two entries are no longer honest and must go.**
    #
    # Both are fixed in `quick-xml >= 0.41.0` and no `vtkio` release depends on a fixed
    # version; the entries come out when one does. The related
    # RUSTSEC-2026-0041 (`lz4_flex`, uninitialised-memory disclosure) needed no entry: the
    # move to `vtkio 0.7.0-rc2` on the same day brought `lz4_flex 0.11.6`, which is the
    # fixed version, and that one was a real vulnerability on a reachable path.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

# The workspace is AGPL-3.0-or-later, so every entry below must be one-way compatible
# *into* AGPL-3.0. All of them are: the permissive licenses unconditionally, Apache-2.0
# and MPL-2.0 in the GPLv3 direction only. A dependency that is not on this list is not
# merely unvetted, it may make the workspace undistributable -- see CLA.md section 4.
#
# `OpenSSL` was removed on 2026-09-07 when the license was set. The classic OpenSSL and
# SSLeay texts carry an advertising clause that AGPL section 7 forbids as a further
# restriction, so a crate under it could not be linked into this workspace at all.
# Nothing in the tree needs it: at the pinned versions `ring` 0.17.14 is `Apache-2.0 AND
# ISC` and `aws-lc-sys` 0.45.0 no longer carries an OpenSSL component, and no crate in
# the resolved graph declares that license. Leaving the entry in place would have let a
# future upgrade walk a GPL-incompatible license in silently.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
