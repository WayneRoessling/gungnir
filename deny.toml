# cargo-deny configuration: the software-assurance half of release governance
# (docs/release-governance.md). Run `cargo deny check` locally; ci.yml runs the
# licenses, bans and sources checks on every pull request, and release.yml runs all
# four, advisories included, on every tag.

[graph]
all-features = false
# Only the two targets a release builds (release.yml; ARCHITECTURE.md §8). Without this
# cargo-deny evaluates every target rustc knows, which drags in slices of the graph no
# binary ships: at the pinned versions the only one that mattered was
# `webpki-root-certs` (CDLA-Permissive-2.0), which `rustls-platform-verifier` takes on
# wasm32 alone. It is not on the allow-list and does not need to be; nothing here
# compiles for wasm32.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained advisories carry no known defect; they say who will not be fixing one. An
# entry here is a dated decision, with its reason, of one of two kinds: the crate never
# reaches a shipped binary, so the response-time objective in
# docs/release-governance.md is not engaged; or it does, but it touches no untrusted
# input and has no upstream path, so the objective is engaged only when a defect is
# actually published, at which point the entry comes out and the crate is replaced. The
# history of each is against D-34 in docs/mission/gap-analysis/decisions-needed.md.
#
# Eight earlier entries (GAP-094, withdrawn on 2026-09-07 before this landed) rested on
# a graph claim checked on one host, which Linux contradicted. Each entry below names
# the path it covers, and `[graph] targets` above confines the check to the two release
# targets, so the claim is about the graph cargo-deny actually evaluates.
ignore = [
    # ansi_term reaches only rs1090, an ADS-B test oracle in gungnir-interop's
    # dev-dependencies (section 2.9). `cargo tree -e normal,build` names no path to it.
    { id = "RUSTSEC-2021-0139", reason = "dev-only: rs1090 oracle, never linked into a binary (2026-09-07)" },
    # paste is a proc-macro beneath accesskit_windows and nalgebra's simba. It runs in the
    # compiler and contributes no code to the binary; the archived repository is the
    # whole of the advisory.
    { id = "RUSTSEC-2024-0436", reason = "proc-macro only, compile-time; no code of it is shipped (2026-09-07)" },
    # quick-xml 0.30 under zbus_xml, under accesskit_unix, the Linux AT-SPI accessibility
    # bridge egui-winit 0.29 uses. It exists only in gungnir-app compiled for Linux, which
    # no release builds (release.yml ships gungnir-app for Windows and gungnir-node for
    # Linux, and the node holds no eframe); cargo-deny still evaluates that combination
    # because [graph] targets applies to every crate. Turning eframe's `accesskit`
    # feature off would silence this by removing the Windows bridge too, which is a real
    # accessibility loss on the shipped desktop, so the advisories are ignored instead.
    # These ignores are by advisory id, which is all cargo-deny offers for a
    # vulnerability, so they would also cover a *new* pre-0.41 quick-xml on a shipped
    # target: cargo-deny prints which crates each ignore matched, and anything other
    # than quick-xml 0.30.0 under accesskit_unix there means these entries must go. The
    # vtkio copy (0.22) that these ids also covered was removed the same day by
    # compiling vtkio's XML reader out (workspace Cargo.toml, vtkio row).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.30 under accesskit_unix only: gungnir-app on Linux, which no release builds (2026-09-07)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.30 under accesskit_unix only: gungnir-app on Linux, which no release builds (2026-09-07)" },
    # cgmath is three-d's own vector and matrix type and ships in gungnir-app. It is pure
    # arithmetic on values this program computes; it parses nothing and reads no input.
    # There is no upstream path: it is not a feature, and three-d 0.19 depends on it
    # too. It leaves when three-d drops it or three-d is replaced (ARCHITECTURE.md §9).
    # Decided by the owner 2026-09-07.
    { id = "RUSTSEC-2026-0196", reason = "cgmath: pure math on trusted data, no untrusted input, no upstream path while three-d keeps it (owner, 2026-09-07)" },
    # ttf-parser sits under ab_glyph, under epaint, and ships in gungnir-app. It parses
    # font files, which would matter if any came from outside; none do. The only fonts
    # the program ever hands it are the four egui bundles by `include_bytes!`
    # (epaint_default_fonts; see the [[licenses.exceptions]] entry), and no crate here
    # builds a `FontDefinitions` or loads a font from disk. No upstream path until
    # ab_glyph moves to ttf-parser's successor and egui takes that release; loading a
    # user-supplied font before then would need this entry removed first.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: parses only the four fonts embedded at build time, never a file from outside; no upstream path until ab_glyph moves (owner, 2026-09-07)" },
]

# The workspace is AGPL-3.0-or-later, so every entry below must be one-way compatible
# *into* AGPL-3.0. All of them are: the permissive licenses unconditionally, Apache-2.0
# and MPL-2.0 in the GPLv3 direction only. A dependency that is not on this list is not
# merely unvetted, it may make the workspace undistributable -- see CLA.md section 4.
#
# `OpenSSL` was removed on 2026-09-07 when the license was set. The classic OpenSSL and
# SSLeay texts carry an advertising clause that AGPL section 7 forbids as a further
# restriction, so a crate under it could not be linked into this workspace at all.
# Nothing in the tree needs it: at the pinned versions `ring` 0.17.14 is `Apache-2.0 AND
# ISC` and `aws-lc-sys` 0.45.0 no longer carries an OpenSSL component, and no crate in
# the resolved graph declares that license. Leaving the entry in place would have let a
# future upgrade walk a GPL-incompatible license in silently.
#
# `Unicode-DFS-2016` stays on the list although no crate in the resolved graph declares
# it any more (the ICU crates moved to `Unicode-3.0`); it is the license the FSF lists
# as GPL-compatible and an older pin could bring it back.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

# The one non-code exception in the shipped graph, found 2026-09-07 by the licensing
# review, when this gate was run for the first time and failed on it.
#
# `epaint_default_fonts` is egui's bundled font set, embedded into `gungnir-app` by
# `include_bytes!` through egui 0.29's default `default_fonts` feature. Its code is
# `MIT OR Apache-2.0`; the font files are not. Ubuntu-Light.ttf is under the Ubuntu Font
# Licence 1.0 (no SPDX identifier, hence `LicenseRef-UFL-1.0`) and NotoEmoji-Regular.ttf
# under the SIL Open Font License 1.1; Hack-Regular.ttf and emoji-icon-font.ttf are MIT.
#
# Neither font license is on the list above and neither should be: the FSF classes the
# OFL as GPL-incompatible *for software*, and a Rust crate under it could not be linked
# here. Fonts are a different case, and the licenses say so themselves. OFL section 1
# permits the font to be "bundled, embedded, redistributed and/or sold with any
# software", and UFL 1.0 carries the same clause; a font embedded as data does not make
# the program a derivative of the font, so the AGPL binary and the fonts coexist the
# way NOTICE describes the GPL-2.0 fixtures coexisting with the source: as an
# aggregate. Both licenses do require that the font's copyright notice and license
# text travel with it, which is one of the reasons release.yml generates
# THIRD-PARTY-NOTICES.md with cargo-about and ships it beside the binaries.
#
# The exception is scoped to this one crate on purpose. A *code* crate that showed up
# under OFL-1.1 must still fail this check.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "LicenseRef-UFL-1.0"]

# The workspace's own crates are AGPL-3.0-or-later, which is deliberately *not* on the
# allow-list: an AGPL or GPL crate from outside cannot be taken, because CLA.md section 4
# needs every dependency to be relicensable for the commercial edition, and a global
# `AGPL-3.0-or-later` entry would let one through silently. cargo-deny checks workspace
# members against the same list, so each member is admitted here by name. Exceptions
# take no glob, so the list is explicit; a new member crate fails this check until it is
# added, which is the intended way to notice it. gungnir-fuzz is outside the workspace
# graph and is not listed.
[[licenses.exceptions]]
crate = "gungnir-allocation"
allow = ["AGPL-3.0-or-later"]

