[bans]
multiple-versions = "warn"
# `version = "*"` on a registry crate is refused. A path dependency without a version is
# a wildcard too, which is why every intra-workspace edge carries `version = "0.1.0"`
# beside its `path`: crates.io requires the same, and docs/gungnir-workspace-structure.md
# records that publication is no longer blocked by the licence.
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
