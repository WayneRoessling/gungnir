[package]
name = "gungnir-fusion-async"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OOS handling / multi-rate async fusion pipeline. The only crate that uses the tokio runtime; the runtime is owned by the host binary."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
crossbeam-channel.workspace = true
gungnir-track = { path = "../gungnir-track", version = "0.1.0" }
gungnir-rfs = { path = "../gungnir-rfs", version = "0.1.0" }
gungnir-track-fusion = { path = "../gungnir-track-fusion", version = "0.1.0" }
# GAP-011, edge (r) in ARCHITECTURE.md §7.1: the pipeline drives an estimator and an
# association gate per epoch, so it names the crates that own them rather than
# reimplementing either. Both are already beneath this crate through `gungnir-track`;
# what changes is that the manifest now says what the code imports.
gungnir-core = { path = "../gungnir-core", version = "0.1.0" }
gungnir-filters = { path = "../gungnir-filters", version = "0.1.0" }
gungnir-association = { path = "../gungnir-association", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
gungnir-testkit = { path = "../gungnir-testkit", version = "0.1.0" }

# Gate 4 (`.github/workflows/loom.yml`, docs/agentic-workflow.md, §5 of the coding
# standards). **Behind `cfg(loom)` rather than a plain dev-dependency**, which is what
# `RUSTFLAGS=--cfg loom` -- the flag the gate has always set -- now actually buys: cargo
# evaluates this table's cfg against the rustflags in force, so an ordinary
# `cargo build`, `cargo test` or `cargo deny` run never resolves, downloads or compiles
# `loom` at all, and it appears in no SBOM and no release-target graph. The model checks
# it serves are `src/loom_model.rs`, which is `#[cfg(loom)]` for the same reason.
#
# This is also the structural half of the gate: `loom.yml` greps this manifest for a
# `loom` dependency, because `--cfg loom` compiles perfectly happily against a crate that
# has never heard of loom, and for 22 runs it did (GAP-061).
[target.'cfg(loom)'.dev-dependencies]
loom.workspace = true
