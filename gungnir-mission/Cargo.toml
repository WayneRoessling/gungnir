[package]
name = "gungnir-mission"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Mission/session lifecycle: create/load/save/replay/close, plus scenario binding. gungnir-capabilities.md §5.1 -- High. Pairs with gungnir-config."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
gungnir-config = { path = "../gungnir-config", version = "0.1.0" }
gungnir-store = { path = "../gungnir-store", version = "0.1.0" }
# GAP-051: the lifecycle replays a session, and an envelope is what a session is
# made of. `gungnir-store` already carries this type; naming it here is the same
# edge the journal has.
gungnir-eventing = { path = "../gungnir-eventing", version = "0.1.0" }

[dev-dependencies]
gungnir-scenario = { path = "../gungnir-scenario", version = "0.1.0" }
