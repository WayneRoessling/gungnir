[package]
name = "gungnir-rfs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PHD/CPHD, GLMB/LMB random finite set filters."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
gungnir-track = { path = "../gungnir-track" }

[dev-dependencies]
proptest.workspace = true
# The GM-PHD oracle fixture in testdata/oracles/track/ is JSON; serde_json is an
# already-approved workspace dependency (agentic-coding-standards.md 2.9), dev-only.
serde_json.workspace = true
criterion.workspace = true
gungnir-testkit = { path = "../gungnir-testkit" }

[[bench]]
name = "phd_update_dense_swarm"
harness = false
