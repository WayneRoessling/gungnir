[package]
name = "gungnir-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Collaboration & multi-user concurrency: shared operational picture across desktops connected to one node, concurrent annotations, and authority conflict resolution between operators' decisions. docs/gungnir-capabilities.md §5.6 -- Medium. Server-authoritative mission state lives on the node (ARCHITECTURE.md §8)."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
gungnir-eventing = { path = "../gungnir-eventing", version = "0.1.0" }
gungnir-command = { path = "../gungnir-command", version = "0.1.0" }
gungnir-security = { path = "../gungnir-security", version = "0.1.0" }

[dev-dependencies]
gungnir-policy = { path = "../gungnir-policy", version = "0.1.0" }
