[package]
name = "gungnir-decision"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Course-of-action generation and comparison, constraint handling, what-if simulation against a live snapshot, and recommendation explanations -- beyond single-solution DP allocation. docs/gungnir-capabilities.md §5.4 -- Medium."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
gungnir-assessment = { path = "../gungnir-assessment", version = "0.1.0" }
gungnir-policy = { path = "../gungnir-policy", version = "0.1.0" }
# docs/design/dependency-edges.md: accepted by the engineering reviewer 2026-09-05.
# The sensor-plan search evaluates coverage inside its own loop, once per
# candidate; a search that cannot evaluate its own candidates is not a search.
gungnir-analytics = { path = "../gungnir-analytics", version = "0.1.0" }
