[package]
name = "gungnir-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Human factors & operator workflow: role-based workspace layouts, the alert acknowledgement/escalation lifecycle, annotations and cases -- turning a set of panels into a designed operator workflow. docs/gungnir-capabilities.md §5.6 -- Medium."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
gungnir-model = { path = "../gungnir-model" }
gungnir-security = { path = "../gungnir-security" }
gungnir-observability = { path = "../gungnir-observability" }
# docs/design/dependency-edges.md: accepted by the engineering reviewer 2026-09-05.
# Narrow by construction: the tasking case reads task state and never issues a
# command, so exactly one crate can talk to a sensor.
gungnir-sensor-management = { path = "../gungnir-sensor-management" }
# docs/design/dependency-edges.md: accepted 2026-09-05. The warning rule reads the
# prediction to know when an obligation triggers; it is a rule about an obligation,
# not a detector, so it belongs in a crate with tests rather than in a binary.
gungnir-assessment = { path = "../gungnir-assessment" }
