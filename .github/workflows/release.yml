# Software assurance & release governance (docs/release-governance.md):
# dependency and license audit, an SBOM, reproducible release builds of both
# binaries, and signed artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  assurance:
    name: cargo-deny, cargo-audit, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny cargo-audit cargo-cyclonedx --locked
      # cargo-about's binary is behind its `cli` feature; without it `cargo install` builds
      # the library alone and the generate step below finds no command.
      # Pinned to the version the notices template was verified against (about.toml
      # records the cargo-about defect the template works around).
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: License and advisory policy (deny.toml)
        run: cargo deny check
      - name: Advisory database
        run: cargo audit
      - name: CycloneDX SBOM for both binaries
        run: cargo cyclonedx --format json --describe binaries
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
      # The permissive licenses on the allow-list, and the font licenses admitted for
      # epaint_default_fonts, all require their notices to accompany a binary. The SBOM
      # names identifiers, not notices; this file carries the texts (about.toml).
      - name: Third-party notices (about.toml)
        run: cargo about generate deploy/third-party-notices.hbs -o THIRD-PARTY-NOTICES.md --fail
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: |
            LICENSE
            LICENSE-ADDITIONAL-TERMS.md
            NOTICE
            THIRD-PARTY-NOTICES.md

  build:
    name: release build (${{ matrix.target }})
    needs: assurance
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: gungnir-app
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: gungnir-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps (desktop crates are not built on Linux here)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev
      - run: cargo install cargo-auditable --locked
      - name: Build with embedded dependency audit data
        run: cargo auditable build --release -p ${{ matrix.package }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.package }}*

  sign:
    name: sign artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: sigstore/cosign-installer@v3
      - name: Keyless signatures for every artifact
        run: |
          find artifacts -type f ! -name '*.sig' | while read -r f; do
            cosign sign-blob --yes --output-signature "$f.sig" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: artifacts/**/*.sig

  container:
    name: gungnir-node container image
    needs: assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (push is enabled once a registry is configured)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/node/Dockerfile
          push: false
          tags: gungnir-node:${{ github.ref_name }}
