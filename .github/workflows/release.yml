# Software assurance & release governance (docs/release-governance.md):
# dependency and license audit, an SBOM, reproducible release builds of both
# binaries, and signed artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # GAP-061 item (2): the assurance half is the part that can be rehearsed without
      # publishing anything, and until 2026-09-15 a dispatch could not stop at it. That
      # mattered more than it looks: `sign` uses keyless cosign, which records every
      # signature in Sigstore's **public, append-only transparency log**, so a rehearsal
      # of "the half that publishes nothing" would in fact have published. Default true,
      # so the safe run is the one you get by not thinking about it; a tag push is
      # unaffected and still runs every job.
      assurance_only:
        description: "Run only the assurance job (no builds, no signatures, no image)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  assurance:
    name: cargo-deny, cargo-audit, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      # Prebuilt release binaries (since 2026-09-09), not `cargo install`, which compiled
      # four tools from source on every release. Every version is pinned, because a
      # release workflow that installs whatever is newest is not reproducible; bump them
      # deliberately. cargo-about stays at the version the notices template was verified
      # against (about.toml records the cargo-about defect the template works around);
      # its published binary carries the `cli` feature the `cargo install` needed.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-cyclonedx@0.5.9,cargo-about@0.9.2
      - name: License and advisory policy (deny.toml)
        run: cargo deny check
      # **With deny.toml's accepted advisories, and no others** (2026-09-17, GAP-061). The
      # first run of this workflow found the two scanners disagreeing: `cargo deny` reads
      # deny.toml's ignores and passed, `cargo audit` cannot see them and failed on the two
      # quick-xml advisories the owner accepted on 2026-09-07. The owner chose one list over
      # a second one in .cargo/audit.toml; the script refuses an ignore with no reason. The
      # assignment is its own line so that a refusal fails this step instead of running the
      # audit with nothing ignored.
      - name: Advisory database (deny.toml's accepted advisories, and no others)
        run: |
          args=$(python3 .github/scripts/deny_advisory_ignores.py)
          ignores=()
          if [ -n "$args" ]; then mapfile -t ignores <<< "$args"; fi
          cargo audit "${ignores[@]}"
      - name: CycloneDX SBOM for both binaries
        run: cargo cyclonedx --format json --describe binaries
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
      # The permissive licenses on the allow-list, and the font licenses admitted for
      # epaint_default_fonts, all require their notices to accompany a binary. The SBOM
      # names identifiers, not notices; this file carries the texts (about.toml).
      - name: Third-party notices (about.toml)
        run: cargo about generate deploy/third-party-notices.hbs -o THIRD-PARTY-NOTICES.md --fail
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: |
            LICENSE
            LICENSE-ADDITIONAL-TERMS.md
            NOTICE
            THIRD-PARTY-NOTICES.md

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.assurance_only != true
    name: release build (${{ matrix.target }})
    needs: assurance
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: gungnir-app
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: gungnir-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps (desktop crates are not built on Linux here)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@0.7.5
      - name: Build with embedded dependency audit data
        run: cargo auditable build --release -p ${{ matrix.package }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.package }}*

  sign:
    if: github.event_name != 'workflow_dispatch' || inputs.assurance_only != true
    name: sign artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: sigstore/cosign-installer@v3
      - name: Keyless signatures for every artifact
        run: |
          find artifacts -type f ! -name '*.sig' | while read -r f; do
            cosign sign-blob --yes --output-signature "$f.sig" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: artifacts/**/*.sig

  container:
    if: github.event_name != 'workflow_dispatch' || inputs.assurance_only != true
    name: gungnir-node container image
    needs: assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (push is enabled once a registry is configured)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/node/Dockerfile
          push: false
          tags: gungnir-node:${{ github.ref_name }}
