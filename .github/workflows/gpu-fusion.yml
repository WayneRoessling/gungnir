# GPU point-cloud registration validated against the CPU reference on a
# GPU-enabled self-hosted runner (docs/rust-3d-data-ecosystem-build-vs-adopt.md
# §3.6). Not one of the six numbered gates; never run inside plain `cargo test`.
#
# Manual dispatch only, permanently, and by decision rather than by omission
# (D-10 as amended 2026-09-08). It used to trigger on pull requests touching
# gungnir-data-fusion or gungnir-render, and every such job waited a day for a runner
# labelled `gpu` that was not registered, then failed.
#
# The runner exists as of 2026-09-08: `gungnir-rtx-5060ti`, labels
# self-hosted/Windows/X64/gpu, on the owner's workstation (GAP-061). The trigger is
# deliberately NOT restored with it. This repository is public and the runner is a
# workstation, so a pull_request trigger would let a fork run its own code on that
# machine; workflow_dispatch can only be fired by a caller with write access, so it
# cannot. A dispatch job on a self-hosted runner is already local execution -- the
# compute is on the owner's GPU -- and GitHub supplies the trigger and the log that
# release-governance.md's evidence package is made of.
#
# **Corrected 2026-09-15: the feature is no longer empty, and this comment said it was.**
# GAP-024 has since written the GPU path and four `#[ignore]`d `#[tokio::test]`s behind
# `gpu-tests` (`tests/gpu_vs_cpu.rs`), and `cargo test -p gungnir-data-fusion
# --features gpu-tests --no-run` compiles them, so a dispatch now executes four tests
# rather than none and the "ran nothing" guard below is a guard rather than a certainty.
# What has never happened is the dispatch itself: item (3) of GAP-024's closing action is
# a *recorded* run on the registered runner, which a passing sandbox run is not.
# Fire it with `gh workflow run gpu-fusion.yml`.
#
# The same validation runs directly on any GPU host, no forge involved:
#   cargo test -p gungnir-data-fusion --features gpu-tests -- --ignored
# The workflow is the record, not the only route.
name: gpu-fusion

on:
  workflow_dispatch:

# The runner is the owner's workstation and the token needs nothing from GitHub but
# the checkout.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gpu-vs-cpu:
    runs-on: [self-hosted, gpu]
    # **The shell is named by full path, and `shell: bash` is not used anywhere in this job**
    # (2026-09-16). On this host the runner resolves `bash` for itself -- its own worker log
    # records `Which2: 'bash'` then `Location: 'C:\WINDOWS\system32\bash.EXE'` -- and that
    # is the WSL shim, a Linux bash that cannot read a Windows path and strips the
    # backslashes out of the script path it is handed. Every run on this runner failed at
    # its first bash step that way. A runner `.path` file putting Git's bin first was tried
    # and **did not change the lookup**: the listener was restarted after writing it and the
    # next run resolved `system32` again. Naming the executable is the fix that does not
    # depend on how the runner searches, and the arguments are GitHub's own template for
    # `shell: bash`, so behaviour is otherwise unchanged. Any step added to this job must
    # use the default rather than writing `shell: bash`, or it reintroduces the lookup.
    #
    # **Why the 8.3 short name and not `C:\Program Files\Git\bin\bash.exe`**: the runner splits a
    # custom shell string at its first space and does not honour quotes, so the
    # readable path became the executable `C:\Program` (worker log: `Which2: 'C:\Program'`,
    # then "Second path fragment must not be a drive or UNC name"). `PROGRA~1` is what
    # this host maps `Program Files` to, checked with `for %I in (...) do @echo %~sI`. It is
    # host-specific, which this job already is by its labels; if Git is reinstalled
    # elsewhere or 8.3 names are disabled, the first step fails naming the missing file.
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
    steps:
      - uses: actions/checkout@v4
      # **No toolchain action on a self-hosted runner** (2026-09-16). `dtolnay/rust-toolchain`
      # is a composite action whose every step declares `shell: bash`, and it was the step
      # that failed the first run this workflow ever attempted here: the runner resolved
      # `bash` to the WSL shim at `C:\WINDOWS\system32\bash.exe`, which cannot see a
      # Windows path and ate the backslashes out of the script it was handed. The job's
      # `defaults` now name Git's bash by full path and that failure is gone -- but the action was
      # installing a toolchain onto a machine that already has one, which is work and risk
      # for nothing. `rust-toolchain.toml` pins 1.98 with rustfmt and clippy, and rustup
      # honours it on every `cargo` invocation, so the pin is enforced by the repository
      # rather than by a workflow input that could drift from it.
      - name: Record the toolchain this run used
        run: |
          rustc --version --verbose
          cargo --version
      - name: CPU reference (plain cargo test)
        run: cargo test -p gungnir-data-fusion
      - name: GPU path against the CPU reference
        env:
          GUNGNIR_GPU_TESTS: "1"
        run: |
          set -o pipefail
          cargo test -p gungnir-data-fusion --features gpu-tests -- --ignored 2>&1 | tee gpu-tests.log
      - name: A gate that ran nothing has not passed
        run: |
          ran=$(awk '/^test result:/ { s += $4 } END { print s + 0 }' gpu-tests.log)
          echo "GPU tests executed: $ran"
          if [ "$ran" -eq 0 ]; then
            echo "::error::the GPU test run executed zero tests; the gate cannot pass vacuously (GAP-024)"
            exit 1
          fi
