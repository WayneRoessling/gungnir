# Gate 5: nightly fuzzing of the sensor-ingestion parser, the ASTERIX radar adapter, and association
# cost-matrix construction (docs/agentic-workflow.md). Scheduled, not per-PR.
#
# **The schedule did fire, and the job failed before it fuzzed a single byte** (GAP-061).
# Two independent defects, either of which alone stops the gate; the first hid the second,
# so the second could not be seen until the first was fixed.
#
# **One: the fuzz project directory.** The first nightly ran 2026-09-08T08:06Z and ended
# 0.05 s into the fuzz step with
#
#     Error: could not read the manifest file: /home/runner/work/gungnir/gungnir/fuzz/Cargo.toml
#
# `cargo fuzz` derives its project directory from the located crate root and appends
# `fuzz`; this workspace keeps its fuzz crate at `gungnir-fuzz/`, so the crate *is* the
# fuzz project rather than the parent of one, and the path cargo-fuzz built pointed at a
# `fuzz/` directory that has never existed here. `working-directory: gungnir-fuzz` did not
# help, because that path is resolved from the crate root and not from the working
# directory -- which is why the setting looked right and never was. `--fuzz-dir` names the
# directory explicitly (cargo-fuzz 0.10.2 and later; 0.13.2 is what installs here).
#
# **Two: the toolchain, which is not the one this job asks for.** With the manifest found,
# the run got as far as the build and stopped on
#
#     error: the option `Z` is only accepted on the nightly compiler
#
# from `/home/runner/.rustup/toolchains/1.98-x86_64-unknown-linux-gnu/bin/rustc`. cargo-fuzz
# needs `-Zsanitizer=address`, and `dtolnay/rust-toolchain@nightly` had duly installed
# nightly and made it the rustup default -- but `rust-toolchain.toml` at the repository
# root pins `channel = "1.98"`, and a toolchain file outranks the rustup default. Every
# `cargo` invocation in this job was therefore 1.98 no matter what the setup step did.
# `RUSTUP_TOOLCHAIN` outranks the file in turn, and propagates into the `cargo build`
# cargo-fuzz spawns, which is why it is set on the step rather than passed as `+nightly`
# to the outer command only.
name: fuzz-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      # A crash in one target is a finding about that target, and the other two have
      # earned their twenty minutes regardless. On 2026-09-08 the manifest error above
      # cancelled the two jobs that had not reached the fuzz step, so one broken
      # invocation cost the whole night's coverage rather than a third of it.
      fail-fast: false
      matrix:
        target: [sensor_ingestion_parser, asterix_feed, cost_matrix_construction]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: fuzz ${{ matrix.target }} for 20 minutes
        env:
          # See the header: without this, rust-toolchain.toml pins the build to 1.98 and
          # the sanitizer flags cargo-fuzz requires are rejected as nightly-only.
          RUSTUP_TOOLCHAIN: nightly
        run: cargo fuzz run --fuzz-dir gungnir-fuzz ${{ matrix.target }} -- -max_total_time=1200
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: gungnir-fuzz/artifacts/
          if-no-files-found: ignore
