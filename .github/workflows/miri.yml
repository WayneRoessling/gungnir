# Gate 3: cargo miri on any PR whose diff contains `unsafe`
# (docs/agentic-workflow.md, docs/agentic-coding-standards.md §4).
#
# **On the crates that gained the `unsafe`, since 2026-10-29.** Until then the matrix
# was a fixed list of twelve tracking crates, run in full whenever `unsafe` was added
# anywhere: two hours of runner time, and never the crate the `unsafe` went into unless
# it was one of the twelve. `.github/scripts/miri_matrix.py` now reads the diff and
# emits the matrix, with the per-crate targets and skips that used to be written here
# kept in its table, beside the reasons each long test is left out. A dispatch runs
# every crate in that table, as it always did.
name: miri

on:
  pull_request:
  # Run by hand against any ref, so the gate can be seen to work on a diff with no
  # `unsafe` in it (GAP-164).
  workflow_dispatch:

# Nothing here writes to the repository, and the repository is public.
permissions:
  contents: read

# A push to the pull-request branch supersedes the run in flight for the previous
# push; this workflow never runs on main, so there is nothing that must not be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-unsafe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_unsafe: ${{ steps.scan.outputs.has_unsafe }}
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `unsafe` in added code, not in added comments (2026-10-28): added lines only, with
      # everything from `//` to the end of the line removed, which covers line and doc
      # comments. The scan read every added line before that, so a comment explaining why
      # something is *not* unsafe ran two hours of miri: GAP-215's pull request did, three
      # times. The script maps each hit to its crate and writes the matrix; it fails the
      # job if `unsafe` was added outside a workspace crate, where it cannot run miri, so
      # that a person decides rather than the gate passing on nothing. A dispatch asks
      # for every crate in the script's table.
      - id: scan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 .github/scripts/miri_matrix.py --all >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/miri_matrix.py "origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          fi

  miri:
    needs: detect-unsafe
    if: needs.detect-unsafe.outputs.has_unsafe == 'true'
    runs-on: ubuntu-latest
    # One job per crate, in parallel, none cancelling another (GAP-164). What each crate
    # runs, and which long tests are left out and why, is the table in
    # .github/scripts/miri_matrix.py.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-unsafe.outputs.matrix) }}
    name: miri (${{ matrix.crate }})
    # The slowest job is gungnir-fusion-async at 55 minutes (dispatched run 36253724048,
    # 2026-09-26); the bound leaves room without letting a hang run for hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.crate }}
      # `rust-toolchain.toml` pins a stable release, and a toolchain file outranks the
      # default the action above sets, so a bare `cargo miri` resolves to stable and
      # fails: miri ships only on nightly. `+nightly` outranks the file (GAP-164).
      - run: cargo +nightly miri setup
      - name: miri on ${{ matrix.crate }}
        # The tests read committed fixtures (testdata/) and the clock; miri's isolation
        # refuses both. Disabling it lets them run while miri still checks every access
        # for undefined behaviour, which is what the gate is for (GAP-164).
        # Tree Borrows is the aliasing model (D-90): nalgebra's own Cholesky, 0.33 and
        # 0.35 alike, is rejected under Stacked Borrows and accepted under Tree Borrows,
        # so under the default model the gate fails on a dependency's view code before it
        # reaches anything a pull request adds (GAP-166).
        # Deterministic floats: miri otherwise perturbs each `sin`/`cos`/`exp` result by a
        # few ulp at random, and the tracking core's tests pin bit-for-bit agreement with
        # their oracles and between two evaluations of one formula. Those are properties
        # of the hardware's maths, which the other gates check; this one checks memory.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-deterministic-floats
        run: >-
          cargo +nightly miri test --no-fail-fast -p ${{ matrix.crate }} ${{ matrix.targets }}
          -- ${{ matrix.skip }}
