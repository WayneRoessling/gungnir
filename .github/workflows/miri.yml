# Gate 3: cargo miri on any PR whose diff contains `unsafe`
# (docs/agentic-workflow.md, docs/agentic-coding-standards.md §4).
name: miri

on:
  pull_request:
  # Run by hand against any ref, so the gate can be seen to work on a diff with no
  # `unsafe` in it (GAP-164).
  workflow_dispatch:

# Nothing here writes to the repository, and the repository is public.
permissions:
  contents: read

# A push to the pull-request branch supersedes the run in flight for the previous
# push; this workflow never runs on main, so there is nothing that must not be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-unsafe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_unsafe: ${{ steps.scan.outputs.has_unsafe }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scan
        run: |
          if git diff --unified=0 origin/${{ github.base_ref }}...HEAD -- '*.rs' | grep -E '^\+.*\bunsafe\b' ; then
            echo "has_unsafe=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_unsafe=false" >> "$GITHUB_OUTPUT"
          fi

  miri:
    needs: detect-unsafe
    if: github.event_name == 'workflow_dispatch' || needs.detect-unsafe.outputs.has_unsafe == 'true'
    runs-on: ubuntu-latest
    # One job per crate, in parallel, none cancelling another: miri interprets about a
    # thousand times slower than native code, and the twelve crates in one job ran past a
    # 180-minute bound with four of them unfinished (GAP-164). A crate's own job shows
    # which crate failed or ran out of time, and the bound is just under the hosted
    # runner's six-hour ceiling so the job, not the platform, says so.
    strategy:
      fail-fast: false
      matrix:
        crate:
          - gungnir-core
          - gungnir-coord
          - gungnir-filters
          - gungnir-association
          - gungnir-track
          - gungnir-rfs
          - gungnir-track-fusion
          - gungnir-fusion-async
          - gungnir-allocation
          - gungnir-metrics
          - gungnir-tracking-service
          - gungnir-intercept-service
    name: miri (${{ matrix.crate }})
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.crate }}
      # `rust-toolchain.toml` pins a stable release, and a toolchain file outranks the
      # default the action above sets, so a bare `cargo miri` resolves to stable and
      # fails: miri ships only on nightly. `+nightly` outranks the file (GAP-164).
      - run: cargo +nightly miri setup
      - name: miri on ${{ matrix.crate }}
        # The tests read committed fixtures (testdata/) and the clock; miri's isolation
        # refuses both. Disabling it lets them run while miri still checks every access
        # for undefined behaviour, which is what the gate is for (GAP-164).
        # Tree Borrows is the aliasing model (D-90): nalgebra's own Cholesky, 0.33 and
        # 0.35 alike, is rejected under Stacked Borrows and accepted under Tree Borrows,
        # so under the default model the gate fails on a dependency's view code before it
        # reaches anything a pull request adds (GAP-166).
        # Deterministic floats: miri otherwise perturbs each `sin`/`cos`/`exp` result by a
        # few ulp at random, and the tracking core's tests pin bit-for-bit agreement with
        # their oracles and between two evaluations of one formula. Those are properties
        # of the hardware's maths, which the other gates check; this one checks memory.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-deterministic-floats
        run: cargo +nightly miri test --no-fail-fast -p ${{ matrix.crate }}
