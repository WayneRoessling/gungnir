# Gate 6: benchmark regression. Criterion results on the PR are compared against
# the baseline stored from main (docs/agentic-workflow.md,
# docs/agentic-coding-standards.md §2.6).
#
# **Advisory since 2026-09-07, by the owner, and this is not a widened threshold.**
# The threshold is unchanged at 10%. What changed is that a difference this job cannot
# attribute to the code no longer fails it.
#
# The reason is in the measurement, not in the number. The baseline is saved from a run
# on `main` on one `ubuntu-latest` instance and restored on a *different* instance for
# the pull request, so every comparison is cross-machine. GitHub-hosted runners vary by
# far more than 10% between instances, and the first three runs after this job was made
# able to fail (GAP-093) each reported a different benchmark regressing on a branch that
# touched none of its code:
#
#   * `claude/angular-detections-and-accounts`: node_journal/sync_every_envelope_50 3.485x
#     -- fifty fsync calls, which is cloud-disk latency and nothing else
#   * `claude/pin-cot-type-tree`: startup/to_first_frame 1.256x
#   * `claude/agpl-licensing-review-95cf05`: a third one
#
# On the first of those, every *other* benchmark came out between 0.49x and 0.91x. A
# whole set uniformly faster is the signature of a different machine, not of a change.
# The same branch had passed the same job an hour earlier with no benchmark or journal
# code touched in between.
#
# So the job still runs, still compares, and still prints every ratio and every
# threshold breach. It does not fail the pull request on a number it cannot attribute.
# **This is advisory for good, by the owner's decision D-62 (2026-09-17), and not because
# the work was not done.** Baseline and comparison come from one machine, the four
# sub-nanosecond benchmarks were replaced with real work, and the noise floor was measured
# three times: unchanged code still moved ratios by up to 1.04, and every benchmark crossed
# 10 percent at least once. The host is the owner's workstation, so the noise is the owner
# using it. A regression is found by a person reading these ratios, by the budget
# assertions in gungnir-app/tests/frame_budgets.rs, and by the figures in
# docs/performance-budgets.md -- and this comment exists so that nobody reads the green
# tick as evidence that performance was checked.
#
# **How that was settled** (GAP-093, closed 2026-09-17). The runner arrived 2026-09-15 and
# enforcement did not come with it, for two reasons: no baseline had been written on this
# machine, and this machine's own noise floor had never been measured, with a specific
# reason to expect it to be wide -- an 8 P-core / 12 E-core hybrid, where a benchmark
# scheduled onto an efficiency core runs about twice as slow, against a 10 percent
# threshold. Both were then done, and what they returned is why D-62 reads as it does:
#
# 1. **Pinning to the performance cores did not help.** The cores were read from Windows
#    rather than assumed, and the pinning was verified, and 8 of 12 benchmarks varied
#    *more* pinned than unpinned. Whole runs moved together instead, which is other load
#    on the machine and not the core class. Not adopted; the branch
#    `claude/gate6-pcore-pinning` holds the measurement.
# 2. **Four benchmarks were measuring the timer**, at a nanosecond or less: two
#    placeholders left after their filters were built, and two field reads, one of an
#    empty snapshot. Replaced with real work (a 100-cycle EKF run, a 200-target GM-PHD
#    scan, a walk of a settled track snapshot), and the spread did not narrow.
#
# Three runs of identical code then gave ranges up to 1.04 in ratio, with 25 of 33 ratios
# above 1 -- a single-sample baseline as well as a noisy host. A regression smaller than
# about 2x cannot be told from that, so the threshold stays unenforced here and
# `pull_request` does not come back. The measurements are recorded in
# docs/record/2026-09-17/gate-6-noise-floor-and-core-pinning.md.
#
# **Not on pull requests since 2026-09-09.** While the comparison is advisory and
# cross-machine, a per-PR run is four to five minutes of benchmarks whose ratios the
# job itself says cannot be attributed to the code, and 21 of the last 21 went green
# unread. The baseline still needs writing, so the job runs on every push to main,
# and `workflow_dispatch` from a branch runs the lenient comparison against main's
# baseline on demand -- which is how a person who suspects a regression gets the
# ratios without every pull request paying for them. **The `pull_request` trigger does
# not come back** (D-62): the number does not mean enough on this host, and a different
# machine is out of scope for this release. ci.yml's `benches compile` step is what proves, per pull
# request, that the benchmarks still build.
name: bench-regression

on:
  workflow_dispatch:
  # **Without this the baseline is never written and the gate can never fail** (GAP-093).
  # Both halves of the branch below, and the cache-save step at the end, are guarded on
  # `refs/heads/main`; in a `pull_request` event `github.ref` is `refs/pull/<n>/merge`,
  # so the main half was unreachable and no run ever executed `--save-baseline main`.
  # Every pull request then reported "compared 0 benchmark(s)" and passed -- green, and
  # measuring nothing, which is the failure the recursive-glob fix above it was for.
  push:
    branches: [main]

# Nothing here writes to the repository, and the repository is public.
permissions:
  contents: read

# One run per ref at a time, and never cancelled: a run on main writes the baseline
# and the cargo cache, and a cancelled save leaves the next comparison with nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Set here because `dtolnay/rust-toolchain` used to set it and no longer runs (see the
  # step below). Incremental compilation is already off for the release profile a
  # benchmark builds under, so this changes nothing today; it is written down so that
  # removing the action did not quietly drop a setting the measurements were taken with.
  CARGO_INCREMENTAL: "0"
  # Report a regression when any benchmark's p99 is slower than baseline by more than
  # this fraction. Unchanged; see the header for why the job no longer fails on it.
  BENCH_REGRESSION_THRESHOLD: "0.10"
  # 1 makes a reported regression fail the job. **It stays 0 on this runner** (D-62,
  # 2026-09-17): the baseline and the spread were both measured, and the spread is too
  # wide for a 10 percent threshold to mean anything here. Setting it to 1 on this host
  # would fail pull requests on the owner's own desktop activity.
  BENCH_REGRESSION_ENFORCE: "0"

jobs:
  bench:
    # `gungnir-rtx-5060ti`, the one self-hosted runner registered to this repository
    # (GAP-061). **The `gpu` label is pinning a machine, not requesting a GPU** -- no
    # benchmark here touches one. It is in the list because it is what identifies this
    # particular host today, and the whole point of the move is that every run happens on
    # the same host. **If a second self-hosted runner is ever registered, this must move
    # to a label of its own** (`bench`, on that one machine): `[self-hosted, Windows, X64]`
    # would then match either box and silently restore the cross-machine comparison this
    # change exists to end.
    runs-on: [self-hosted, Windows, X64, gpu]
    # **The shell is named by full path, and `shell: bash` is not used anywhere in this job**
    # (2026-09-16). On this host the runner resolves `bash` for itself -- its own worker log
    # records `Which2: 'bash'` then `Location: 'C:\WINDOWS\system32\bash.EXE'` -- and that
    # is the WSL shim, a Linux bash that cannot read a Windows path and strips the
    # backslashes out of the script path it is handed. Every run on this runner failed at
    # its first bash step that way. A runner `.path` file putting Git's bin first was tried
    # and **did not change the lookup**: the listener was restarted after writing it and the
    # next run resolved `system32` again. Naming the executable is the fix that does not
    # depend on how the runner searches, and the arguments are GitHub's own template for
    # `shell: bash`, so behaviour is otherwise unchanged. Any step added to this job must
    # use the default rather than writing `shell: bash`, or it reintroduces the lookup.
    #
    # **Why the 8.3 short name and not `C:\Program Files\Git\bin\bash.exe`**: the runner splits a
    # custom shell string at its first space and does not honour quotes, so the
    # readable path became the executable `C:\Program` (worker log: `Which2: 'C:\Program'`,
    # then "Second path fragment must not be a drive or UNC name"). `PROGRA~1` is what
    # this host maps `Program Files` to, checked with `for %I in (...) do @echo %~sI`. It is
    # host-specific, which this job already is by its labels; if Git is reinstalled
    # elsewhere or 8.3 names are disabled, the first step fails naming the missing file.
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
    # Four to five minutes warm; a run past twenty is a hung benchmark, not a slow one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # **No toolchain action on a self-hosted runner** (2026-09-16). `dtolnay/rust-toolchain`
      # is a composite action whose every step declares `shell: bash`, and it was the step
      # that failed the first run this workflow ever attempted here: the runner resolved
      # `bash` to the WSL shim at `C:\WINDOWS\system32\bash.exe`, which cannot see a
      # Windows path and ate the backslashes out of the script it was handed. The job's
      # `defaults` now name Git's bash by full path and that failure is gone -- but the action was
      # installing a toolchain onto a machine that already has one, which is work and risk
      # for nothing. `rust-toolchain.toml` pins 1.98 with rustfmt and clippy, and rustup
      # honours it on every `cargo` invocation, so the pin is enforced by the repository
      # rather than by a workflow input that could drift from it.
      - name: Record the toolchain this run used
        run: |
          rustc --version --verbose
          cargo --version
      # **No `Swatinem/rust-cache` on a self-hosted runner** (removed 2026-09-16, after it did
      # damage). Its post-job step cleans `CARGO_HOME` whenever it saves, which here is only a
      # push to main. On a hosted runner `CARGO_HOME` is a throwaway directory; on
      # `gungnir-rtx-5060ti` it is **the owner's own `C:\Users\wayne\.cargo`**. The first
      # save-enabled run on this runner -- the push that merged the 8.3-path fix -- logged
      # `Cleaning cargo/bin ... Cleaning cargo git cache` against that directory and deleted
      # `rustup.exe`, which every `cargo` and `rustc` proxy there links to: the owner's own
      # toolchain stopped working, and so did the GPU job dispatched right after it
      # (`rustc: command not found`, exit 127). The earlier branch runs never saved, so they
      # never cleaned, which is why it surfaced only on main.
      #
      # Nothing is lost by removing it: a persistent runner already keeps the registry and
      # the toolchain between runs, which is the whole of what the action restores. What
      # this job still writes to `CARGO_HOME` is ordinary `cargo` behaviour -- registry
      # downloads -- the same as a local build, and nothing deletes from it. **No action
      # that cleans or prunes `CARGO_HOME` may be added to a job on this runner**; the same
      # rule applies to `gpu-fusion.yml`, which never had one.
      # Per-commit key with a prefix fallback: a cache key is immutable, so saving every
      # main push under one fixed key would keep the first for ever and freeze the
      # baseline at the day it landed. `restore-keys` takes the most recent match.
      # **A self-hosted runner keeps its working directory between runs, and a hosted one
      # does not.** `actions/cache/restore` merges into whatever is already there, so a
      # `target/criterion` left by an earlier run -- of a different branch, or of a
      # dispatch, or of somebody's local `cargo bench` on this workstation -- would be
      # read as the baseline without anything saying so. That is a way to compare against
      # a number nobody chose, and it is new with the move: on `ubuntu-latest` the
      # directory could only ever hold what the restore step put there. Clearing it first
      # makes the restore authoritative again.
      - name: Clear any criterion data this runner kept from an earlier run
        run: rm -rf target/criterion
      - name: Restore baseline from main
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}
          restore-keys: criterion-baseline-main-
      # Two different invocations, and they were run with the same flag, which could not
      # work. The lenient branch is now reached by `workflow_dispatch` from a branch.
      #
      # On main the baseline has to be *written*: `--baseline` only ever compares, so the
      # `main/` directory the cache save step is meant to preserve was never created and
      # the cache could never hold one. `--save-baseline main` writes it.
      #
      # On a pull request it has to be *read*, and tolerantly. `--baseline` panics with
      # "Baseline 'main' must exist before comparison is allowed" when the restored cache
      # is empty, which is every pull request until a main run has saved one -- including
      # the first, so this job could not pass on the commit that introduced it.
      # `--baseline-lenient` compares when the baseline is there and skips the comparison
      # when it is not. The threshold step below already tolerates a missing baseline the
      # same way, so the two now agree.
      # Bash, via the job's `defaults` above rather than `shell: bash` here, and it is
      # required rather than stylistic: a Windows runner defaults to PowerShell, where
      # `if [ "$GITHUB_REF" = ... ]` is a syntax error.
      #
      # The marker is touched first so the step after this one can tell which results
      # this run wrote and which the cache restored; see that step.
      - name: Run benchmarks against the baseline
        run: |
          touch "$RUNNER_TEMP/bench-run-start"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            cargo bench --workspace -- --save-baseline main --noplot
          else
            cargo bench --workspace -- --baseline-lenient main --noplot
          fi
      # **Before the comparison and before the save** (2026-09-17). The baseline is
      # restored into `target/criterion` and saved back out of it, so a removed
      # benchmark's directory was carried into every baseline for ever and compared at
      # exactly 1.000x against itself. `snapshot_calls/tracks` and `/is_healthy` did that
      # after #125 replaced them. The script drops every benchmark this run did not
      # write, judged against the marker above; `bench_prune_stale.py` has the detail.
      - name: Drop results this run did not produce
        run: python3 .github/scripts/bench_prune_stale.py "$RUNNER_TEMP/bench-run-start"
      # The comparison moved to `.github/scripts/bench_compare.py` on 2026-09-16. It was a
      # forty-line Python program inside a YAML block scalar behind a bash heredoc, which
      # meant it could only ever be exercised by pushing to main and reading a log -- and
      # it had twice shipped a defect that made this gate compare nothing and pass
      # (the one-level glob, and the baseline that was never saved). As a file it takes a
      # root argument, so a fixture directory tests the arithmetic without CI; that test
      # is how the extraction was checked, and it is the first time this logic has been
      # run against a known answer.
      #
      # **`--wrote-baseline` on main, because a main run has nothing to compare against**
      # (2026-09-17). `--save-baseline main` overwrites `main/` with this run's own
      # estimates before this step, so the comparison was the run against itself and
      # printed eleven exact `1.000x` lines -- a log that reads like a clean comparison
      # and measures nothing. The script now counts the benchmarks and says the run is
      # the baseline. The real comparison is the next branch dispatch against it.
      - name: Compare p99 against the threshold
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 .github/scripts/bench_compare.py --wrote-baseline
          else
            python3 .github/scripts/bench_compare.py
          fi
      - name: Save baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}
