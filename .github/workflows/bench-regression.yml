# Gate 6: benchmark regression. Criterion results on the PR are compared against
# the baseline stored from main; a p99 regression beyond the threshold fails the
# job (docs/agentic-workflow.md, docs/agentic-coding-standards.md §2.6).
name: bench-regression

on:
  pull_request:
  # **Without this the baseline is never written and the gate can never fail** (GAP-093).
  # Both halves of the branch below, and the cache-save step at the end, are guarded on
  # `refs/heads/main`; in a `pull_request` event `github.ref` is `refs/pull/<n>/merge`,
  # so the main half was unreachable and no run ever executed `--save-baseline main`.
  # Every pull request then reported "compared 0 benchmark(s)" and passed -- green, and
  # measuring nothing, which is the failure the recursive-glob fix above it was for.
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Fail when any benchmark's p99 is slower than baseline by more than this fraction.
  BENCH_REGRESSION_THRESHOLD: "0.10"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      # Per-commit key with a prefix fallback: a cache key is immutable, so saving every
      # main push under one fixed key would keep the first for ever and freeze the
      # baseline at the day it landed. `restore-keys` takes the most recent match.
      - name: Restore baseline from main
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}
          restore-keys: criterion-baseline-main-
      # Two different jobs, and they were run with the same flag, which could not work.
      #
      # On main the baseline has to be *written*: `--baseline` only ever compares, so the
      # `main/` directory the cache save step is meant to preserve was never created and
      # the cache could never hold one. `--save-baseline main` writes it.
      #
      # On a pull request it has to be *read*, and tolerantly. `--baseline` panics with
      # "Baseline 'main' must exist before comparison is allowed" when the restored cache
      # is empty, which is every pull request until a main run has saved one -- including
      # the first, so this job could not pass on the commit that introduced it.
      # `--baseline-lenient` compares when the baseline is there and skips the comparison
      # when it is not. The threshold step below already tolerates a missing baseline the
      # same way, so the two now agree.
      - name: Run benchmarks against the baseline
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            cargo bench --workspace -- --save-baseline main --noplot
          else
            cargo bench --workspace -- --baseline-lenient main --noplot
          fi
      - name: Compare p99 against the threshold
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          threshold = float(os.environ["BENCH_REGRESSION_THRESHOLD"])
          root = pathlib.Path("target/criterion")
          failed = False
          compared = skipped = 0
          # Recursive: criterion writes <group>/<bench>/new/estimates.json for a grouped
          # benchmark and <bench>/new/estimates.json for an ungrouped one. This globbed
          # one level only, matched nothing at all against the real layout, and so
          # compared nothing and passed unconditionally -- a gate that could not fail.
          for est in sorted(root.glob("**/new/estimates.json")):
              name = est.relative_to(root).parent.parent.as_posix()
              base = est.parent.parent / "main" / "estimates.json"
              if not base.exists():
                  skipped += 1
                  continue
              new = json.load(open(est))["mean"]["point_estimate"]
              old = json.load(open(base))["mean"]["point_estimate"]
              ratio = new / old if old else 1.0
              print(f"{name}: {ratio:.3f}x")
              if ratio > 1.0 + threshold:
                  print(f"  REGRESSION: over the {threshold:.0%} threshold")
                  failed = True
              compared += 1
          # Say what was measured. A run that compares nothing is the expected state only
          # until main has saved a baseline; after that it means the wiring broke again,
          # and silence is how that goes unnoticed for months.
          print(f"compared {compared} benchmark(s); {skipped} had no baseline to compare against")
          if compared == 0:
              print("no baseline yet: this is expected until a run on main saves one")
          sys.exit(1 if failed else 0)
          PY
      - name: Save baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}
