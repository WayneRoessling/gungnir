name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # deny.toml is the distributability control for an AGPL workspace (docs/release-
  # governance.md); a dependency under a license outside its allow-list has to fail the
  # pull request that adds it, not the tag months later. Advisories are left to
  # release.yml, so a new CVE in an unrelated crate does not block every PR.
  deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  fmt-clippy-test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for eframe/glow
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: rustc warnings are errors
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets
      # The workspace lint policy (Cargo.toml [workspace.lints]) already denies
      # clippy::all; clippy::pedantic stays advisory, so it is not promoted here.
      - name: clippy (all targets; gate 2 property tests compile here too)
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace
      # The journal-append budget in performance-budgets.md is a release figure (157 us
      # release against about 665 us debug), and a shared runner's throttled I/O put the
      # debug measurement at 1.84 ms against a 1 ms budget -- a failure about the build
      # profile and the hardware, not about the code. The debug run above therefore
      # measures and prints it without asserting, and this step is where the gate is
      # enforced. It must stay: a release-only budget that no job runs in release is a
      # gate that cannot fail.
      - name: budget gates, release profile
        run: cargo test -p gungnir-app --test frame_budgets --release
      - name: benches compile
        run: cargo bench --workspace --no-run

  uaf-registry:
    name: UAF registry and generated views are consistent with the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Regenerate the code-derived views, then fail if the result differs from
      # what is committed (the manifests or the mission set changed without a
      # regeneration) or if the registry check reports a problem.
      - name: regenerate and check
        run: python docs/architecture/uaf/tools/build_uaf.py
      - name: generated files are committed
        run: git diff --exit-code -- docs/architecture/uaf

  gap-register:
    name: The gap register, decision ledger, and roadmap match their generator
    runs-on: ubuntu-latest
    # This job exists because the omission it checks for has already happened twice.
    # decisions-needed.md, gap-register.md, closure-roadmap.md, technical-gap-map.md,
    # and coverage-matrix.md are all generated by gen_gaps.py; nothing enforced that a
    # hand-edit to one of the generated files was also made to the generator, and
    # decisions-needed.md's own "Consequences for the register" section names two
    # occasions this bit: D-34's rows were dropped by a commit whose copy of
    # gen_gaps.py predated the decision, and GAP-092/GAP-093 were restored from git
    # history after the same thing happened to them. Both were found by hand, after
    # the fact, by someone who happened to be looking. This runs the same check the
    # UAF registry job above already runs for its own generator, so the next omission
    # fails a pull request instead of waiting to be noticed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: regenerate
        working-directory: docs/mission/gap-analysis/tools
        run: python gen_gaps.py
      - name: generated files are committed
        run: git diff --exit-code -- docs/mission/gap-analysis

  test-tracks:
    name: Test-track suite renders, generates, and validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Re-render the documents from the YAML sources and regenerate the committed
      # sample sets; fail if either differs from what is committed (a source changed
      # without a regeneration) or if a check reports a problem.
      - name: render the catalogue, profiles, sensor models, and scenario library
        run: python docs/test-tracks/tools/build_catalogue.py
      - name: regenerate the sample sets
        run: python docs/test-tracks/tools/gen_tracks.py
      - name: validate the sample sets
        run: python docs/test-tracks/tools/validate_tracks.py
      - name: rendered documents and sample sets are committed
        run: git diff --exit-code -- docs/test-tracks testdata/tracks/samples

  # GAP-102 (D-41): the point-cloud CRS conversion, which is the one thing in this
  # workspace that a default `cargo test` cannot run.
  #
  # **Why it is a job of its own rather than a flag on `fmt-clippy-test`.** `proj` links
  # `libproj` through `proj-sys` 0.27, which wants a system libproj at >= 9.6.2 from
  # pkg-config and otherwise builds PROJ 9.6.2 from source with cmake. Ubuntu's own
  # `libproj-dev` is older than that minimum, so the source build is the path this job
  # actually takes, and it needs SQLite3 three separate ways: the headers and the library
  # to link against, and the `sqlite3` command line binary, which PROJ's own build runs
  # to generate `proj.db`. That is a few minutes on a cold cache and nothing on a warm
  # one, and keeping it apart means a failure here reads as "the projection build broke"
  # rather than muddying the workspace's main gate.
  #
  # **This is where the conversion is verified at all.** `gungnir-data`'s `crs` feature is
  # off by default because `proj-sys` 0.27 cannot build libproj on Windows MSVC -- it
  # passes `SQLITE3_INCLUDE_DIR`/`SQLITE3_LIBRARY`, which PROJ 9.6.2's CMake rejects by
  # name in favour of `SQLite3_INCLUDE_DIR`/`SQLite3_LIBRARY`, and names the library
  # `libsqlite3.a`, which is not what MSVC produces -- and Windows is the target
  # release.yml ships gungnir-app for. So the feature-gated tests in
  # `gungnir-data/tests/pointcloud_crs.rs`, `gungnir-app/tests/pointcloud_crs.rs`,
  # `gungnir-data/src/geospatial/mod.rs`'s `crs_tests` and `gungnir-app/tests/terrain.rs`
  # run here and nowhere else. If this job is ever removed, that code becomes untested.
  #
  # GAP-023's DEM half arrived behind its own `crs-projection` feature and its own
  # `crs-projection.yml` workflow, which was the first place that code ever built. Both
  # merged into this job when the two halves met: one `proj` link, one feature, one place
  # PROJ is compiled from source per pull request rather than two.
  proj-crs:
    name: DEM and point-cloud CRS conversion (libproj)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Native build dependencies for proj-sys
        # cmake and a C++ toolchain to build PROJ; libsqlite3-dev for the headers and
        # library `libsqlite3-sys` and PROJ both link; sqlite3 for the binary PROJ's
        # build script runs. pkg-config so proj-sys can look for a system libproj first
        # and report cleanly when it does not find an acceptable one.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libsqlite3-dev sqlite3
      # gungnir-app's test binaries link eframe/glow, the same libraries the
      # `fmt, clippy, test` job installs for exactly that reason. This job builds
      # gungnir-app too, so it needs them for the same reason and not a new one.
      - name: System libraries for eframe/glow
        run: sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev
      - name: rustc warnings are errors, with the feature on
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p gungnir-data -p gungnir-app --features crs --all-targets
      - name: clippy, with the feature on
        run: cargo clippy -p gungnir-data -p gungnir-app --features crs --all-targets
      # The conversion itself: `gungnir-data`'s check against an independent pyproj run,
      # and `gungnir-app`'s end-to-end tick through a real `LocalFrame`.
      - name: point clouds -- the conversion against the real fixture
        run: |
          set -o pipefail
          cargo test -p gungnir-data -p gungnir-app --features crs --test pointcloud_crs \
            2>&1 | tee pointcloud.log
      # `crs::to_wgs84` itself, hand-verified against UTM's own central-meridian
      # symmetry (gungnir-data/src/geospatial/mod.rs's `crs_tests`), and the DEM end to
      # end: testdata/dem/small.tif declares EPSG:32633 and has to convert, place and
      # mask line of sight, with its cell spacing landing on 30 / 0.9996 m (GAP-023).
      - name: DEM -- crs::to_wgs84 and the small.tif fixture end to end
        run: |
          set -o pipefail
          cargo test -p gungnir-data --features crs --lib 2>&1 | tee dem-unit.log
          cargo test -p gungnir-app --features crs --test terrain 2>&1 | tee dem-app.log
      # The same anti-vacuous-pass check gpu-fusion.yml uses, carried over from the
      # crs-projection.yml this job absorbed: a feature-gated suite that silently
      # compiled zero tests in (a typo in the cfg, the wrong crate, a renamed feature)
      # would otherwise report success for running nothing.
      - name: a gate that ran nothing has not passed
        shell: bash
        run: |
          ran=$(cat pointcloud.log dem-unit.log dem-app.log \
            | awk '/^test result:/ { s += $4 } END { print s + 0 }')
          echo "crs tests executed: $ran"
          if [ "$ran" -eq 0 ]; then
            echo "::error::the crs test run executed zero tests; the gate cannot pass vacuously (GAP-023, GAP-102)"
            exit 1
          fi

  node-linux-container:
    name: gungnir-node builds for Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: build the headless node only (no UI crates)
        run: cargo build -p gungnir-node --release --target x86_64-unknown-linux-gnu
      - name: container image
        run: docker build -f deploy/node/Dockerfile -t gungnir-node:ci .
