[package]
name = "gungnir-track"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Track lifecycle: init/confirm/coast/delete."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
gungnir-core = { path = "../gungnir-core", version = "0.1.0" }
gungnir-association = { path = "../gungnir-association", version = "0.1.0" }

[dev-dependencies]
# The Stone Soup oracle fixture in testdata/oracles/track/ is JSON; serde_json is an
# already-approved workspace dependency (agentic-coding-standards.md 2.9), dev-only.
serde_json.workspace = true
proptest.workspace = true
gungnir-testkit = { path = "../gungnir-testkit", version = "0.1.0" }
