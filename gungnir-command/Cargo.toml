[package]
name = "gungnir-command"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Human-approval workflow sitting on top of gungnir-policy's verdicts -- the operator-facing accept/override/reject boundary for an intercept plan, with every decision recorded. docs/gungnir-capabilities.md §5.4 -- Critical. Human-owned changes. Pairs with gungnir-policy."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
gungnir-policy = { path = "../gungnir-policy", version = "0.1.0" }
