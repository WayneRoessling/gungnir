[package]
name = "gungnir-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Canonical, versioned operational data model -- TrackView/DetectionView/ResourceView/PlanView and friends, with provenance, quality, identity, timestamps, and classification as first-class fields. Foundational/Critical per docs/gungnir-capabilities.md §5.1 -- the service facades and every productization crate build on this one."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
serde.workspace = true
thiserror.workspace = true
# D-11 / GAP-069. This crate owns `GlobalEntityId`, so it owns the textual form of one:
# a peer that receives an identity has to be able to read and write it, and the format is
# part of what the identity *is*. No generator feature -- minting is `gungnir-identity`'s.
uuid.workspace = true
gungnir-core = { path = "../gungnir-core", version = "0.1.0" }
gungnir-coord = { path = "../gungnir-coord", version = "0.1.0" }

[dev-dependencies]
serde_json.workspace = true
