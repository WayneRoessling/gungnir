[package]
name = "gungnir-ml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The model and feature-extractor traits learned models are held to, a fake model for the consumers' tests, and the dataset extraction from test-track sets into the Arrow form docs/ml/data-pipeline.md documents (GAP-077, GAP-079). OnnxModel, the ort-backed real Model, is real compiling code behind the onnx-runtime feature (off by default: agentic-coding-standards.md §2.9, D-40) -- ort 2.0.0-rc.13's load-dynamic path panics rather than erroring when no compatible ONNX Runtime library is reachable, so it must not run inside default `cargo test`. ModelSet::load reports which named models are unavailable rather than pretending."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[features]
# OFF by default (agentic-coding-standards.md §2.9, "ONNX inference runtime"; checked
# 2026-09-08). Compiling with `ort` present costs nothing -- no C++ toolchain, no network
# fetch, confirmed on a machine with no cmake/clang/gcc installed at all -- so this is not
# a build-time gate. It exists because `ort` 2.0.0-rc.13's `load-dynamic` path panics
# (`ort::api()`'s own doc comment: "May panic if ... Loading the ONNX Runtime dynamic
# library fails") rather than returning a `Result` when no compatible ONNX Runtime binary
# is reachable, and that panic poisons an internal global mutex `ort` itself later locks
# again in an atexit handler, hard-aborting the whole process rather than unwinding --
# reproduced locally, not theorised. Every environment this change has run in lacks a
# compatible ONNX Runtime binary, so enabling this by default would make that abort
# routine rather than exceptional. `OnnxModel::load` still exists, still compiles, and
# still is the real `ort::Session` integration a deployment can opt into once it has
# supplied a real `libonnxruntime`/`onnxruntime.dll` via `ORT_DYLIB_PATH` -- it is simply
# never called by anything `cargo test --workspace` (no `--features`) reaches.
onnx-runtime = ["dep:ort"]

[lints]
workspace = true

[dependencies]
arrow.workspace = true
# The truth's kinematics are placed in a `TrackView` state vector for the extractor.
nalgebra.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The dataset's content hash (docs/ml/data-pipeline.md §5): a model card names the
# dataset it was trained on by this; OnnxModel::load also uses it to verify a model
# artefact against its manifest's sha256 before the bytes reach the runtime.
sha2.workspace = true
# OnnxModel, the Model trait's real backend (GAP-077, D-40), behind the onnx-runtime
# feature above. load-dynamic: see the workspace Cargo.toml's own comment on this
# dependency and agentic-coding-standards.md §2.9 for the full reasoning.
ort = { workspace = true, optional = true }
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
# The dataset's Arrow schema is a catalogue entry, so a dataset and the wire format share
# one definition (docs/ml/data-pipeline.md §2). Edge (q) in ARCHITECTURE.md §7.1.
gungnir-interop = { path = "../gungnir-interop", version = "0.1.0" }
