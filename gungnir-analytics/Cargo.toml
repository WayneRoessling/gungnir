[package]
name = "gungnir-analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Advanced 3D analytical functions -- line-of-sight, viewshed, sensor-coverage volumes, terrain masking, route deconfliction -- as standalone CPU services rendered by gungnir-viewport3d rather than embedded in it. docs/gungnir-capabilities.md §5.3 -- Medium."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
gungnir-coord = { path = "../gungnir-coord", version = "0.1.0" }
gungnir-data = { path = "../gungnir-data", version = "0.1.0" }
gungnir-geo = { path = "../gungnir-geo", version = "0.1.0" }
# docs/design/dependency-edges.md: accepted by the engineering reviewer 2026-09-05
# so `coverage_from_registry` can build coverage input from live sensor records.
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
gungnir-sensor-management = { path = "../gungnir-sensor-management", version = "0.1.0" }

[dev-dependencies]
gungnir-config = { path = "../gungnir-config", version = "0.1.0" }
