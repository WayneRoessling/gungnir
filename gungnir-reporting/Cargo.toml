[package]
name = "gungnir-reporting"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mission reports and export packages with provenance preserved: every figure traces back to the recorded event journal it was computed from. docs/gungnir-capabilities.md §5.6 -- Lower."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
gungnir-eventing = { path = "../gungnir-eventing", version = "0.1.0" }
gungnir-store = { path = "../gungnir-store", version = "0.1.0" }
gungnir-metrics = { path = "../gungnir-metrics", version = "0.1.0" }
# docs/design/dependency-edges.md: accepted by the engineering reviewer 2026-09-05.
# An order of battle is a list of entities, not of tracks, and the lineage is
# what makes an entry defensible when an analyst asks why two sightings are one.
gungnir-identity = { path = "../gungnir-identity", version = "0.1.0" }
