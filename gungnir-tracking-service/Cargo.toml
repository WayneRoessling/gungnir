[package]
name = "gungnir-tracking-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "App-facing facade over the tracking/estimation core. Owns the IMM bank, associator, track manager, and async multi-rate/OOS fusion pipeline behind one trait, and projects the core's kinematic Track into the canonical gungnir-model TrackView. See ARCHITECTURE.md §2."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
crossbeam-channel.workspace = true
gungnir-core = { path = "../gungnir-core", version = "0.1.0" }
gungnir-coord = { path = "../gungnir-coord", version = "0.1.0" }
gungnir-filters = { path = "../gungnir-filters", version = "0.1.0" }
gungnir-association = { path = "../gungnir-association", version = "0.1.0" }
gungnir-track = { path = "../gungnir-track", version = "0.1.0" }
gungnir-rfs = { path = "../gungnir-rfs", version = "0.1.0" }
gungnir-track-fusion = { path = "../gungnir-track-fusion", version = "0.1.0" }
gungnir-fusion-async = { path = "../gungnir-fusion-async", version = "0.1.0" }
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }

[dev-dependencies]
# The §2 whole-pipeline replay row names the five scenarios, so the test generates them
# on a seeded generator. Dev-only; the graph test reads normal dependencies alone.
gungnir-scenario = { path = "../gungnir-scenario", version = "0.1.0" }
rand.workspace = true
gungnir-oracle = { path = "../gungnir-oracle", version = "0.1.0" }
# The plan-07 sample sets in testdata/tracks/samples/ are JSON lines, and GAP-076 asks
# for one of them through this crate's replay; serde_json is an already-approved
# workspace dependency (agentic-coding-standards.md §2.9) and this is a dev-dependency
# only, so no runtime edge changes and ARCHITECTURE.md §7.1 is untouched.
serde_json.workspace = true
