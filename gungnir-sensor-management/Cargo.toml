[package]
name = "gungnir-sensor-management"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sensor registry (identity, modality, location, calibration version, operating state) plus tasking, mode management, and coverage planning. docs/gungnir-capabilities.md §5.2 -- High."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
gungnir-coord = { path = "../gungnir-coord", version = "0.1.0" }
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
gungnir-config = { path = "../gungnir-config", version = "0.1.0" }
