[package]
name = "gungnir-scenario"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ground-truth + sensor simulation, five-scenario generator. Test/bench dependency only -- never a normal dependency of a production crate."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
rand.workspace = true
rand_distr.workspace = true
serde.workspace = true
thiserror.workspace = true
# D-31: the four plan-07 YAML files, loaded as typed data (library.rs).
yaml_serde.workspace = true
# GAP-016: the two JSON descriptors of a generated set (sensors.json, metadata.json).
serde_json.workspace = true
gungnir-core = { path = "../gungnir-core", version = "0.1.0" }
gungnir-coord = { path = "../gungnir-coord", version = "0.1.0" }
gungnir-fusion-async = { path = "../gungnir-fusion-async", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
gungnir-testkit = { path = "../gungnir-testkit", version = "0.1.0" }
