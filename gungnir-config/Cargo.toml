[package]
name = "gungnir-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Managed, versioned, validated configuration for sensor definitions, filter/association selection, thresholds, allocation weights, backend selection (embedded or remote), and service-node settings. docs/gungnir-capabilities.md §5.1 -- High. Pairs with gungnir-mission."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
