[package]
name = "gungnir-assessment"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Threat/risk scoring, predicted time-to-impact, asset exposure, confidence-aware prioritization feeding the allocation decision's reward matrix. docs/gungnir-capabilities.md §5.4 -- Medium."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
thiserror.workspace = true
serde.workspace = true
gungnir-model = { path = "../gungnir-model" }
