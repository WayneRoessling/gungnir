[package]
name = "gungnir-allocation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bellman/DP resource-to-track assignment."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
thiserror.workspace = true
serde.workspace = true
gungnir-core = { path = "../gungnir-core", version = "0.1.0" }

[dev-dependencies]
# The oracle fixture for the §1 allocation row is JSON, read only by the differential
# test (`tests/bellman_diff.rs`).
serde.workspace = true
serde_json.workspace = true
proptest.workspace = true
gungnir-testkit = { path = "../gungnir-testkit", version = "0.1.0" }
