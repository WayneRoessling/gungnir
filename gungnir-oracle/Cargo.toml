[package]
name = "gungnir-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Differential-test harness against Python/MATLAB oracles. Depends on everything; nothing depends on it."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
gungnir-filters = { path = "../gungnir-filters" }
gungnir-association = { path = "../gungnir-association" }
gungnir-rfs = { path = "../gungnir-rfs" }
gungnir-scenario = { path = "../gungnir-scenario" }
tracing-subscriber.workspace = true

[dev-dependencies]
proptest.workspace = true
gungnir-testkit = { path = "../gungnir-testkit" }
