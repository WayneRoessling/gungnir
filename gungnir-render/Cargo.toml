[package]
name = "gungnir-render"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Shared wgpu device/queue/surface management + egui<->wgpu render pass wiring, per rust-ui-architecture-coding-standards.md §1. No tracking-domain knowledge."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
wgpu.workspace = true
egui.workspace = true
tracing.workspace = true
thiserror.workspace = true
