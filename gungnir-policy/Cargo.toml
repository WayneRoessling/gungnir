[package]
name = "gungnir-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authority model, geofence/no-go enforcement, and policy evaluation sitting in front of the Intercept Planning Service's output. docs/gungnir-capabilities.md §5.4 -- Critical. Human-owned changes (agentic-workflow.md). Pairs with gungnir-command."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
gungnir-geo = { path = "../gungnir-geo", version = "0.1.0" }
