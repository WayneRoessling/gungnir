[package]
name = "gungnir-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent global track/entity identity across feeds -- aliases, merge/split history, supersession -- beyond the tracking core's internal track IDs. docs/gungnir-capabilities.md §5.3 -- High."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
gungnir-model = { path = "../gungnir-model" }
# D-11 / GAP-069: this crate mints identities, so it is the one that needs a generator.
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
nalgebra.workspace = true
