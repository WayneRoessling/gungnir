  - id: sea.amphibious-auxiliary
    domain: sea
    name: Amphibious, auxiliary, and civil traffic
    description: Landing ships, tankers, merchants, ferries, and fishing boats, slow and predictable, AIS on for the larger ones; the bulk of the surface picture.
    envelope: {speed_mps: [0, 13], altitude_m: [0, 0], climb_mps: [0, 0], turn_g: [0.02, 0.4], accel_mps2: [0, 0.5]}
    phases:
