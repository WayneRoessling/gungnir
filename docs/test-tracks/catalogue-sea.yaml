# Sea platforms (plan 07 catalogue). See catalogue.yaml for the field definitions.
# Depth applies to the submarine class only; all sea classes are tracked at the
# surface (altitude 0) for the surface picture.
domain: sea
reviewer: subject-matter reviewer (maritime), pending
platforms:
  - id: magura-v5
    name: Magura V5
    class: sea.usv
    side: blue
    role: uncrewed surface vessel, attack and reconnaissance
    speed_mps: [8, 22]
    altitude_m: [0, 0]
    typical_altitude_m: [0, 0]
    climb_mps: [0, 0]
    turn_g: [0.2, 0.8]
    endurance_h: [20, 60]
    range_km: [450, 800]
    rcs_class: very-small
    ir_class: low
    acoustic_class: moderate
    emissions: satellite or radio control link
    sources:
      - {ref: "Public reporting and manufacturer statements on Magura V5, 2023 to 2025", fields: [speed, range, endurance], note: "42 knots maximum and 22 knots cruise reported"}
    confidence: medium
  - id: sea-baby
    name: Sea Baby class
    class: sea.usv
    side: blue
    role: uncrewed surface vessel, attack
    speed_mps: [8, 25]
    altitude_m: [0, 0]
    typical_altitude_m: [0, 0]
    climb_mps: [0, 0]
    turn_g: [0.2, 0.8]
    endurance_h: [20, 60]
    range_km: [800, 1000]
    rcs_class: very-small
    ir_class: low
    acoustic_class: moderate
    emissions: satellite or radio control link
    sources:
      - {ref: "Public reporting on Sea Baby class vessels, 2023 to 2025", fields: [speed, range], note: "claimed figures from few sources"}
    confidence: low
  - id: raptor-patrol-boat
    name: Raptor class patrol boat (Project 03160)
    class: sea.fast-craft
    side: red
    role: fast patrol boat
    speed_mps: [5, 25]
    altitude_m: [0, 0]
    typical_altitude_m: [0, 0]
    climb_mps: [0, 0]
    turn_g: [0.1, 0.5]
    endurance_h: [12, 36]
    range_km: [500, 600]
    rcs_class: medium
    ir_class: medium
    acoustic_class: loud
    emissions: navigation radar; radio; AIS when in civil traffic
    sources:
      - {ref: "Wikipedia article Raptor-class patrol boat, accessed 2026-09", fields: [speed, range]}
    confidence: high
