#   realizes     service               -> activity        (activity to service)
#   implements   resource              -> service         (service to resource)
#   conforms_to  resource              -> standard        (resource to standard)
#   uses         resource              -> resource        GENERATED from Cargo.toml
# `status: planned` marks a relationship the design intends but the code does not
# yet carry; the consistency check treats planned as satisfied but reports it.

