  - {id: RS-data-fusion, name: gungnir-data-fusion, kind: library, layer: "Data ecosystem", code: gungnir-data-fusion/Cargo.toml, description: "GPU-accelerated point cloud registration/fusion (point-to-plane ICP) on wgpu compute, per rust-3d-data-ecosystem-build-vs-adopt.md §3. The one genuine ecosystem gap identified -- kept as its own crate, separate from gungnir-data, because it's the only data-layer crate that needs a wgpu::Device (borrowed from gungnir-render)."}
  - {id: RS-data, name: gungnir-data, kind: library, layer: "Data ecosystem", code: gungnir-data/Cargo.toml, description: "File I/O for point cloud / VTK scientific mesh / terrain / glTF, per rust-3d-data-ecosystem-build-vs-adopt.md §1. No egui/three-d/wgpu dependency -- unit-testable with plain cargo test."}
  - {id: RS-decision, name: gungnir-decision, kind: library, layer: "Productization", code: gungnir-decision/Cargo.toml, description: "Course-of-action generation and comparison, constraint handling, what-if simulation against a live snapshot, and recommendation explanations -- beyond single-solution DP allocation. docs/gungnir-capabilities.md §5.4 -- Medium."}
  - {id: RS-eventing, name: gungnir-eventing, kind: library, layer: "Productization", code: gungnir-eventing/Cargo.toml, description: "Transport-neutral broadcast event bus (in-process today; a durable/replayable log or network stream behind the same trait later). docs/gungnir-capabilities.md §5.1 -- High. Replaces the UI polling a mutable slice every frame."}
  - {id: RS-filters, name: gungnir-filters, kind: library, layer: "Tracking core", code: gungnir-filters/Cargo.toml, description: "KF/EKF/UKF/PF/IMM/sqrt-UDU/RTS state estimation."}
  - {id: RS-fusion-async, name: gungnir-fusion-async, kind: library, layer: "Tracking core", code: gungnir-fusion-async/Cargo.toml, description: "OOS handling / multi-rate async fusion pipeline. The only crate that uses the tokio runtime; the runtime is owned by the host binary."}
  - {id: RS-fuzz, name: gungnir-fuzz, kind: library, layer: "Tracking core", code: gungnir-fuzz/Cargo.toml, description: ""}
  - {id: RS-geo, name: gungnir-geo, kind: library, layer: "Productization", code: gungnir-geo/Cargo.toml, description: "Coordinate-reference-system governance, map/imagery layers, geocoding, vector features, spatial indexing, and geofencing. docs/gungnir-capabilities.md §5.3 -- Medium."}
  - {id: RS-identification, name: gungnir-identification, kind: library, layer: "Productization", code: gungnir-identification/Cargo.toml, description: "Friend/foe/unknown track classification from an evidence-fusion process. gungnir-capabilities.md §5.3 -- Medium."}
  - {id: RS-identity, name: gungnir-identity, kind: library, layer: "Productization", code: gungnir-identity/Cargo.toml, description: "Persistent global track/entity identity across feeds -- aliases, merge/split history, supersession -- beyond the tracking core's internal track IDs. docs/gungnir-capabilities.md §5.3 -- High."}
  - {id: RS-ingest, name: gungnir-ingest, kind: library, layer: "Productization", code: gungnir-ingest/Cargo.toml, description: "Protocol-specific adapters plus a validation/authentication/quarantine gateway that normalizes live, recorded, and simulated sources into the canonical DetectionView before anything reaches the Tracking Service. docs/gungnir-capabilities.md §5.2 -- Critical. Gateway changes are human-owned."}
  - {id: RS-intercept-service, name: gungnir-intercept-service, kind: library, layer: "Service facades", code: gungnir-intercept-service/Cargo.toml, description: "App-facing facade over gungnir-allocation + gungnir-coord: turns current tracks + available resources into an intercept/tasking plan (gungnir-model PlanView). Kept separate from gungnir-tracking-service because it answers 'what should we do' rather than 'where are they' -- see ARCHITECTURE.md §2."}
  - {id: RS-interop, name: gungnir-interop, kind: library, layer: "Productization", code: gungnir-interop/Cargo.toml, description: "Data standards & interoperability: the schema catalog with version negotiation, the Arrow representation of detections, and the ASTERIX/STANAG codec boundary that gungnir-ingest adapters and gungnir-reporting exports use. docs/gungnir-capabilities.md §5.6 and §1 (interop schema row) -- Medium."}
  - {id: RS-metrics, name: gungnir-metrics, kind: library, layer: "Tracking core", code: gungnir-metrics/Cargo.toml, description: "MOTA/MOTP, purity/fragmentation, track-to-truth assignment."}
  - {id: RS-mission, name: gungnir-mission, kind: library, layer: "Productization", code: gungnir-mission/Cargo.toml, description: "Mission/session lifecycle: create/load/save/replay/close, plus scenario binding. gungnir-capabilities.md §5.1 -- High. Pairs with gungnir-config."}
  - {id: RS-ml, name: gungnir-ml, kind: library, layer: "Unassigned", code: gungnir-ml/Cargo.toml, description: "The model and feature-extractor traits learned models are held to, a fake model for the consumers' tests, and the dataset extraction from test-track sets into the Arrow form docs/ml/data-pipeline.md documents (GAP-077, GAP-079). OnnxModel, the ort-backed real Model, is real compiling code behind the onnx-runtime feature (off by default: agentic-coding-standards.md §2.9, D-40) -- ort 2.0.0-rc.13's load-dynamic path panics rather than erroring when no compatible ONNX Runtime library is reachable, so it must not run inside default `cargo test`. ModelSet::load reports which named models are unavailable rather than pretending."}
  - {id: RS-model, name: gungnir-model, kind: library, layer: "Foundation model", code: gungnir-model/Cargo.toml, description: "Canonical, versioned operational data model -- TrackView/DetectionView/ResourceView/PlanView and friends, with provenance, quality, identity, timestamps, and classification as first-class fields. Foundational/Critical per docs/gungnir-capabilities.md §5.1 -- the service facades and every productization crate build on this one."}
  - {id: RS-modelops, name: gungnir-modelops, kind: library, layer: "Productization", code: gungnir-modelops/Cargo.toml, description: "Registry for selecting, tuning, comparing, validating, promoting, and rolling back filter/association configurations by mission profile, and (GAP-078) the model artefact -- name, version, hash, evaluation record -- a baseline optionally carries alongside its tracking configuration through the same promotion state machine. gungnir-capabilities.md §5.4 -- Medium."}
  - {id: RS-node, name: gungnir-node, kind: binary, layer: "Deployment", code: gungnir-node/Cargo.toml, description: "Headless service-node binary for the on-prem and cloud profiles (ARCHITECTURE.md §8.1): hosts the services layer and the authoritative gungnir-store journal behind gungnir-api. Targets Linux x86_64 containers; depends on no UI, three-d, or wgpu crate."}
  - {id: RS-observability, name: gungnir-observability, kind: library, layer: "Productization", code: gungnir-observability/Cargo.toml, description: "Production-facing metrics, structured logs, distributed traces, health checks, watchdogs, and alert correlation -- extends the developer-facing tracing instrumentation into an operator-facing system-status capability. gungnir-capabilities.md §5.5 -- High."}
  - {id: RS-oracle, name: gungnir-oracle, kind: library, layer: "Tracking core", code: gungnir-oracle/Cargo.toml, description: "Differential-test harness against Python/MATLAB oracles. Depends on everything; nothing depends on it."}
  - {id: RS-policy, name: gungnir-policy, kind: library, layer: "Productization", code: gungnir-policy/Cargo.toml, description: "Authority model, geofence/no-go enforcement, and policy evaluation sitting in front of the Intercept Planning Service's output. docs/gungnir-capabilities.md §5.4 -- Critical. Human-owned changes (agentic-workflow.md). Pairs with gungnir-command."}
  - {id: RS-remote, name: gungnir-remote, kind: library, layer: "Deployment", code: gungnir-remote/Cargo.toml, description: "Remote implementations of the TrackingService and InterceptService traits that talk to a gungnir-node over gungnir-api, so the desktop switches between the embedded and connected profiles without any UI change (ARCHITECTURE.md §8.2). Store-and-forward while disconnected."}
  - {id: RS-render, name: gungnir-render, kind: library, layer: "Data ecosystem", code: gungnir-render/Cargo.toml, description: "Shared wgpu device/queue/surface management + egui<->wgpu render pass wiring, per rust-ui-architecture-coding-standards.md §1. No tracking-domain knowledge."}
  - {id: RS-replay, name: gungnir-replay, kind: library, layer: "Productization", code: gungnir-replay/Cargo.toml, description: "Deterministic session playback, timeline scrubbing, and recorded-data replay -- reads gungnir-store's event journal through a gungnir-time ReplayClockAuthority. docs/gungnir-capabilities.md §5.6 -- Lower."}
  - {id: RS-reporting, name: gungnir-reporting, kind: library, layer: "Productization", code: gungnir-reporting/Cargo.toml, description: "Mission reports and export packages with provenance preserved: every figure traces back to the recorded event journal it was computed from. docs/gungnir-capabilities.md §5.6 -- Lower."}
  - {id: RS-resilience, name: gungnir-resilience, kind: library, layer: "Productization", code: gungnir-resilience/Cargo.toml, description: "Resilience & disconnected operations: store-and-forward of envelopes while a node is unreachable, checkpoints, and journal reconciliation after the link returns (ARCHITECTURE.md §8.4). docs/gungnir-capabilities.md §5.6 -- Medium."}
  - {id: RS-rfs, name: gungnir-rfs, kind: library, layer: "Tracking core", code: gungnir-rfs/Cargo.toml, description: "PHD/CPHD, GLMB/LMB random finite set filters."}
  - {id: RS-scenario, name: gungnir-scenario, kind: library, layer: "Tracking core", code: gungnir-scenario/Cargo.toml, description: "Ground-truth + sensor simulation, five-scenario generator. Test/bench dependency only -- never a normal dependency of a production crate."}
  - {id: RS-security, name: gungnir-security, kind: library, layer: "Productization", code: gungnir-security/Cargo.toml, description: "Authentication, role/attribute-based authorization, encryption in transit and at rest, secrets/key management, signed binaries and configuration, audit logging. gungnir-capabilities.md §5.5 -- Critical."}
  - {id: RS-sensor-management, name: gungnir-sensor-management, kind: library, layer: "Productization", code: gungnir-sensor-management/Cargo.toml, description: "Sensor registry (identity, modality, location, calibration version, operating state) plus tasking, mode management, and coverage planning. docs/gungnir-capabilities.md §5.2 -- High."}
  - {id: RS-store, name: gungnir-store, kind: library, layer: "Productization", code: gungnir-store/Cargo.toml, description: "Durable storage for mission sessions (an append-only JSON-lines event journal), replay artifacts, configuration baselines, and audit logs, with an explicit retention/deletion policy. docs/gungnir-capabilities.md §5.1 -- High."}
  - {id: RS-testkit, name: gungnir-testkit, kind: library, layer: "Tracking core", code: gungnir-testkit/Cargo.toml, description: "Shared proptest strategies for the tracking core. Depends on no workspace crate (so it can be a dev-dependency of every one of them without a dev-dependency cycle); nothing depends on it at runtime."}
  - {id: RS-time, name: gungnir-time, kind: library, layer: "Productization", code: gungnir-time/Cargo.toml, description: "Clock discipline across sensors: source-time vs. receipt-time semantics, late-data policy, deterministic replay-time control, synchronization health. docs/gungnir-capabilities.md §5.2 -- Critical."}
  - {id: RS-track-fusion, name: gungnir-track-fusion, kind: library, layer: "Tracking core", code: gungnir-track-fusion/Cargo.toml, description: "Track-to-track fusion (CI/info-matrix), sensor registration/bias."}
  - {id: RS-track, name: gungnir-track, kind: library, layer: "Tracking core", code: gungnir-track/Cargo.toml, description: "Track lifecycle: init/confirm/coast/delete."}
  - {id: RS-tracking-service, name: gungnir-tracking-service, kind: library, layer: "Service facades", code: gungnir-tracking-service/Cargo.toml, description: "App-facing facade over the tracking/estimation core. Owns the IMM bank, associator, track manager, and async multi-rate/OOS fusion pipeline behind one trait, and projects the core's kinematic Track into the canonical gungnir-model TrackView. See ARCHITECTURE.md §2."}
  - {id: RS-ui, name: gungnir-ui, kind: library, layer: "User interface", code: gungnir-ui/Cargo.toml, description: "2D egui dashboard panels + centralized theme, per rust-ui-architecture-coding-standards.md §1/§6. One file per panel; no magic layout numbers. Reads gungnir-model views only; holds no state of its own."}
  - {id: RS-viewport3d, name: gungnir-viewport3d, kind: library, layer: "User interface", code: gungnir-viewport3d/Cargo.toml, description: "three-d scene setup, camera, streaming/scientific data bridges, and live track/intercept rendering, drawn into eframe's OpenGL (glow) context. Combines rust-3d-data-ecosystem-build-vs-adopt.md §2 with gungnir-model views -- see ARCHITECTURE.md §4-5 for why track rendering lives here rather than in a translation crate."}
  - {id: RS-workflow, name: gungnir-workflow, kind: library, layer: "Productization", code: gungnir-workflow/Cargo.toml, description: "Human factors & operator workflow: role-based workspace layouts, the alert acknowledgement/escalation lifecycle, annotations and cases -- turning a set of panels into a designed operator workflow. docs/gungnir-capabilities.md §5.6 -- Medium."}
