information_elements:
  - {id: IE-01, name: DetectionView, code: gungnir_model::DetectionView, description: The canonical observation after validation; sensor, source time, receipt time, ENU measurement, provenance.}
  - {id: IE-02, name: TrackView, code: gungnir_model::TrackView, description: The canonical track; state, covariance, classification, provenance, quality, mission time.}
  - {id: IE-03, name: ResourceView, code: gungnir_model::ResourceView, description: A taskable resource; position, capacity, readiness.}
  - {id: IE-04, name: PlanView, code: gungnir_model::PlanView, description: The intercept service's recommendation; solutions and policy value.}
  - {id: IE-05, name: InterceptSolutionView, code: gungnir_model::InterceptSolutionView, description: One resource-to-track pairing with intercept point and time (None until the solver exists).}
  - {id: IE-06, name: SystemHealth, code: gungnir_model::SystemHealth, description: Tracking, intercept, and ingest health flags as reported, never inferred.}
  - {id: IE-07, name: Provenance, code: gungnir_model::Provenance, description: Source sensors, calibration baseline, algorithm version.}
  - {id: IE-08, name: Quality, code: gungnir_model::Quality, description: Association confidence, latency, staleness.}
  - {id: IE-09, name: Classification, code: gungnir_model::Classification, description: Unknown, Neutral, Friendly, Hostile.}
  - {id: IE-10, name: MissionTime, code: gungnir_model::MissionTime, description: Seconds on the mission clock.}
  - {id: IE-11, name: GlobalEntityId, code: gungnir_model::GlobalEntityId, description: Persistent identity across sessions (u128; uuid v7 under GAP-069).}
  - {id: IE-12, name: Envelope, code: gungnir_eventing::Envelope, description: Sequence number, mission time, and one Event; the unit the bus carries and the journal stores.}
  - {id: IE-13, name: TrackingEvent, code: gungnir_model::events::TrackingEvent, description: TrackInitiated, TrackUpdated, TrackCoasting, TrackDeleted.}
  - {id: IE-14, name: InterceptEvent, code: gungnir_model::events::InterceptEvent, description: PlanProposed, PlanApproved, PlanSuperseded.}
  - {id: IE-15, name: IngestEvent, code: gungnir_model::events::IngestEvent, description: Accepted or Quarantined with reason.}
  - {id: IE-16, name: CommandEvent, code: gungnir_model::events::CommandEvent, description: ApprovalRequested; Decided with plan, accepted, operator.}
  - {id: IE-17, name: ConfigBaseline, code: gungnir_config::ConfigBaseline, description: Versioned, validated configuration; sensors, resources, tracking, backend, node, horizon, data directory.}
  - {id: IE-18, name: DecisionRecord, code: gungnir_command::DecisionRecord, description: Who decided what on which plan, with verdict and time.}
  - {id: IE-19, name: PolicyVerdict, code: gungnir_policy::PolicyVerdict, description: Approved (never by built-in engines), Denied with reason, RequiresHumanApproval.}
  - {id: IE-20, name: AuditEntry, code: gungnir_security::AuditEntry, description: Actor, action, time, outcome; append-only.}
  - {id: IE-21, name: Alert and AlertLifecycle, code: gungnir_workflow::AlertLifecycle, description: Alert with severity; New, Acknowledged, Escalated, Closed with history.}
  - {id: IE-22, name: SnapshotResponse, code: gungnir_api::v1::SnapshotResponse, description: Schema version, tracks, plan, health.}
  - {id: IE-23, name: ApprovalRequest, code: gungnir_api::v1::ApprovalRequest, description: Plan id, accepted, operator.}
  - {id: IE-24, name: SubmitDetectionRequest, code: gungnir_api::v1::SubmitDetectionRequest, description: One DetectionView for the gateway.}
  - {id: IE-25, name: SubscribeRequest, code: gungnir_api::v1::SubscribeRequest, description: The first frame of the event stream; from_seq.}
  - {id: IE-26, name: SchemaEntry, code: gungnir_interop::SchemaEntry, description: Name, version, kind of a schema the build speaks.}
  - {id: IE-27, name: SensorRecord and CoverageRegion, code: gungnir_sensor_management::SensorRecord, description: Identity, modality, location, calibration version, mode; coverage geometry.}
  - {id: IE-28, name: Report, code: gungnir_reporting, description: A mission report or export with figures traceable to the journal.}
  - {id: IE-29, name: IdentificationEvidence, code: gungnir_identification, description: One piece of evidence with source and weight toward a classification.}
  - {id: IE-30, name: RiskScore, code: gungnir_assessment, description: Threat score per track with contributing factors.}
  - {id: IE-31, name: ReconciliationReport, code: gungnir_resilience, description: Merged journal statistics and the conflicting decisions found.}
  - {id: IE-32, name: WorkspaceLayout, code: gungnir_workflow::WorkspaceLayout, description: The panels a role sees, in order.}
  - {id: IE-33, name: Mission and SessionId, code: gungnir_mission::Mission, description: A session with its state and configuration.}

