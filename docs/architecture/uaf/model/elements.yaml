# UAF element registry (plan 03). The one list of named things that every UAF view,
# TOGAF document, capability statement, and gap entry references by identifier, so
# the same thing has one name everywhere. Identifiers are stable: append, never
# renumber, never reuse. Relationships live in relationships.yaml.
#
# Sections and their sources:
#   capabilities            plan 04, docs/mission/capabilities/capability-taxonomy.md
#   operational_performers  plan 02, docs/mission/roles-and-stakeholders.md; logical nodes
#   operational_activities  plan 02, the step tables in docs/mission/mission-threads.md
#   services                the service traits in the crates (tools/build_uaf.py checks them)
#   resources               GENERATED from the crate manifests by tools/build_uaf.py
#   personnel_types         gungnir_security::Role plus the roles adopted under D-05
#   standards               gungnir_interop::SchemaCatalog, docs/gungnir-api-v1.md, release governance
#   projects                docs/gungnir-capabilities.md §7 increments and docs/plans/
#   information_elements    gungnir-model and the productization crates' record types
#   actual_resources        ARCHITECTURE.md §8 profiles and §9 platform assumptions
#
# Every entry: id, name, and where useful description, owner (which plan or code
# path is the source of truth), status (real | scaffold | planned) and code (the
# Rust path the element corresponds to).

schema_version: 2
updated: 2026-09-04

