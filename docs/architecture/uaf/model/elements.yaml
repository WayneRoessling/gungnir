# Operational performers: the roles (as logical performers), the organizational
# nodes they sit in, the external parties, and the command-and-control system as a
# logical performer with its parts. Roles are people; see personnel_types for the
# same eight as personnel.
operational_performers:
  - {id: OP-01, name: Operator, kind: role, owner: plan-02, description: Runs the live picture for a domain at a site or the sector; decides engagements within delegated authority.}
  - {id: OP-02, name: Supervisor, kind: role, owner: plan-02, description: Runs the sector; manages the recommendation queue, weapons control status, holds, degraded-state acknowledgement, reconciliation conflicts, plan apply.}
  - {id: OP-03, name: Analyst, kind: role, owner: plan-02, description: Works the recorded record; replay, after-action review, reports, measures, model promotion evidence.}
  - {id: OP-04, name: Sensor manager, kind: role, owner: plan-02, description: Owns sensor readiness, modes, coverage, tasking, and calibration.}
  - {id: OP-05, name: Administrator, kind: role, owner: plan-02, description: Owns configuration baselines, accounts and roles, the node, and the audit record.}
  - {id: OP-06, name: Intelligence analyst, kind: role, owner: plan-02, status: adopted 2026-09-04 (D-05), description: Owns requirements and tasking, identification evidence and declarations, order of battle, pattern of life, dissemination.}
  - {id: OP-07, name: Planner, kind: role, owner: plan-02, status: adopted 2026-09-04 (D-05), description: Owns defended-asset list drafts, laydown and coverage planning, mission plans, rehearsal.}
  - {id: OP-08, name: Commander, kind: role, owner: plan-02, status: adopted 2026-09-04 (D-05), description: Holds the authorities the others act under; may decide directly.}
  - {id: OP-10, name: Sector command post, kind: organization, owner: plan-02, description: The sector's command post; hosts the service node, the supervisor, operators, sensor manager, planner, intelligence analyst (vignettes, SCP).}
  - {id: OP-11, name: Site defense cell, kind: organization, owner: plan-02, description: A defended site's cell with a desktop and local sensors and effectors (vignettes, OPS and HAF).}
  - {id: OP-12, name: Port defense cell, kind: organization, owner: plan-02, description: The port's cell with a desktop, coastal sensors, patrol craft (vignettes, KAL).}
  - {id: OP-20, name: Higher command, kind: external, owner: plan-02, description: Sets rules of engagement; receives status, warnings, reports, order of battle.}
  - {id: OP-21, name: Neighbouring sector, kind: external, owner: plan-02, description: Exchanges tracks and warnings; hands over raids.}
  - {id: OP-22, name: Fire units and effector systems, kind: external, owner: plan-02, description: Receive decided assignments; report readiness and outcomes.}
  - {id: OP-23, name: Sensor operators and maintainers, kind: external, owner: plan-02, description: Operate and maintain sensors; modes, faults, calibration.}
  - {id: OP-24, name: Civil aviation authority and airport, kind: external, owner: plan-02, description: Corridors, flight plans, ADS-B; receive warnings of engagements.}
  - {id: OP-25, name: Port and maritime authorities, kind: external, owner: plan-02, description: AIS, harbour operations, barriers; receive warnings.}
  - {id: OP-26, name: Coalition partners, kind: external, owner: plan-02, description: Picture and product exchange with releasability.}
  - {id: OP-27, name: Accreditors and auditors, kind: external, owner: plan-02, description: Need evidence that the system enforces policy and records decisions.}
  - {id: OP-30, name: Command-and-control system (Gungnir), kind: system, owner: plan-03, description: The logical performer that exhibits every system capability; realized by the desktop and the service node.}
  - {id: OP-31, name: Operator workstation, kind: system-part, parent: OP-30, owner: plan-03, description: The desktop (gungnir-app) with embedded or remote services.}
  - {id: OP-32, name: Sector service node, kind: system-part, parent: OP-30, owner: plan-03, description: The headless node (gungnir-node) that is the system of record in connected profiles.}
  - {id: OP-33, name: Sensor network, kind: system-part, parent: OP-30, owner: plan-03, description: The sensors feeding the sector, logically part of the C2 system's inputs; physical sensors are actual resources.}
  - {id: OP-34, name: Effector interface, kind: system-part, parent: OP-30, owner: plan-03, description: The handoff boundary to fire units and effector systems (CAP-4.4).}

# Operational activities: the functions the thread steps perform, independent of
# who performs them. The step-to-activity mapping is in tools/build_uaf.py.
operational_activities:
  - {id: OA-01, name: Ingest and validate observations, description: Bring sensor, cooperative, peer, and human reports in; validate; quarantine; carry provenance.}
  - {id: OA-02, name: Maintain the track picture, description: Initiate, update, coast, and delete tracks from all sources with uncertainty and quality.}
  - {id: OA-03, name: Identify tracks, description: Classify and identify from kinematic, signature, cooperative, and human evidence with stated confidence.}
  - {id: OA-04, name: Assess threat and priority, description: Predict path, asset threatened, time to impact, closest approach; score against the defended-asset list.}
  - {id: OA-05, name: Recommend assignments, description: Propose the cheapest adequate resource-to-track assignment within readiness, geometry, and policy.}
  - {id: OA-06, name: Check policy, description: Evaluate identification criteria, weapons control status, authority, geofences, and restrictions; produce a verdict.}
  - {id: OA-07, name: Decide, description: A human accepts, overrides, rejects, holds, or lets expire; the decision is recorded.}
  - {id: OA-08, name: Hand off to effectors, description: Pass decided assignments to fire units and effector systems with provenance.}
  - {id: OA-09, name: Warn assets and authorities, description: Warn defended assets, units, and civil authorities with lead time; record the warning.}
  - {id: OA-10, name: Assess engagement effects, description: Track the engaged threat, record the outcome, supersede plans, re-plan the remainder.}
  - {id: OA-11, name: Journal and report, description: Journal every event; produce summaries, reports, and measures after action.}
  - {id: OA-12, name: Manage sensors and coverage, description: Set modes, task sensors, keep calibration, compute coverage and gaps over terrain.}
  - {id: OA-13, name: Detect and correlate degradation, description: Detect sensor loss, ingest gaps, clock skew, quality collapse; correlate into incidents.}
  - {id: OA-14, name: Re-task sensors, description: Change modes and tasking to restore the most valuable coverage; show before and after.}
  - {id: OA-15, name: Exchange the picture with peers, description: Send and receive tracks, warnings, and products with peers, higher command, and partners.}
  - {id: OA-16, name: Flag anomalies, description: Detect AIS-off, spoofing, loitering, and implausible feeds as alerts through the lifecycle.}
  - {id: OA-17, name: State collection requirements, description: Express an information requirement with area, question, priority, and window; task or decline it.}
  - {id: OA-18, name: Fuse identification evidence, description: Combine evidence into identities with confidence; retain the evidence with the track.}
  - {id: OA-19, name: Maintain entities and order of battle, description: Keep global identities across sessions; merge and split; accumulate pattern of life.}
  - {id: OA-20, name: Disseminate products, description: Release identities, warnings, and products to roles and peers with marking.}
  - {id: OA-21, name: Set the defended-asset list and priorities, description: Define protected assets, priorities, and warning obligations.}
  - {id: OA-22, name: Plan the laydown, description: Place sensors and effectors; compute coverage and gaps over terrain.}
  - {id: OA-23, name: Configure policy, description: Set identification criteria, weapons control status, authorities, restrictions as geofences, delegations.}
  - {id: OA-24, name: Validate and apply the plan, description: Validate a configuration baseline; apply it with audit.}
  - {id: OA-25, name: Rehearse, description: Replay a scenario through the pipeline under a plan; review recommendations and gaps.}
  - {id: OA-26, name: Review after action, description: Review the journal, measure, record lessons.}
  - {id: OA-27, name: Operate disconnected, description: Fall back to embedded services; keep journaling; queue for forwarding; act under pre-delegated authority.}
  - {id: OA-28, name: Reconcile journals, description: Forward the queue; merge local and node journals; report conflicts.}
  - {id: OA-29, name: Resolve conflicts, description: Resolve reported decision conflicts under the arbitration rule; update the record.}
  - {id: OA-30, name: Recommend a fires task, description: Propose a fires task with target location and uncertainty, time window, and deconfliction.}
  - {id: OA-31, name: Manage the decision queue, description: Order pending decisions by priority and time remaining; apply delegation; escalate; time out.}
  - {id: OA-32, name: Assist with questions and drafts, description: Answer questions about the picture and draft products with provenance and no authority.}
  - {id: OA-33, name: Govern algorithm and model baselines, description: Validate, promote, and roll back the algorithm and model configuration in force.}
  - {id: OA-34, name: Authenticate and authorize, description: Establish who a caller is and what their role permits before any action.}
  - {id: OA-35, name: Audit, description: Record every decision, configuration change, promotion, tasking, and assistant exchange append-only.}
  - {id: OA-36, name: Exchange cooperative identity, description: Receive IFF, ADS-B, AIS, and blue-force identity and attach it as evidence.}

# Services: the service traits the crates expose. `code` is the Rust path;
# tools/build_uaf.py checks that each trait still exists.
services:
  - {id: SV-01, name: Tracking, code: gungnir_tracking_service::TrackingService, status: scaffold, description: Detections in, tracks with quality out; health honest (pipeline not implemented).}
  - {id: SV-02, name: Intercept planning, code: gungnir_intercept_service::InterceptService, status: scaffold, description: Tracks and resources in, a PlanView out; last-good-plan on over-budget solves (allocator not implemented).}
  - {id: SV-03, name: Event bus, code: gungnir_eventing::EventBus, status: real, description: Broadcast publish and subscribe with sequence-stamped envelopes.}
  - {id: SV-04, name: Event journal, code: gungnir_store::EventJournal, status: real, description: Append-only JSON-lines session journal; read back for replay; retention.}
  - {id: SV-05, name: Time authority, code: gungnir_time::TimeAuthority, status: real, description: Wall and replay clocks; source versus receipt time; late-data policy.}
  - {id: SV-06, name: Configuration store, code: gungnir_config::ConfigStore, status: real, description: Load, validate, and save versioned configuration baselines.}
  - {id: SV-07, name: Mission lifecycle, code: gungnir_mission::MissionManager, status: scaffold, description: Create, live, save, load, replay, close a session.}
  - {id: SV-08, name: Ingest gateway, code: gungnir_ingest::ProtocolAdapter, status: real, description: Adapters behind a validating, authenticating, quarantining gateway (SourceAuthenticator, IngestGateway).}
  - {id: SV-09, name: Sensor registry, code: gungnir_sensor_management::SensorRegistry, status: real, description: Sensor records, modes with a transition table, coverage regions.}
  - {id: SV-10, name: Interop catalogue and codecs, code: gungnir_interop::DetectionCodec, status: scaffold, description: Schema catalogue with version negotiation; Arrow form; ASTERIX and STANAG codecs (NotImplemented).}
  - {id: SV-11, name: Identity resolution, code: gungnir_identity::IdentityResolver, status: real, description: Global entity identity across session tracks with merge and split lineage.}
  - {id: SV-12, name: Identification, code: gungnir_identification::IdentificationEngine, status: real, description: Evidence fusion to friend, hostile, neutral, unknown with a margin rule.}
  - {id: SV-13, name: Geospatial, code: gungnir_geo::GeoService, status: real, description: Geofence containment, map layers, coordinate reference governance.}
  - {id: SV-14, name: Analytics, code: gungnir_analytics::LineOfSight, status: real, description: Line of sight, viewshed, coverage volumes, route deconfliction over terrain.}
  - {id: SV-15, name: Policy, code: gungnir_policy::PolicyEngine, status: real, description: Geofence and readiness verdicts through a chain that never self-approves.}
  - {id: SV-16, name: Approval workflow, code: gungnir_command::ApprovalWorkflow, status: real, description: Pending approvals and decision records; nothing actionable without one.}
  - {id: SV-17, name: Threat assessment, code: gungnir_assessment::ThreatAssessor, status: real, description: Risk scores and the reward matrix for the allocator.}
  - {id: SV-18, name: Decision support, code: gungnir_decision::DecisionSupport, status: scaffold, description: Rationale (real); alternatives and what-if (trait surface).}
  - {id: SV-19, name: Model registry, code: gungnir_modelops::ModelRegistry, status: real, description: Validate, promote, roll back algorithm baselines.}
  - {id: SV-20, name: Authentication, code: gungnir_security::Authenticator, status: scaffold, description: Credential to OperatorId (trait only; mechanism D-02).}
  - {id: SV-21, name: Authorization, code: gungnir_security::Authorizer, status: real, description: Role-to-action matrix; unknown operators permitted nothing.}
  - {id: SV-22, name: Audit log, code: gungnir_security::AuditLog, status: real, description: Append-only audit entries per gated action.}
  - {id: SV-23, name: API v1, code: gungnir_api::ApiHandler, status: scaffold, description: Snapshot, event stream, detection submission, plan decision, health; transport pending.}
  - {id: SV-24, name: Health monitor, code: gungnir_observability::HealthMonitor, status: real, description: Health snapshot from service flags; alert correlation; watchdog.}
  - {id: SV-25, name: Store-and-forward and reconciliation, code: gungnir_resilience::StoreAndForwardQueue, status: real, description: Bounded queue while disconnected; journal merge with conflict reporting.}
  - {id: SV-26, name: Shared picture and arbitration, code: gungnir_collab::SharedPictureSync, status: real, description: Apply node envelopes to a projection; role-rank arbitration of conflicts.}
  - {id: SV-27, name: Operator workflow, code: gungnir_workflow::AlertLifecycle, status: real, description: Role workspace layouts; alert lifecycle; cases and annotations.}
  - {id: SV-28, name: Replay, code: gungnir_replay, status: real, description: Deterministic playback of a journal under the replay clock.}
  - {id: SV-29, name: Reporting, code: gungnir_reporting::ReportGenerator, status: real, description: Reports and exports with every figure traceable to the journal.}
  - {id: SV-30, name: Remote backends, code: gungnir_remote, status: scaffold, description: RemoteTrackingService and RemoteInterceptService over the API with an outbox; transport pending.}
  - {id: SV-31, name: Data loading, code: gungnir_data, status: scaffold, description: Point cloud, VTK, terrain, glTF loaders off the UI thread (surface only).}
  - {id: SV-32, name: Point-cloud fusion, code: gungnir_data_fusion, status: scaffold, description: CPU reference and GPU ICP registration (trait surface).}
  - {id: SV-33, name: Tracking metrics, code: gungnir_metrics, status: scaffold, description: MOTA, MOTP, purity, fragmentation against truth.}
  - {id: SV-34, name: Scenario generation, code: gungnir_scenario, status: scaffold, description: The five engineering scenarios with truth.}

