e="12" textLength="132.668">(prepare and present)</text><rect x="50.146" y="406.714" width="545.768" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="60.146" y="427.853" fill="#000" font-size="12" textLength="525.768">4. Reconnect: forward the queue; reconcile the local and node journals; report conflicts</text><text x="60.146" y="441.821" fill="#000" font-size="12" textLength="51.938">«OA-28»</text><rect x="38.237" y="474.651" width="569.586" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="48.237" y="495.79" fill="#000" font-size="12" textLength="549.586">5. Supervisor resolves reported conflicts under the arbitration rule; the node's record is u…</text><text x="48.237" y="509.759" fill="#000" font-size="12" textLength="51.938">«OA-29»</text><text x="48.237" y="523.728" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="116.519" y="624.495" width="413.023" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="126.519" y="645.634" fill="#000" font-size="12" textLength="393.023">6. Return to the remote backend; local projection resynchronized</text><text x="126.519" y="659.603" fill="#000" font-size="12" textLength="51.938">«OA-27»</text><ellipse cx="323.03" cy="703.433" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="323.03" cy="703.433" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="55.042" x2="20" y2="714.433" style="stroke:#000;stroke-width:1.5;"/><rect x="630.061" y="338.776" width="255.828" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="640.061" y="359.915" fill="#000" font-size="12" textLength="235.828">3. decide: Site authority per delegation</text><text x="640.061" y="373.884" fill="#000" font-size="12" textLength="140.361">(Site authority (OP-01))</text><