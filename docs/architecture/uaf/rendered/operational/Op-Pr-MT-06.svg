<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:855px;height:871px;background:#FFFFFF;" width="855px" height="871px" viewBox="0 0 855 871" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="180.435" y="32.995" fill="#000" font-size="14" textLength="492.393" font-weight="700">Op-Pr MT-06: Convoy and battery tracking with cueing of fires</text></g><rect x="20" y="55.042" width="808.263" height="20.953" fill="none" style="stroke:none;"/><ellipse cx="323.01" cy="90.995" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="27.081" y="120.995" width="591.857" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="37.081" y="142.134" fill="#000" font-size="12" textLength="571.857">1. Ingest ISR video observations, ground radar, acoustic and spotter reports at mismatched r…</text><text x="37.081" y="156.103" fill="#000" font-size="12" textLength="51.938">«OA-01»</text><rect x="29.012" y="188.933" width="587.996" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="39.012" y="210.071" fill="#000" font-size="12" textLength="567.996">2. Track vehicles and groups; register sensors against each other to remove bias; coast thro…</text><text x="39.012" y="224.04" fill="#000" font-size="12" textLength="51.938">«OA-02»</text><rect x="32.659" y="256.87" width="580.701" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="42.659" y="278.009" fill="#000" font-size="12" textLength="560.701">3. Resolve global identity across sorties and gaps; classify vehicle type from video and emi…</text><text x="42.659" y="291.978" fill="#000" font-size="12" textLength="96.82">«OA-19, OA-03»</text><rect x="59.803" y="324.808" width="526.414" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="69.803" y="345.946" fill="#000" font-size="12" textLength="506.414">4. Assess priority and time sensitivity (a battery that fired will move within minutes)</text><text x="69.803" y="359.915" fill="#000" font-size="12" textLength="51.938">«OA-04»</text><rect x="26" y="392.745" width="594.02" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="413.884" fill="#000" font-size="12" textLength="574.02">5. Recommend a fires task: target location and uncertainty, time window, deconfliction again…</text><text x="36" y="427.853" fill="#000" font-size="12" textLength="96.82">«OA-30, OA-06»</text><rect x="188.056" y="460.683" width="269.908" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="198.056" y="481.821" fill="#000" font-size="12" textLength="249.908">6. Present; fires authority decides; record</text><text x="198.056" y="495.79" fill="#000" font-size="12" textLength="51.938">«OA-07»</text><text x="198.056" y="509.759" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="156.38" y="610.526" width="333.26" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="166.38" y="631.665" fill="#000" font-size="12" textLength="313.26">7. Hand off with provenance; the fires unit executes</text><text x="166.38" y="645.634" fill="#000" font-size="12" textLength="51.938">«OA-08»</text><rect x="87.037" y="678.464" width="471.945" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="97.037" y="699.603" fill="#000" font-size="12" textLength="451.945">8. Battle damage assessment from the next observation; update the entity</text><text x="97.037" y="713.571" fill="#000" font-size="12" textLength="96.82">«OA-10, OA-19»</text><text x="97.037" y="727.54" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><line x1="20" y1="55.042" x2="20" y2="850.308" style="stroke:#000;stroke-width:1.5;"/><rect x="641.032" y="542.589" width="170.357" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="651.032" y="563.728" fill="#000" font-size="12" textLength="150.357">6. decide: Fires authority</text><text x="651.032" y="577.696" fill="#000" font-size="12" textLength="146.127">(Fires authority (OP-08))</text><rect x="630.02" y="760.37" width="192.383" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="640.02" y="781.509" fill="#000" font-size="12" textLength="172.383">8. decide: complete the step</text><text x="640.02" y="795.478" fill="#000" font-size="12" textLength="103.172">(OP-01 Operator)</text><ellipse cx="726.211" cy="839.308" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="726.211" cy="839.308" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="624.02" y1="55.042" x2="624.02" y2="850.308" style="stroke:#000;stroke-width:1.5;"/><line x1="826.402" y1="55.042" x2="826.402" y2="850.308" style="stroke:#000;stroke-width:1.5;"/><line x1="323.01" y1="100.995" x2="323.01" y2="120.995" style="stroke:#181818;stroke-width:1;"/><polygon points="319.01,110.995,323.01,120.995,327.01,110.995,323.01,114.995" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="323.01" y1="168.933" x2="323.01" y2="188.933" style="stroke:#181818;stroke-width:1;"/><polygon points="319.01,178.933,323.01,188.933,327.01,178.933,323.01,182.933" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="323.01" y1="236.87" x2="323.01" y2="256.87" style="stroke:#181818;stroke-width:1;"/><polygon points="319.01,246.87,323.01,256.87,327.01,246.87,323.01,2