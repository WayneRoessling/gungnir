<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1004px;height:817px;background:#FFFFFF;" width="1004px" height="817px" viewBox="0 0 1004 817" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="216.296" y="32.995" fill="#000" font-size="14" textLength="569.851" font-weight="700">Op-Pr MT-08: Collection management and identification evidence fusion</text></g><rect x="20" y="55.042" width="957.443" height="20.953" fill="none" style="stroke:none;"/><ellipse cx="294.647" cy="90.995" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="114.576" y="202.901" width="360.143" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="124.576" y="224.04" fill="#000" font-size="12" textLength="340.143">2. Translate into sensor tasking; show the coverage cost</text><text x="124.576" y="238.009" fill="#000" font-size="12" textLength="51.938">«OA-12»</text><text x="124.576" y="251.978" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="159.204" y="352.745" width="270.887" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="169.204" y="373.884" fill="#000" font-size="12" textLength="250.887">3. Collect; observations carry provenance</text><text x="169.204" y="387.853" fill="#000" font-size="12" textLength="51.938">«OA-01»</text><rect x="38.287" y="420.683" width="512.721" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="48.287" y="441.821" fill="#000" font-size="12" textLength="492.721">4. Fuse evidence into identities with confidence; keep the evidence with the track</text><text x="48.287" y="455.79" fill="#000" font-size="12" textLength="51.938">«OA-18»</text><rect x="120.066" y="488.62" width="349.162" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="130.066" y="509.759" fill="#000" font-size="12" textLength="329.162">5. Maintain entities and order of battle across sessions</text><text x="130.066" y="523.728" fill="#000" font-size="12" textLength="51.938">«OA-19»</text><text x="130.066" y="537.696" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="26" y="638.464" width="537.295" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="659.603" fill="#000" font-size="12" textLength="517.295">6. Disseminate identities, warnings, and products to roles and peers with releasability</text><text x="36" y="673.571" fill="#000" font-size="12" textLength="96.82">«OA-20, OA-15»</text><rect x="128.668" y="706.401" width="331.959" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="138.668" y="727.54" fill="#000" font-size="12" textLength="311.959">7. Journal; pattern of life accumulates over sessions</text><text x="138.668" y="741.509" fill="#000" font-size="12" textLength="51.938">«OA-11»</text><ellipse cx="294.647" cy="785.339" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="294.647" cy="785.339" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="55.042" x2="20" y2="796.339" style="stroke:#000;stroke-width:1.5;"/><rect x="573.295" y="120.995" width="398.287" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="583.295" y="142.134" fill="#000" font-size="12" textLength="378.287">1. State the requirement: area, question, priority, time window</text><text x="583.295" y="156.103" fill="#000" font-size="12" textLength="51.938">«OA-17»</text><text x="583.295" y="170.071" fill="#000" font-size="12" textLength="123.451">(OP-08 Commander)</text><rect x="681.471" y="284.808" width="181.936" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="691.471" y="305.946" fill="#000" font-size="12" textLength="161.936">2. decide: Sensor manager</text><text x="691.471" y="319.915" fill="#000" font-size="12" textLength="148.342">(OP-04 Sensor manager)</text><rect x="658.396" y="570.526" width="228.084" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="668.396" y="591.665" fill="#000" font-size="12" textLength="208.084">5. decide: Analyst merges or splits</text><text x="668.396" y="605.634" fill="#000" font-size="12" textLength="94.02">(OP-03 Analyst)</text><line x1="567.295" y1="55.042" x2="567.295" y2="796.339" style="stroke:#000;stroke-width:1.5;"/><line x1="975.582" y1="55.042" x2="975.582" y2="796.339" style="stroke:#000;stroke-width:1.5;"/><line x1="294.647" y1="400.683" x2="294.647" y2="420.683" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,410.683,294.647,420.683,298.647,410.683,294.647,414.683" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="468.62" x2="294.647" y2="488.62" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,478.62,294.647,488.62,298.647,478.62,294.647,482.62" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="686.401" x2="294.647" y2="706.401" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,696.401,294.647,706.401,298.647,696.401,294.647,700.401" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="754.339" x2="294.647" y2="774.339" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,764.339,294.647,774.339,298.647,764.339,294.647,768.339" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:mite