<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1017px;height:735px;background:#FFFFFF;" width="1017px" height="735px" viewBox="0 0 1017 735" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="276.962" y="32.995" fill="#000" font-size="14" textLength="461.234" font-weight="700">Op-Pr MT-07: Sensor management under electronic attack</text></g><rect x="20" y="55.042" width="970.158" height="20.953" fill="none" style="stroke:none;"/><ellipse cx="330.51" cy="90.995" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="41.346" y="120.995" width="578.328" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51.346" y="142.134" fill="#000" font-size="12" textLength="558.328">1. Detect degradation: sensor health, ingest gaps, clock skew, track quality collapse; corre…</text><text x="51.346" y="156.103" fill="#000" font-size="12" textLength="51.938">«OA-13»</text><rect x="75.163" y="188.933" width="510.693" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="85.163" y="210.071" fill="#000" font-size="12" textLength="490.693">2. Recompute coverage with the degraded sensors; show the gaps on the picture</text><text x="85.163" y="224.04" fill="#000" font-size="12" textLength="51.938">«OA-12»</text><rect x="26" y="256.87" width="609.02" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="278.009" fill="#000" font-size="12" textLength="589.02">3. Recommend mode changes and re-tasking (search patterns, backup sensors, emission control)</text><text x="36" y="291.978" fill="#000" font-size="12" textLength="51.938">«OA-14»</text><text x="36" y="305.946" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="79.203" y="406.714" width="502.613" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="89.203" y="427.853" fill="#000" font-size="12" textLength="482.613">4. Mark affected tracks as degraded; the planner never allocates on stale tracks</text><text x="89.203" y="441.821" fill="#000" font-size="12" textLength="51.938">«OA-02»</text><rect x="36.354" y="474.651" width="588.313" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="46.354" y="495.79" fill="#000" font-size="12" textLength="568.313">5. Supervisor acknowledges the degraded state on the plan; escalates if a defended asset is…</text><text x="46.354" y="509.759" fill="#000" font-size="12" textLength="96.82">«OA-13, OA-07»</text><text x="46.354" y="523.728" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="76.774" y="624.495" width="507.471" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="86.774" y="645.634" fill="#000" font-size="12" textLength="487.471">6. Recover: sensors return, clocks resynchronize, coverage restored, alert closed</text><text x="86.774" y="659.603" fill="#000" font-size="12" textLength="51.938">«OA-13»</text><ellipse cx="330.51" cy="703.433" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="330.51" cy="703.433" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="55.042" x2="20" y2="714.433" style="stroke:#000;stroke-width:1.5;"/><rect x="723.69" y="338.776" width="181.936" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="733.69" y="359.915" fill="#000" font-size="12" textLength="161.936">3. decide: Sensor manager</text><text x="733.69" y="373.884" fill="#000" font-size="12" textLength="148.342">(OP-04 Sensor manager)</text><rect x="645.02" y="556.558" width="339.277" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="655.02" y="577.696" fill="#000" font-size="12" textLength="319.277">5. decide: Supervisor; commander for accepted gaps</text><text x="655.02" y="591.665" fill="#000" font-size="12" textLength="113.578">(OP-02 Supervisor)</text><line x1="639.02" y1="55.042" x2="639.02" y2="714.433" style="stroke:#000;stroke-width:1.5;"/><line x1="988.297" y1="55.042" x2="988.297" y2="714.433" style="stroke:#000;stroke-width:1.5;"/><line x1="330.51" y1="100.995" x2="330.51" y2="120.995" style="stroke:#181818;stroke-width:1;"/><polygon points="326.51,110.995,330.51,120.995,334.51,110.995,330.51,114.995" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="330.51" y1="168.933" x2="330.51" y2="188.933" style="stroke:#181818;stroke-width:1;"/><polygon points="326.51,178.933,330.51,188.933,334.51,178.933,330.51,182.933" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="330.51" y1="236.87" x2="330.51" y2="256.87" style="stroke:#181818;stroke-width:1;"/><polygon points="326.51,246.87,330.51,256.87,334.51,246.87,330.51,250.87" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="330.51" y1="454.651" x2="330.51" y2="474.651" style="stroke:#181818;stroke-width:1;"/><polygon points="326.51,464.651,330.51,474.651,334.51,464.651,330.51,468.651" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="330.51" y1="672.433" x2="330.51" y2="692.433" style="stroke:#181818;stroke-width:1;"/><polygon points="326.51,682.433,330.51,692.433,334.51,682.433,330.51,686.433" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="330.51" y1="318.776" x2="330.51" y2="323.776" style="stroke:#181818;stroke-width: