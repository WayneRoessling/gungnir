<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:998px;height:871px;background:#FFFFFF;" width="998px" height="871px" viewBox="0 0 998 871" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="244.44" y="32.995" fill="#000" font-size="14" textLength="508.026" font-weight="700">Op-Pr MT-02: Mixed salvo of cruise missiles, drones, and decoys</text></g><rect x="20" y="55.042" width="951.906" height="20.953" fill="none" style="stroke:none;"/><ellipse cx="322.547" cy="90.995" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="31.845" y="120.995" width="581.404" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="41.845" y="142.134" fill="#000" font-size="12" textLength="561.404">1. Ingest launch warnings and local radar; separate fast tracks from the drone picture by ki…</text><text x="41.845" y="156.103" fill="#000" font-size="12" textLength="96.82">«OA-01, OA-15»</text><rect x="41.99" y="188.933" width="561.113" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51.99" y="210.071" fill="#000" font-size="12" textLength="541.113">2. Track low-altitude fast targets through horizon dropouts; predict route and impact area</text><text x="51.99" y="224.04" fill="#000" font-size="12" textLength="96.82">«OA-02, OA-04»</text><rect x="32.188" y="256.87" width="580.719" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="42.188" y="278.009" fill="#000" font-size="12" textLength="560.719">3. Classify cruise missile versus decoy versus drone by speed, altitude, and signature class…</text><text x="42.188" y="291.978" fill="#000" font-size="12" textLength="51.938">«OA-03»</text><rect x="136.654" y="324.808" width="371.785" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="146.654" y="345.946" fill="#000" font-size="12" textLength="351.785">4. Score by time to impact and asset priority; missiles first</text><text x="146.654" y="359.915" fill="#000" font-size="12" textLength="51.938">«OA-04»</text><rect x="26" y="392.745" width="593.094" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="413.884" fill="#000" font-size="12" textLength="573.094">5. Recommend the area-defense layer for missiles and the point layer for drones; check frien…</text><text x="36" y="427.853" fill="#000" font-size="12" textLength="96.82">«OA-05, OA-06»</text><rect x="28.036" y="460.683" width="589.021" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38.036" y="481.821" fill="#000" font-size="12" textLength="569.021">6. Present within seconds; pre-delegated authority accepts; supervisor may hold for deconfli…</text><text x="38.036" y="495.79" fill="#000" font-size="12" textLength="51.938">«OA-07»</text><text x="38.036" y="509.759" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="208.889" y="610.526" width="227.316" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="218.889" y="631.665" fill="#000" font-size="12" textLength="207.316">7. Hand off; warn assets to shelter</text><text x="218.889" y="645.634" fill="#000" font-size="12" textLength="96.82">«OA-08, OA-09»</text><rect x="179.832" y="678.464" width="285.43" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="189.832" y="699.603" fill="#000" font-size="12" textLength="265.43">8. Assess; leakers to the point layer; re-plan</text><text x="189.832" y="713.571" fill="#000" font-size="12" textLength="51.938">«OA-10»</text><text x="189.832" y="727.54" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><line x1="20" y1="55.042" x2="20" y2="850.308" style="stroke:#000;stroke-width:1.5;"/><rect x="629.094" y="542.589" width="336.951" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="639.094" y="563.728" fill="#000" font-size="12" textLength="316.951">6. decide: Engagement authority; hold by supervisor</text><text x="639.094" y="577.696" fill="#000" font-size="12" textLength="113.578">(OP-02 Supervisor)</text><rect x="701.378" y="760.37" width="192.383" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="711.378" y="781.509" fill="#000" font-size="12" textLength="172.383">8. decide: complete the step</text><text x="711.378" y="795.478" fill="#000" font-size="12" textLength="103.172">(OP-01 Operator)</text><ellipse cx="797.569" cy="839.308" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="797.569" cy="839.308" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="623.094" y1="55.042" x2="623.094" y2="850.308" style="stroke:#000;stroke-width:1.5;"/><line x1="970.045" y1="55.042" x2="970.045" y2="850.308" style="stroke:#000;stroke-width:1.5;"/><line x1="322.547" y1="100.995" x2="322.547" y2="120.995" style="stroke:#181818;stroke-width:1;"/><polygon points="318.547,110.995,322.547,120.995,326.547,110.995,322.547,114.995" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="322.547" y1="168.933" x2="322.547" y2="188.933" style="stroke:#181818;stroke-width:1;"/><polygon points="318.547,178.933,322.547,188.933,326.547,178.933,322.547,182.933" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="322.547" y1="236.87" x2="322.547" y2="256.87" style="stroke:#181818;stroke-width:1;"/><polygon points="318.547,246.87,322.547