<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:877px;height:871px;background:#FFFFFF;" width="877px" height="871px" viewBox="0 0 877 871" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="150.438" y="32.995" fill="#000" font-size="14" textLength="575.005" font-weight="700">Op-Pr MT-04: Uncrewed surface vessel attack on a port or anchored ship</text></g><rect x="20" y="55.042" width="830.88" height="20.953" fill="none" style="stroke:none;"/><ellipse cx="321.794" cy="90.995" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="38.1" y="120.995" width="567.389" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="48.1" y="142.134" fill="#000" font-size="12" textLength="547.389">1. Ingest coastal radar, AIS, camera, patrol reports; suppress clutter; hold tracks through…</text><text x="48.1" y="156.103" fill="#000" font-size="12" textLength="96.82">«OA-01, OA-02»</text><rect x="85.921" y="188.933" width="471.746" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="95.921" y="210.071" fill="#000" font-size="12" textLength="451.746">2. Cue cameras to inbound low-confidence tracks; fuse visual identification</text><text x="95.921" y="224.04" fill="#000" font-size="12" textLength="96.82">«OA-12, OA-18»</text><rect x="27.386" y="256.87" width="588.816" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="37.386" y="278.009" fill="#000" font-size="12" textLength="568.816">3. Identify: no AIS, high speed, heading to the anchorage, night, group behaviour, wake sign…</text><text x="37.386" y="291.978" fill="#000" font-size="12" textLength="51.938">«OA-03»</text><rect x="29.48" y="324.808" width="584.627" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="39.48" y="345.946" fill="#000" font-size="12" textLength="564.627">4. Assess closest point of approach and time to protected ships and infrastructure; cross-do…</text><text x="39.48" y="359.915" fill="#000" font-size="12" textLength="51.938">«OA-04»</text><rect x="26" y="392.745" width="591.588" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="413.884" fill="#000" font-size="12" textLength="571.588">5. Recommend patrol craft, helicopter, shore effector, barrier closure, ship movement; geofe…</text><text x="36" y="427.853" fill="#000" font-size="12" textLength="96.82">«OA-05, OA-06»</text><rect x="234.187" y="460.683" width="175.215" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="244.187" y="481.821" fill="#000" font-size="12" textLength="155.215">6. Present; decide; record</text><text x="244.187" y="495.79" fill="#000" font-size="12" textLength="51.938">«OA-07»</text><text x="244.187" y="509.759" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="197.68" y="610.526" width="248.229" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="207.68" y="631.665" fill="#000" font-size="12" textLength="228.229">7. Hand off; warn ships; close barriers</text><text x="207.68" y="645.634" fill="#000" font-size="12" textLength="96.82">«OA-08, OA-09»</text><rect x="179.48" y="678.464" width="284.627" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="189.48" y="699.603" fill="#000" font-size="12" textLength="264.627">8. Assess; continue for the rest of the group</text><text x="189.48" y="713.571" fill="#000" font-size="12" textLength="51.938">«OA-10»</text><text x="189.48" y="727.54" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><line x1="20" y1="55.042" x2="20" y2="850.308" style="stroke:#000;stroke-width:1.5;"/><rect x="627.588" y="542.589" width="217.432" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="637.588" y="563.728" fill="#000" font-size="12" textLength="197.432">6. decide: Port defense authority</text><text x="637.588" y="577.696" fill="#000" font-size="12" textLength="193.201">(Port defense authority (OP-02))</text><rect x="640.112" y="760.37" width="192.383" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="650.112" y="781.509" fill="#000" font-size="12" textLength="172.383">8. decide: complete the step</text><text x="650.112" y="795.478" fill="#000" font-size="12" textLength="103.172">(OP-01 Operator)</text><ellipse cx="736.304" cy="839.308" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="736.304" cy="839.308" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="621.588" y1="55.042" x2="621.588" y2="850.308" style="stroke:#000;stroke-width:1.5;"/><line x1="849.02" y1="55.042" x2="849.02" y2="850.308" style="stroke:#000;stroke-width:1.5;"/><line x1="321.794" y1="100.995" x2="321.794" y2="120.995" style="stroke:#181818;stroke-width:1;"/><polygon points="317.794,110.995,321.794,120.995,325.794,110.995,321.794,114.995" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="321.794" y1="168.933" x2="321.794" y2="188.933" style="stroke:#181818;stroke-width:1;"/><polygon points="317.794,178.933,321.794,188.933,325.794,178.933,321.794,182.933" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="321.794" y1="236.87" x2="321.794" y2="256.87" style="stroke:#181818;stroke-width:1;"/><polygon points="317.794,246.87,321.794,256.87,325.794,246.87,321.794,250.87" fill="#181818" sty