<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:813px;height:585px;background:#FFFFFF;" width="813px" height="585px" viewBox="0 0 813 585" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="242.024" y="32.995" fill="#000" font-size="14" textLength="327.879" font-weight="700">Op-Pr MT-05: Surface picture compilation</text></g><rect x="20" y="55.042" width="766.926" height="20.953" fill="none" style="stroke:none;"/><ellipse cx="313.195" cy="90.995" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="26" y="120.995" width="574.391" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="142.134" fill="#000" font-size="12" textLength="554.391">1. Fuse coastal radars, AIS, cameras, patrol and peer reports into one surface picture with…</text><text x="36" y="156.103" fill="#000" font-size="12" textLength="186.586">«OA-01, OA-02, OA-03, OA-36»</text><rect x="28.722" y="188.933" width="568.947" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38.722" y="210.071" fill="#000" font-size="12" textLength="548.947">2. Flag anomalies: AIS-off, speed or route inconsistent with declared type, loitering near i…</text><text x="38.722" y="224.04" fill="#000" font-size="12" textLength="51.938">«OA-16»</text><rect x="132.875" y="256.87" width="360.641" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="142.875" y="278.009" fill="#000" font-size="12" textLength="340.641">3. Operator reviews anomalies; tasks cameras or patrols</text><text x="142.875" y="291.978" fill="#000" font-size="12" textLength="51.938">«OA-12»</text><text x="142.875" y="305.946" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="150.685" y="406.714" width="325.021" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="160.685" y="427.853" fill="#000" font-size="12" textLength="305.021">4. Exchange the picture with peers and authorities</text><text x="160.685" y="441.821" fill="#000" font-size="12" textLength="51.938">«OA-15»</text><rect x="105.318" y="474.651" width="415.754" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="115.318" y="495.79" fill="#000" font-size="12" textLength="395.754">5. Journal; the picture is the basis for MT-04 and for pattern of life</text><text x="115.318" y="509.759" fill="#000" font-size="12" textLength="51.938">«OA-11»</text><ellipse cx="313.195" cy="553.589" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="313.195" cy="553.589" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="55.042" x2="20" y2="564.589" style="stroke:#000;stroke-width:1.5;"/><rect x="627.345" y="338.776" width="136.766" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="637.345" y="359.915" fill="#000" font-size="12" textLength="116.766">3. decide: Operator</text><text x="637.345" y="373.884" fill="#000" font-size="12" textLength="103.172">(OP-01 Operator)</text><line x1="604.391" y1="55.042" x2="604.391" y2="564.589" style="stroke:#000;stroke-width:1.5;"/><line x1="785.065" y1="55.042" x2="785.065" y2="564.589" style="stroke:#000;stroke-width:1.5;"/><line x1="313.195" y1="100.995" x2="313.195" y2="120.995" style="stroke:#181818;stroke-width:1;"/><polygon points="309.195,110.995,313.195,120.995,317.195,110.995,313.195,114.995" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="313.195" y1="168.933" x2="313.195" y2="188.933" style="stroke:#181818;stroke-width:1;"/><pol