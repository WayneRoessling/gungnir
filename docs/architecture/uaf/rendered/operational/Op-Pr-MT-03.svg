<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:959px;height:803px;background:#FFFFFF;" width="959px" height="803px" viewBox="0 0 959 803" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="298.401" y="32.995" fill="#000" font-size="14" textLength="360.541" font-weight="700">Op-Pr MT-03: Small UAS over a protected site</text></g><rect x="20" y="55.042" width="912.343" height="20.953" fill="none" style="stroke:none;"/><ellipse cx="321.267" cy="90.995" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="94.388" y="120.995" width="453.758" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="104.388" y="142.134" fill="#000" font-size="12" textLength="433.758">1. Ingest RF, radar, acoustic, and visual reports; correlate into one track</text><text x="104.388" y="156.103" fill="#000" font-size="12" textLength="96.82">«OA-01, OA-02»</text><rect x="31.728" y="188.933" width="579.078" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="41.728" y="210.071" fill="#000" font-size="12" textLength="559.078">2. Classify: consumer multirotor, FPV, fixed-wing ISR; link-controlled or autonomous; friend…</text><text x="41.728" y="224.04" fill="#000" font-size="12" textLength="96.82">«OA-03, OA-36»</text><rect x="71.519" y="256.87" width="499.496" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="81.519" y="278.009" fill="#000" font-size="12" textLength="479.496">3. Assess: approaching the site, loitering, passing; risk to the site and to people</text><text x="81.519" y="291.978" fill="#000" font-size="12" textLength="51.938">«OA-04»</text><rect x="26" y="324.808" width="590.533" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="345.946" fill="#000" font-size="12" textLength="570.533">4. Recommend: jam (if link-controlled and permitted here), interceptor drone, small arms, or…</text><text x="36" y="359.915" fill="#000" font-size="12" textLength="96.82">«OA-05, OA-06»</text><rect x="46.191" y="392.745" width="550.15" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="56.191" y="413.884" fill="#000" font-size="12" textLength="530.15">5. Present; site authority decides; self-defense engagements are recorded after the fact</text><text x="56.191" y="427.853" fill="#000" font-size="12" textLength="51.938">«OA-07»</text><text x="56.191" y="441.821" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="165.107" y="542.589" width="312.318" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="175.107" y="563.728" fill="#000" font-size="12" textLength="292.318">6. Hand off to the site's effector; warn personnel</text><text x="175.107" y="577.696" fill="#000" font-size="12" textLength="96.82">«OA-08, OA-09»</text><rect x="40.631" y="610.526" width="561.271" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="50.631" y="631.665" fill="#000" font-size="12" textLength="541.271">7. Assess; if the UAS was ISR, expect a strike: raise the site's alert state and re-task sen…</text><text x="50.631" y="645.634" fill="#000" font-size="12" textLength="96.82">«OA-10, OA-14»</text><text x="50.631" y="659.603" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><line x1="20" y1="55.042" x2="20" y2="782.37" style="stroke:#000;stroke-width:1.5;"/><rect x="626.533" y="474.651" width="299.949" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="636.533" y="495.79" fill="#000" font-size="12" textLength="279.949">5. decide: Site authority; self-defense retained</text><text x="636.533" y="509.759" fill="#000" font-size="12" textLength="140.361">(Site authority (OP-01))</text><rect x="702.922" y="692.433" width="147.172" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="712.922" y="713.571" fill="#000" font-size="12" textLength="127.172">7. decide: Supervisor</text><text x="712.922" y="727.54" fill="#000" font-size="12" textLength="113.578">(OP-02 Supervisor)</text><ellipse cx="776.508" cy="771.37" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="776.508" cy="771.37" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="620.533" y1="55.042" x2="620.533" y2="782.37" style="stroke:#000;stroke-width:1.5;"/><line x1="930.482" y1="55.042" x2="930.482" y2="782.37" style="stroke:#000;stroke-width:1.5;"/><line x1="321.267" y1="100.995" x2="321.267" y2="120.995" style="stroke:#181818;stroke-width:1;"/><polygon points="317.267,110.995,321.267,120.995,325.267,110.995,321.267,114.995" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="321.267" y1="168.933" x2="321.267" y2="188.933" style="stroke:#181818;stroke-width:1;"/><polygon points="317.267,178.933,321.267,188.933,325.267,178.933,321.267,182.933" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="321.267" y1="236.87" x2="321.267" y2="256.87" style="stroke:#181818;stroke-width:1;"/><polygon points="317.267,246.87,321.267,256.87,325.267,246.87,321.267,250.87" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="321.267" y1="304.808" x2="321.267" y2="324.808" style="stroke:#181818;stroke-width:1;"/><polygon points="317.267,314.808,321.267,324.808,325.267,314.808,321.267,318.808" fill="#181818" style="stroke:#181818;stroke-