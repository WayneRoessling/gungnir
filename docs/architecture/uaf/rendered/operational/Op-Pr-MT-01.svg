<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1118px;height:939px;background:#FFFFFF;" width="1118px" height="939px" viewBox="0 0 1118 939" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="281.125" y="32.995" fill="#000" font-size="14" textLength="554.381" font-weight="700">Op-Pr MT-01: One-way attack drone raid against a defended-asset list</text></g><rect x="20" y="55.042" width="1071.63" height="20.953" fill="none" style="stroke:none;"/><ellipse cx="335.083" cy="90.995" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="99.269" y="120.995" width="471.629" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="109.269" y="142.134" fill="#000" font-size="12" textLength="451.629">1. Ingest early-warning tracks and reports; validate; quarantine malformed</text><text x="109.269" y="156.103" fill="#000" font-size="12" textLength="51.938">«OA-01»</text><rect x="51.072" y="188.933" width="568.021" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="61.072" y="210.071" fill="#000" font-size="12" textLength="548.021">2. Initiate and maintain tracks across acoustic, radar, and spotter sources at different rat…</text><text x="61.072" y="224.04" fill="#000" font-size="12" textLength="51.938">«OA-02»</text><rect x="45.33" y="256.87" width="579.506" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="55.33" y="278.009" fill="#000" font-size="12" textLength="559.506">3. Classify by acoustic and kinematic evidence; identity Hostile at confidence once policy c…</text><text x="55.33" y="291.978" fill="#000" font-size="12" textLength="51.938">«OA-03»</text><rect x="48.189" y="324.808" width="573.787" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="58.189" y="345.946" fill="#000" font-size="12" textLength="553.787">4. Score each track against the defended-asset list: predicted asset, time to impact, priori…</text><text x="58.189" y="359.915" fill="#000" font-size="12" textLength="51.938">«OA-04»</text><rect x="26" y="392.745" width="618.166" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="413.884" fill="#000" font-size="12" textLength="598.166">5. Recommend the cheapest adequate effector per track within readiness, geometry, and geofen…</text><text x="36" y="427.853" fill="#000" font-size="12" textLength="96.82">«OA-05, OA-06»</text><rect x="29.715" y="460.683" width="610.736" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="39.715" y="481.821" fill="#000" font-size="12" textLength="590.736">6. Present the queue of recommendations with rationale; the engagement authority accepts, ov…</text><text x="39.715" y="495.79" fill="#000" font-size="12" textLength="96.82">«OA-07, OA-31»</text><text x="39.715" y="509.759" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="113.794" y="610.526" width="442.578" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="123.794" y="631.665" fill="#000" font-size="12" textLength="422.578">7. Hand off decided assignments; warn assets on the predicted routes</text><text x="123.794" y="645.634" fill="#000" font-size="12" textLength="96.82">«OA-08, OA-09»</text><rect x="56.516" y="678.464" width="557.135" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="66.516" y="699.603" fill="#000" font-size="12" textLength="537.135">8. Assess: destroyed, missed, continuing; re-plan the remainder; publish PlanSuperseded</text><text x="66.516" y="713.571" fill="#000" font-size="12" textLength="51.938">«OA-10»</text><text x="66.516" y="727.54" fill="#000" font-size="12" textLength="132.668">(prepare and present)</text><rect x="141.743" y="828.308" width="386.68" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="151.743" y="849.446" fill="#000" font-size="12" textLength="366.68">9. Journal everything; produce the raid summary after action</text><text x="151.743" y="863.415" fill="#000" font-size="12" textLength="51.938">«OA-11»</text><ellipse cx="335.083" cy="907.245" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="335.083" cy="907.245" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="55.042" x2="20" y2="918.245" style="stroke:#000;stroke-width:1.5;"/><rect x="654.166" y="542.589" width="431.604" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="664.166" y="563.728" fill="#000" font-size="12" textLength="411.604">6. decide: Engagement authority per layer; supervisor for the queue</text><text x="664.166" y="577.696" fill="#000" font-size="12" textLength="113.578">(OP-02 Supervisor)</text><rect x="773.776" y="760.37" width="192.383" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="783.776" y="781.509" fill="#000" font-size="12" textLength="172.383">8. decide: complete the step</text><text x="783.776" y="795.478" fill="#000" font-size="12" textLength="103.172">(OP-01 Operator)</text><line x1="648.166" y1="55.042" x2="648.166" y2="918.245" style="stroke:#000;stroke-width:1.5;"/><line x1="1089.77" y1="55.042" x2="1089.77" y2="918.245" style="stroke:#000;stroke-width:1.5;"/><line x1="335.083" y1="100.995" x2="335.083" y2="120.995" style="stroke:#181818;stroke-width:1;"/><polygon points="331.083,110.995,335.083,120.995,339.083,110.995,335.083,114.995" fill="#181818" style="stroke:#18