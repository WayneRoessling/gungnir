- id: D-27
  decision: The escrow key holder
  question: >-
    Who holds the escrow key DN-22 §10 describes: a deployment's question the note
    deliberately did not answer.
  raised_in: "`docs/design/DN-22-key-management.md` §10, §11"
  decider: Owner
  unblocks: GAP-084
  resolved: 2026-09-06
  outcome: >-
    **A named security-officer role, per deployment** (the recommended option). DN-22
    amendment 2 (§11) records it: a role that operates nothing and may only recover,
    held by a named account; journal data keys wrapped to the officer's public key
    (P-256 ECDH, HKDF, AES-GCM, all already in the stack), the private half never on a
    node, recovery offline and audited under `KEY_ESCROW_RECOVER`, the public key inline
