- id: D-39
  decision: OS-keystore crate
  question: >-
    Which crate reaches the operating system's keystore behind `KeyProvider`'s
    persistent custody, the condition DN-22 amendment 3 (§12) named for retiring the
    passphrase-sealed file: "until a §2.9 decision admits an OS-keystore crate." The
    same decision closes GAP-057's and GAP-060's remaining items, both of which reduce
    to it from authentication and transport identity respectively.
  raised_in: >-
    `docs/design/DN-22-key-management.md` §12; `agentic-coding-standards.md` §2.9
  decider: Owner with the security engineer
  unblocks: GAP-057, GAP-060, GAP-084
  resolved: 2026-09-08
  outcome: >-
    **`keyring` 4.2.0, `v1` feature only.** Backward-compatible, auto-selecting per
    target: Windows Credential Manager, macOS Keychain, Linux Secret Service. Recorded
    in `agentic-coding-standards.md` §2.9 with the duplicate-linkage check, which found
    two real ones on the Linux target alone (a second RustCrypto generation and a second
    `zbus`, both `secret-service`'s and `zbus-secret-service-keyring-store`'s own pins,
    neither this workspace's to fix) and none on Windows or macOS. Built the same day as
    `PersistentKeyProvider::open_or_create_via_os_keystore` in `gungnir-security`, wired
    into `gungnir-app`'s `build_encryption` alongside the existing passphrase-sealed
    file; not wired into `gungnir-node`, which DN-22 §5 never assigned this row to.
    Human-owned code (`gungnir-security`, `gungnir-app`); written, gated, and signed by
    the owner 2026-09-08 (`../../../ARCHITECTURE.md` item 103, with items 104 and 111).

- id: D-40
  decision: The inference runtime GAP-077 deferred
  question: >-
    GAP-077 built `gungnir-ml`'s traits and `ModelSet` but deliberately deferred signing
    off an inference runtime under §2.9 on 2026-09-05, on two grounds: no model had been
    trained yet to need one, and `docs/ml/architecture.md`'s own condition for a native
    ML dependency -- a security reviewer appointed for it -- had not been met. Neither
    ground has since changed on its own; the question is whether to proceed anyway.
  raised_in: >-
    `docs/plans/09-ml-model-integration.md`; `docs/ml/architecture.md`;
    `agentic-coding-standards.md` §2.9
  decider: Owner
  unblocks: GAP-077, GAP-078, GAP-080
  resolved: 2026-09-08
  outcome: >-
    **`ort` (MIT OR Apache-2.0), un-deferring GAP-077 on the owner's own authority as
    the reviewer the deferral named.** Chosen over `tract` for full ONNX op coverage,
    since Plan 09's intended models are not yet known well enough to confirm they fit
    `tract`'s smaller pure-Rust subset. **`ort`'s default `download-binaries` feature is
    refused**: it fetches prebuilt ONNX Runtime from a third-party CDN, and those
    binaries may carry telemetry -- not acceptable for this system. Recorded in
    `agentic-coding-standards.md` §2.9 and built the same day: `2.0.0-rc.13`,
    `load-dynamic` rather than a from-source static link, so no C++ toolchain is needed
    to compile this workspace either way (confirmed with none installed at all).
    **`load-dynamic` turned out to be load-bearing rather than a convenience**: `ort`
    2.0.0-rc.13 panics, and was confirmed by reproduction to panic twice over in a way
    that hard-aborts the process at exit, when no compatible ONNX Runtime is reachable
    -- true of every environment this landed in -- so `OnnxModel` sits behind
    `gungnir-ml`'s own `onnx-runtime` feature, off by default, until a real ONNX Runtime
    binary is known to be reachable. GAP-077's own entry carries the full account.

- id: D-41
  decision: Real-world CRS support for DEM and point-cloud files
  question: >-
    Neither the DEM loader (GAP-023) nor the point-cloud loader (GAP-098) converts a
    file's coordinates: each requires the file already be in the deployment's local-ENU
    frame and refuses it by name otherwise, because the approved stack has never
    admitted a projection library. Most real DEM and LIDAR data ships in a real-world
    CRS (geographic WGS84 or a projected system such as UTM), so this is a live
    usability limit on both capabilities, not a hypothetical one.
  raised_in: >-
    `agentic-coding-standards.md` §2.9; `gungnir-config` (`validate_terrain`,
    `validate_point_cloud`); GAP-023, GAP-098
  decider: Owner
  unblocks: GAP-023, GAP-098
  resolved: 2026-09-08
  outcome: >-
    **`proj` (MIT OR Apache-2.0), binding `libproj` v9.6.x (X/MIT, OSGeo) via
    `proj-sys`.** Full projection support, not a WGS84-only first step: both geographic
    and projected (e.g. UTM) coordinate reference systems become usable for a DEM or a
    point-cloud file, closing the live usability gap where either loader refuses any
    file not already pre-converted to local-ENU. `proj-sys` finds a system `libproj` or
    builds it from source when none is found, the same two-path shape `vtkio`'s and
    `rcgen`'s own native dependencies already follow. Not yet recorded in
    `agentic-coding-standards.md` §2.9 or built; GAP-023 and GAP-098 carry the remaining
    engineering, including whichever validation and fixture rules
    `validate_terrain`/`validate_point_cloud` need once `"local-enu"` is no longer the
    only accepted frame.

- id: D-42
  decision: Cloud KMS crate(s) for the ManagedService custody profile
  question: >-
    GAP-084 built the disconnected desktop's OS-keystore custody (D-39) but the cloud
    deployment profile's equivalent, `ManagedService`, has never been designed: DN-22 §5
    names it and nothing implements it, and no §2.9 decision has admitted a cloud KMS
    crate for it.
  raised_in: >-
    `docs/design/DN-22-key-management.md` §5; `agentic-coding-standards.md` §2.9
  decider: Owner
  unblocks: GAP-084
  resolved: 2026-09-08
  outcome: >-
    **AWS and Azure, both via their official Rust SDKs: `aws-sdk-kms` (Apache-2.0) and
    `azure_security_keyvault_keys` (MIT, pre-1.0 at 0.9.0 -- noted rather than hidden,
    since a pre-1.0 crate's API may still move) with `azure_identity` for
    authentication.** `azure_security_keyvault` (the older, unofficial crate of a
    similar name) is explicitly not the pin: Microsoft has said it will not be updated
    further now that the official per-service crates exist. Neither GCP KMS nor
    HashiCorp Vault is in scope; a deployment needing either is a future decision, not a
    gap in this one. **Recorded in `agentic-coding-standards.md` §2.9 and built the same
    day**, after the design note this decision said was owed: DN-22 amendment 5 (§14)
    designs the `ManagedService` profile and `gungnir-security/src/managed_service.rs`
    implements it, both human-owned, reviewed and signed by the owner 2026-09-10
    (`ARCHITECTURE.md` §10 item 127). **Two corrections to this decision's own text,
    found when the crates were actually added.** `azure_security_keyvault_keys` is
    **1.0.1**, not pre-1.0 at 0.9.0: it reached 1.0.0 on 2026-05-13, so the 'a pre-1.0
    API may still move' caveat above is retired rather than carried forward as a current
    fact, and `azure_identity` pins 1.0.0 rather than the 1.1.0-beta.1 that also exists.
    And **`aws-config` joins the two crates this decision named**, because `aws-sdk-kms`
    is the service client and carries no credential resolution at all -- the default
    chain that lets DN-22 §6's no-secret-in-a-baseline rule hold for a cloud client
    lives in `aws-config`. It is the crate AWS's own documentation pairs with every
    service SDK, so this is the decision's evident intent rather than a widening of it,
    and it is called out here rather than folded in silently. GAP-084 carries what
    remains: a real cloud round trip that needs credentials this workspace does not
    have; the owner's signature landed 2026-09-10.

- id: D-43
  decision: "What `solve_assignment` promises about a finite total"
  question: >-
    `gungnir_association::solve_assignment` checks that every *entry* of a cost matrix
    is finite and says nothing about the *total* it returns. On an all-finite matrix
    with entries near the representable limit the sum of the selected entries overflows
    and the function returns `Ok` with `total_cost = -inf` (GAP-103, where the behaviour
    is reproduced and characterised). Three answers are available and they are mutually
    exclusive. **(a) Refuse the input**: state a precondition bounding entry magnitudes
    so that an `n`-term sum cannot overflow, and reject a matrix that breaks it. Keeps
    the promise absolute and fails early, but refuses matrices whose optimum is
    perfectly representable, and any bound tight enough to be safe is a magic number of
    the kind this module's own doc comment already rejects for the rectangular-padding
    case. **(b) Check the output**: keep accepting every finite matrix and return a new
    `AssociationError` when the accumulated total is not finite. Never refuses a
    solvable problem, but makes every caller handle an error no real cost matrix can
    produce, and throws away a pairing that GAP-103's measurements show is correct even
    when the total is not representable. **(c) State that no finite total was ever
    promised**: document that the returned total is IEEE-754 arithmetic over the
    selected entries and overflows exactly when the true optimum is not a representable
    `f64`. This is what the code does today, and GAP-103's measurements are the case for
    it being defensible rather than merely convenient; it leaves any caller reading
    `total_cost` to check it. The choice fixes what `verification-capability-table.md`
    §1's Hungarian / Jonker-Volgenant row must say about the domain and the promise --
    it says nothing about either today -- and only then what `gungnir-fuzz`'s own
    postcondition should assert.
  raised_in: >-
    `verification-capability-table.md` §1 (Hungarian / Jonker-Volgenant, and the limits
    list beneath the §1 gate table); `gungnir-association/src/assignment.rs`;
    `gungnir-fuzz/fuzz_targets/cost_matrix_construction.rs`; `docs/agentic-workflow.md`
    (low-trust tier: numerical stability guarantees, no silent NaN propagation)
  decider: Owner with the tracking engineer
  unblocks: GAP-103
  resolved: 2026-09-09
  outcome: >-
    **`Assignment::total_cost` becomes `Option<f64>`; `None` means this problem's
    optimum is not a representable `f64`.** Chosen over the three answers the register
    framed, for reasons that were measured rather than argued. **Refusing the input was
    rejected**: no precondition can be both safe and tight, because which entries the
    optimum selects is not known until it has been solved, so any bound would refuse
    matrices whose optimum is perfectly representable -- and `assignment.rs`'s own
    module documentation already rejects that reasoning for rectangular padding, calling
    a large-enough pad value the kind of magic number that breaks quietly on a matrix
    with an unexpected scale. **Erroring on a non-finite total was rejected**: the
    pairing is provably correct in that case, and all three production callers consume
    only the pairing -- `GlobalNearestNeighbor::associate`, `gungnir-fusion-async`'s
    associate step, and `gungnir-metrics`'s CLEAR stage 2 each take `row_to_col` and
    discard the total -- so an error would have dropped a whole scan of tracking over a
    number none of them reads. **Promising nothing was rejected** as the weakest of the
    three on the table: it is true, and `-inf` is the correct IEEE-754 value of that
    sum, but it leaves a non-finite value reachable through a `pub f64` field on a
    function whose input guard exists precisely to stop non-finite values, guarded only
    by a doc comment -- the silent propagation `docs/agentic-workflow.md`'s low-trust
    tier names. **The `Option` is a fourth answer, raised when the owner walked the
    decision, and it says the one thing that is true**: there is an optimal assignment,
    and its cost is not a number. It refuses no solvable input, discards no correct
    pairing, and makes the unrepresentable case impossible to read by accident, because
    the type enforces it rather than the documentation. Its migration cost was near zero
    for the same reason erroring was wrong: nothing in production reads the field, so
    only the oracle diff test and the benchmark changed. **Built the same day**
    (GAP-103). Human-owned change, being a numerical stability guarantee: **written,
    gated and signed by the owner 2026-09-09**, the same day he took the decision and on
    his own owner authority. The signature covers the contract change, its tests, and
    the reconciled fuzz postcondition, and it was given with the one judgement call
    inside it stated rather than buried: floating-point addition is not associative, so
    `Some` versus `None` is exact about the solver's own accumulation and not about the
    ideal real-number sum, and making it order-free would need exact or scaled
    summation. That was judged not worth the added subtlety in a human-owned file whose
    one production cost matrix is bounded near 1.1e4 by construction, and
    `assignment.rs` documents the limit.

- id: D-44
  decision: STANAG 4676 in this release, or out of it
  question: >-
    GAP-064's own rule is a pinned edition and a public sample before a codec is
    written, and `../../design/external-standards.md` §2 records that neither is
    obtainable: STANAG 4676 is the cover agreement, AEDP-12 is the implementation
    document, and no download link for either could be confirmed -- the note's own open
    action is that somebody with NSO access retrieves AEDP-12 Ed A v1 and records its
    marking. Meanwhile the entry gates GAP-001's last dependency and the whole of
    GAP-063, whose closing action says the 4676 row is all that is left of the
    conformance suite. Three answers: retrieve it, descope it, or write the codec from
    secondary descriptions -- the last being exactly the outcome GAP-064 exists to
    prevent.
  raised_in: "`../../design/external-standards.md` §2; GAP-064; GAP-063"
  decider: Owner
  unblocks: GAP-064, GAP-063, GAP-001
  resolved: 2026-09-15
  outcome: >-
    **Descoped, and recorded as an amendment to D-01's scope lock rather than allowed to
    lapse quietly** -- the same way D-33 recorded an *addition* to it. STANAG 4676
    leaves the first release: `Stanag4676Codec` keeps returning `NotImplemented` naming
    the reason, GAP-064 closes as ASTERIX-done-and-4676-deferred-by-decision, and
    GAP-063's conformance suite closes without the row its own action called the whole
    of what was left. The reason is the specification, not the effort:
    `external-standards.md` §2 records that neither STANAG 4676 nor AEDP-12 could be
    obtained in any verifiable form, and the owner's own note on this decision is that a
    NATO marking might forbid transcribing the tables into a public AGPL repository even
    if a copy arrived -- so retrieval could end in the same place after the cost.
    Writing the codec from secondary descriptions was refused by name:
    `external-standards.md` §2 calls that the written-from-memory outcome GAP-064 exists
    to prevent, and a conformance suite gated on a guessed wire format would be the kind
    of false claim this workspace's rules forbid. The route back in is unchanged and
    stays recorded: somebody with NSO access retrieves AEDP-12 Ed A v1, records its
    marking, and the gap is re-filed.

- id: D-45
  decision: How predictions over a rehearsal become one first-engagement range
  question: >-
    DN-02 §7 names the aggregation and specifies nothing, and three entries stop at it:
    GAP-020 (whose predictor half is built), GAP-045's rehearsal and GAP-087's panel,
    which has the column and no rule to fill it. The choice is what a laydown's
    first-engagement range means when a run produced many predictions per approach --
    the worst case, the typical one, or a stated percentile -- and it is load-bearing
    because US-15 compares two laydowns on exactly that column.
  raised_in: >-
    `../../design/DN-02-prediction-and-approach.md` §7;
    `../../ux/usability-test-plan.md` US-15
  decider: Owner
  unblocks: GAP-020, GAP-045, GAP-087
  resolved: 2026-09-15
  outcome: >-
    **The worst case: the minimum first-engagement range over the run**, labelled as the
    worst case and carrying the number of predictions behind it, rather than a mean, a
    median or a percentile. The argument is US-15's own table: it compares two laydowns
    on this one column, and a best-case or averaged figure flatters the weaker laydown
    on exactly the comparison the column exists to make. The count travels with it so a
    figure from three predictions is not read as a figure from three hundred. DN-02 §7
    gains the rule as an amendment; GAP-020's predictor half is already built, so what
    follows is the aggregation and PN-16's column.

- id: D-46
  decision: The dense-group pipeline's default filter
  question: >-
    `DenseGroupFilter::Phd` is the default and its doc comment gave the CPHD's
    then-unsigned derivation as the reason. That reason expired when item 109 signed
    CPHD and item 128 signed the LMB and the dense-group wiring, so the default is now a
    live choice rather than a consequence: PHD is cheaper and assumes a Poisson
    cardinality, CPHD estimates cardinality properly under clutter and costs more per
    scan. Item 128 named the question and deliberately did not answer it, flipping a
    pipeline's default being a behaviour change nobody had asked for.
  raised_in: >-
    `../../../ARCHITECTURE.md` §10 item 128; `gungnir-fusion-async`
    (`DenseGroupFilter`); GAP-015
  decider: Owner with the tracking engineer
  unblocks: GAP-015
  resolved: 2026-09-15
  outcome: >-
    **PHD stays the default, and the choice becomes configurable** through the
    `TrackingConfig` vocabulary GAP-015's closing action already owed for the
    dense-group mode's settings. So a deployment that wants CPHD's cardinality estimate
    under clutter asks for it by name, and no shipped deployment's behaviour changes
    underneath it. `DenseGroupFilter::Phd`'s doc comment, corrected in item 128 to say
    the flip was an open question, now records the answer and the reason for it.

- id: D-47
  decision: >-
    Whether a node's TLS identities persist, and whether the two roles share one
  question: >-
    Item 105 closed the provider-issued gap between a node's serving identity and its
    outbound peer-link identity and left the ephemeral-or-persistent one open for both:
    `issue_for_client` builds a fresh `P256KeyProvider` every start, so a node presents
    a new certificate after every restart and no peer can pin it. Making either survive
    a restart needs a `gungnir-security` generalisation -- the service-name
    parameterisation item 104 already made for `wrapping_secret` -- and a decision about
    whether the serving and outbound roles then share one persisted identity or hold
    two.
  raised_in: >-
    `../../../ARCHITECTURE.md` §10 item 105; `gungnir-node/src/main.rs::host_tls`;
    `../../design/DN-22-key-management.md` §5
  decider: Owner with the security engineer
  unblocks: GAP-060
  resolved: 2026-09-15
  outcome: >-
    **One persisted identity, held by both roles.** A node is one machine identity,
    which is what D-02's mutual-TLS model already assumes and what a peer's trust store
    can pin across a restart; two identities would double the custody surface -- two
    keys, two rotations, two escrow records per node -- for a blast-radius argument that
    a single-process binary does not really earn. What it needs is the
    `gungnir-security` generalisation item 105 named:
    `PersistentKeyProvider::open_or_create_via_os_keystore`'s hardcoded desktop service
    name becomes a parameter, exactly as item 104 did for `wrapping_secret`, and
    `host_tls` and `spawn_tls_from_provider` then issue from the same persisted
    provider. Human-owned crate; it comes to the owner as a review.

- id: D-48
  decision: What the wrapped-secret file records about the key that wrapped it
  question: >-
    GAP-084 item (3): `AzureKeyVaultKeyService`'s unwrap asks Key Vault for the key's
    latest version, and `WRAPPED_SECRET_FILE` records nothing about the version a secret
    was actually wrapped under. A deployment that rotates its master key therefore holds
    a blob the service will not open -- and that blob is what unlocks the keystore
    protecting the journal. Recording the version changes both the file's format and
    what `CloudKeyService::wrap` returns, which is a persisted-format decision rather
    than a fix, and one no test here can verify against a real vault.
  raised_in: >-
    `../../design/DN-22-key-management.md` §14e;
    `gungnir-security/src/managed_service.rs`; `../../../ARCHITECTURE.md` §10 item 129
  decider: Owner with the security engineer
  unblocks: GAP-084
  resolved: 2026-09-15
  outcome: >-
    **Record the version.** `CloudKeyService::wrap` returns the key version alongside
    the wrapped bytes, `WRAPPED_SECRET_FILE` gains a small versioned header, and unwrap
    asks for that exact version instead of the latest. Chosen over documenting a
    rotation procedure because the failure the procedure would be guarding against is a
    node that cannot open its own keystore after a routine key rotation -- a lost
    journal record, arrived at by following ordinary operational advice -- and over
    re-wrapping at every start because a rotation while the node is down still strands
    the old blob, narrowing the window rather than closing it. It lands the way the rest
    of this profile did: tested against the `CloudKeyService` fake, with `#[ignore]`d
    tests naming the environment variables a real vault would need, and **no claim of a
    cloud round trip**.

- id: D-49
  decision: Whether GAP-082's central differential-test harness is still wanted
  question: >-
    GAP-061 item (5). The differential suite that actually runs is distributed across
    the nine crates it verifies and is what Gate 1 gates; `docs/agentic-workflow.md` §1
    still names `gungnir-oracle` as the vehicle, and GAP-082's closing action still
    carries a central harness as an intention. One of the two has to give.
  raised_in: "`docs/agentic-workflow.md` §1; GAP-061 item (5); GAP-082"
  decider: Owner
  unblocks: GAP-061
  resolved: 2026-09-15
  outcome: >-
    **Retire the central harness; fix the document.** The distributed suite is what
    runs, what Gate 1 gates and what every oracle row in
    `../../verification-capability-table.md` cites, so `docs/agentic-workflow.md` §1 is
    re-pointed at where the differential tests actually live and GAP-082's
    central-harness intention is struck rather than built. Building it would duplicate
    what nine crates already do and add a second thing to keep in step with them -- and
    the drift this decision closes is the ordinary one this workspace's rules exist to
    catch: a document naming a vehicle that is not the vehicle.

- id: D-50
  decision: Which of GAP-045's three undesigned controls are scoped now
  question: >-
    GAP-045's closing action names three things that are each a decision rather than a
    build: laydown-aware sensor geometry (a rehearsal cannot move the sensors a laydown
    declares, because `gungnir-scenario` accepts no placement override and no gap scopes
    one), the gap-acceptance control (US-16 waits on it and it has no design), and the
    rehearsal-gated submit (DN-26 §6 rule 4 deliberately built no adoption workflow to
    gate). The first is why round 1 needed a third laydown invented purely to produce a
    measurable coverage difference.
  raised_in: >-
    GAP-045; GAP-087; `../../design/DN-26-laydown-options.md` §6;
    `../../ux/usability-test-plan.md` US-16
  decider: Owner with the plan 06 lead
  unblocks: GAP-045, GAP-087, GAP-074
  resolved: 2026-09-15
  outcome: >-
    **All three, scoped now** -- the owner's answer, against a recommendation to take
    only the first. The placement override is filed as GAP-105, the gap-acceptance
    control as GAP-106 and the rehearsal-gated submit as GAP-107. Two of the three have
    no design at all yet, so each gets a design note before code, and GAP-105 comes
    first regardless of that order because it is the one that makes a laydown comparison
    rest on real geometry: today a rehearsal cannot move the sensors a laydown declares,
    which is why round 1 had to declare a third laydown purely to produce a coverage
    difference US-15 could measure. Closing all three closes GAP-045's and GAP-087's
    tails and unblocks US-07 and US-16, which GAP-074 currently holds for round 2.

- id: D-51
  decision: >-
    The CRS tail: whether `proj` becomes a default feature, and where the vertical datum
    lives
  question: >-
    GAP-102 left both named. `proj` is behind a default-off feature because `proj-sys`
    links libproj and needs cmake and SQLite3, so CI is the only place the conversion
    has ever run; making it default puts that toolchain in front of every contributor
    and every `cargo deny` run. Separately, a converted height is the file's own
    vertical datum in metres rather than a WGS-84 ellipsoidal height, because no geoid
    model is applied -- GAP-102's own text calls that its own gap without filing one.
  raised_in: >-
    GAP-102 items (3) and (5); `docs/agentic-coding-standards.md` §2.9 (D-41);
    `deny.toml`
  decider: Owner
  unblocks: GAP-102
  resolved: 2026-09-15
  outcome: >-
    **`proj` stays opt-in, and the geoid model is filed as GAP-108.** Default-off stays
    because making it default puts libproj, cmake and SQLite3 in front of every
    contributor's build and every `cargo deny` run, for a conversion few deployments
    need -- and `deny.toml`'s `all-features = false` would then have to be revisited
    with new crates in the licence graph. The vertical datum gets a register entry of
    its own so that a converted height being the file's own vertical datum rather than a
    WGS-84 ellipsoidal height is a named gap in the summary table, rather than a
    sentence inside another entry's text, which is where GAP-102 left it.

- id: D-52
  decision: Whether a cooperatively-identified UAS gets a platform class
  question: >-
    GAP-101's consumer (item 129) submits identity evidence for a Category 129 contact
    and maps no platform class, so `assessment.lethality_by_class` weighs such a track
    1.0 while AIS maps an M.1371-6 ship type to `surface.*` and ADS-B a DO-260B category
    to `air.crewed`. Category 129 carries a manufacturer and a model string allocated by
    a registration authority rather than a capability category, and the class catalogue
    draws its air classes by threat type -- so a mapping here would be a class invented
    at the consumer, or a new catalogue entry with a mission argument behind it.
  raised_in: >-
    `../../../ARCHITECTURE.md` §10 item 129; `gungnir-app/src/uas.rs`;
    `docs/test-tracks/classes.yaml`; GAP-027
  decider: Owner
  unblocks: GAP-027, GAP-101
  resolved: 2026-09-15
  outcome: >-
    **No platform class for a cooperatively-identified UAS; GAP-080's classifier owns
    the question.** The refusal `gungnir-app/src/uas.rs` already states is confirmed as
    the decision: Category 129's manufacturer and model strings are
    registration-authority allocations rather than a capability category, and the
    mission's air classes are drawn by threat type, so a lethality weight derived from
    one would be a guess wearing a number. A cooperative UAS therefore weighs 1.0 in
    `lethality_by_class` -- unknown is not harmless, which is the same rule the register
    already states for a track no source has classified.

- id: D-53
  decision: How a reconciliation conflict is resolved
  question: >-
    D-03 locked `RoleRankArbiter` as the rule for conflicting decisions -- the higher
    role wins, the earlier decision wins a tie -- and GAP-050 built reconciliation to
    report every conflict and leave each to a person on PN-18, so the rule was locked
    and never applied. A journaled decision also carried no role to rank it by, and the
    desktop's authority role never followed the signed-in account. Build the rule into
    reconciliation, or record that a person resolves every conflict.
  raised_in: >-
    `verification-capability-table.md` §2, the cross-layer Disconnected reconciliation
    row; `gungnir-app/src/failover.rs`; the GAP-067 walk
    (`../../record/2026-09-16/gap-067-walk.md`)
  decider: Owner
  unblocks: GAP-067
  resolved: 2026-09-16
  outcome: >-
    **D-03's rule resolves every reconciliation conflict it can rank, and a person
    resolves the rest.** A conflict is a decision on one side of an outage against a
    different decision, or an expiry, on the other. A real decision beats an expiry
    (DN-10 §9); otherwise the higher recorded role wins, and on equal rank the earlier
    decision. A side whose role was never recorded cannot be ranked honestly, so that
    conflict stays on PN-18 for a person permitted `plan.decide`, and the switch back
    waits for them; the journal says whether the rule or a person resolved each. For the
    rule to have something to rank, a decision records the role of the signed-in account
    that made it and none when nobody is signed in (DN-23 §5 rule 1), and the desktop's
    authority role follows the signed-in account, staying role-selected without a
    session (rule 5). The owner chose this over the recommendation, which was to record
    that a person resolves every conflict.

- id: D-54
  decision: Whether a tasking concurrence may name nobody
  question: >-
    DN-11 amendment 1 b let a concurrence carry a role with nobody signed in
    (`Concurrence::UnattributedRole`) because no build had an operator session, and kept
    the CAP-2.12 criterion asking for a concurrence carrying an operator. Desktop
    sign-in has since shipped (GAP-057), and tasking still succeeded with nobody signed
    in. Enforce the operator, or amend the criterion to accept a role, which amendment 1
    b declined.
  raised_in: >-
    `verification-capability-table.md` §2, the `gungnir-workflow` collection
    requirements and tasking concurrence row; DN-11 amendment 1 b; the GAP-067 walk
    (`../../record/2026-09-16/gap-067-walk.md`)
  decider: Owner
  unblocks: GAP-067
  resolved: 2026-09-16
  outcome: >-
    **A requirement moves to Tasked only with a concurrence a signed-in operator gave;
    the criterion stands.** `TaskingCase::concur` refuses a concurrence that names no
    operator, and the desktop checks for one before issuing the command, so a refusal
    leaves no task behind. A deployment with no account store therefore cannot task
    through a requirement, and the refusal says so. A decline is outside the criterion
    and still records either concurrence. The MT-08 replay the row's method names is
    built over TT-08, whose sample events now script MT-08's first three steps (DN-11
    amendment 3).

- id: D-55
  decision: Where plan decisions live when desktops are linked to a node
  question: >-
    A node proposes plans and decides none, so every linked desktop queues, decides,
    engages and hands off the node's plans itself: two desktops on one node each decide
    the same plan without knowing, escalation reaches nobody, and no decision reaches
    the node's record (GAP-129). Should the node hold the queue, should desktops forward
    their decisions to it, or should decisions stay on desktops?
  raised_in: "GAP-129; `../../design/DN-31-node-approval-queue.md`"
  decider: Owner
  unblocks: GAP-129, GAP-132, GAP-133, GAP-134
  resolved: 2026-09-17
  outcome: >-
    **The node holds the queue for the desktops linked to it.** It authorizes each
    decision against the caller's role, takes one decision per item, opens the
    engagement, issues the handoff and journals all of it. While connected, the first
    valid decision on an item wins and a later one is refused naming the decision that
    stands (DN-10 §5's "whoever decides first ends it"). A desktop cut off from its node
    decides what its signed-in role may, with D-15's delegations lapsing after a
    configured interval, and forwards its decisions when the node answers, for D-53 to
    reconcile. The code both binaries need lives in one shared library rather than a
    copy on the node. Chosen over forwarding decisions without a shared queue, which
    would find a double decision only after both engagements had opened.

- id: D-56
  decision: How decision, plan and queue-item identifiers become unique
  question: >-
    `DecisionId`, `PlanId` and `PendingApprovalId` restart at 1 in every process, so
    they collide across desktops, nodes and restarts, and an effector report matches its
    handoff by `DecisionId` alone. UUID v7, a machine-prefixed u64, or node-minted
    identifiers?
  raised_in: "GAP-129; `../../design/DN-31-node-approval-queue.md` §5.1"
  decider: Owner
  unblocks: GAP-130
  resolved: 2026-09-17
  outcome: >-
    **UUID v7, minted where each thing is created**, as `GlobalEntityId` already is. The
    field type changes, so by the interface's own rule `SCHEMA_VERSION` goes from 3 to 4
    and the routes move to `/v3`. A journal written before the change still reads.
    Chosen over a machine-prefixed u64, whose uniqueness would rest on configuring every
    machine with a different prefix, and over provisional identifiers replaced on
    forwarding, which would rewrite journaled records.

- id: D-57
  decision: Where the shared decision path lives, and its edges
  question: >-
    The policy chain, submission and sweep, deciding with engagement opening and the one
    handoff builder, and handoff delivery bookkeeping live only in `gungnir-app`. D-55
    puts them in a library both binaries use: a new crate, `gungnir-command`, or
    `gungnir-workflow`?
  raised_in: "`../../design/DN-31-node-approval-queue.md` §3 and §4"
  decider: Owner
  unblocks: GAP-131
  resolved: 2026-09-17
  outcome: >-
    **A new productization crate, `gungnir-approval`**, depending on command, policy,
    intercept-service, security, config, eventing and model (edge (w)); `gungnir-app`
    depends on it (x), and `gungnir-node` on it and on `gungnir-command` (y). Handoff
    delivery goes through a trait each binary implements with `gungnir-remote`'s
    endpoint client, so the library never reaches the transport. Each edge is drawn and
    recorded in the change that adds it to a manifest.

- id: D-58
  decision: Whether reconciliation compares engagements as well as plans
  question: >-
    A desktop cut off from its node plans from its own picture, so its plans never share
    identifiers with the node's, and reconciliation, which pairs decisions by plan,
    calls two engagements of the same track on the two sides of an outage no conflict.
  raised_in: "D-53; `../../design/DN-31-node-approval-queue.md` §6.8"
  decider: Owner
  unblocks: GAP-134
  resolved: 2026-09-17
  outcome: >-
    **Reconciliation also compares engagements by track.** Two engagements of one track
    opened on the two sides of an outage are a both-may-have-acted incident for a
    person, published and alerted whatever their plans and whatever D-53's rule decided
    about any plan conflict, because choosing which record stands does not undo an
    effect in the world.

- id: D-59
  decision: Whether a pre-delegated item escalates
  question: >-
    DN-10 §5 says a pre-delegated item still expires and escalates; GAP-035's closing
    note says escalation is what it skips; the code escalates it and uses the flag only
    for display. Which rule does the node's queue follow?
  raised_in: "DN-10 §5; GAP-035; `../../design/DN-31-node-approval-queue.md` §6.2"
  decider: Owner
  unblocks: GAP-132
  resolved: 2026-09-17
  outcome: >-
    **DN-10 §5: a pre-delegated item is actionable for the Operator from submission and
    still expires and escalates**, so a supervisor sees a delegated item nobody took.
    The code already does this; GAP-035's closing note was wrong and carries a
    correction.

- id: D-60
  decision: How identifiers are written on the wire and in journals
  question: >-
    `DecisionId`, `PlanId` and `PendingApprovalId` hold a UUID v7 as a `u128` (D-56), and
    DN-31 §5.1 kept their JSON form a number, so that a pre-change journal reads because a
    u64 number is a valid u128. A 128-bit JSON number fails `serde_json::to_value`, is
    rounded to a float when parsed into a `serde_json::Value`, and cannot be read inside a
    field-tagged enum; the handoff posted to an effector and the handoff body published
    for exchange both pass through a `Value`, and with a numeric v7 identifier both became
    `null`. A number read through `serde_json`'s `arbitrary_precision`, raw JSON bodies on
    the two handoff paths, or a string?
  raised_in: "GAP-130; `../../design/DN-31-node-approval-queue.md` §5.1"
  decider: Owner
  unblocks: GAP-130
  resolved: 2026-09-17
  outcome: >-
    **The standard hyphenated RFC 9562 string, still reading numbers.** The identifiers
    stay `u128` in memory, minted with `Uuid::now_v7()`; they serialize as the hyphenated
    form and deserialize from that form or a JSON integer, so every pre-change journal,
    fixture and test literal still reads, and a path parameter takes the hyphenated form
    or a decimal number. Implemented once, in `gungnir-model`. Chosen over
    `arbitrary_precision`, which changes how every number inside a field-tagged enum is
    buffered and breaks those enums, and over raw JSON bodies, which would change DN-18's
    exchange types and still hand a 128-bit number to readers outside Rust that round it.

- id: D-61
  decision: How identifiers are shown
  question: >-
    A UUID v7 is 36 characters, and its leading digits are a millisecond timestamp, so the
    identifiers one session mints look alike at the start. Until GAP-130 panels, alerts,
    audit entries, journals and reports named decisions and plans by a small counter. Show
    the full UUID everywhere, a short tag, or a label each desktop assigns?
  raised_in: "GAP-130; `../../design/DN-31-node-approval-queue.md` §5.1"
  decider: Owner
  unblocks: GAP-130
  resolved: 2026-09-17
  outcome: >-
    **A short tag on screen, the full identifier in the record.** Panels and alerts show
    the last eight hex digits as `…9f3a61c2`, the random end; PN-07 and the handoff
    panel's detail show the full identifier with a copy control; audit entries, journals,
    reports and log fields carry the full form. A rehearsal seed's plan (`P-1183`) keeps
    the number the seed gives and is shown as given. Chosen over full UUIDs everywhere,
    which crowd a queue row and are told apart only at the end, and over per-desktop
    labels, which would give one decision different names on different desktops.

- id: D-62
  decision: Whether gate 6 ever enforces its threshold on this runner
  question: >-
    Gate 6 compares criterion results against a baseline saved from `main` on
    `gungnir-rtx-5060ti`, the owner's own workstation. Three measurements of unchanged
    code moved ratios by up to 1.04, and every benchmark crossed the 10 percent
    threshold at least once, so `BENCH_REGRESSION_ENFORCE` stayed `"0"`. Enforce it on
    this host after further work (a multi-run baseline, criterion's own statistical
    comparison, a wider threshold), or accept that it never enforces here?
  raised_in: "GAP-093; `../../record/2026-09-17/gate-6-noise-floor-and-core-pinning.md`"
  decider: Owner
  unblocks: GAP-093
  resolved: 2026-09-17
  outcome: >-
    **It never enforces on this machine.** Gate 6 stays advisory on
    `gungnir-rtx-5060ti`: it runs, compares, and prints every ratio and every threshold
    breach for a person to read, and it does not fail a pull request. A regression is
    found by reading those ratios, by the budget assertions in
    `gungnir-app/tests/frame_budgets.rs`, which are pass criteria and unaffected, and by
    the absolute figures in `../../performance-budgets.md`. Chosen over widening the
    threshold, which would make a gate criterion say less than it does now, and over a
    multi-run baseline or a statistical comparison, which is engineering spent on a host
    whose noise is the owner using it. The `pull_request` trigger does not come back.
    Enforcement would need a different machine, which is not in scope for this release.
    See `../../record/2026-09-17/gate-6-stays-advisory-on-this-runner.md`.

- id: D-63
  decision: Whether the self-hosted runner is installed as a service
  question: >-
    `gungnir-rtx-5060ti` is an interactive `run.cmd` listener, so it goes offline
    whenever its window closes or the workstation sleeps; that interrupted four of the
    2026-09-16 and 2026-09-17 measurement runs. Install it as a Windows service under an
    account of its own, or leave it interactive?
  raised_in: "GAP-093; GAP-061"
  decider: Owner
  unblocks: GAP-093
  resolved: 2026-09-17
  outcome: >-
    **It stays interactive.** No service install, and no separate account for it. The
    runner is started by hand when it is needed. Nothing shipped depends on it: no
    release artifact is built there (`release.yml` builds on hosted runners), and the two
    workflows that use it are gate 6, now advisory by D-62, and `gpu-fusion.yml`, which
    is manual dispatch only. So an offline runner delays re-evidencing the GPU path row
    and a benchmark comparison, and blocks nothing else. See `../../record/2026-09-17/gate-6-stays-advisory-on-this-runner.md`.

- id: D-64
  decision: How a rehearsal observes a laydown's sensors
  question: >-
    A rehearsal replays a fixture's recorded detections, captured once from the sensor
    positions in the fixture's own `sensors.json`, so selecting a different laydown changes
    nothing a rehearsal can show about sensors (GAP-105). Commit one pre-generated fixture
    per laydown, or generate the detections a laydown's sensors would have produced at
    rehearsal time, inside the production binary?
  raised_in: "GAP-105; `../../design/DN-32-re-observation-for-a-laydown.md`"
  decider: Owner
  unblocks: GAP-105
  resolved: 2026-09-16
  outcome: >-
    **Generated at rehearsal time, in the production binary.** Chosen over committing a
    fixture per laydown, which keeps the dependency rule intact but only ever covers the
    laydowns somebody generated fixtures for. The cost is accepted deliberately: the
    operational binary gains an observation model it does not need for live operation, so
    the design carries the containment that keeps a synthetic detection out of every live
    path, and the `gungnir-ingest` gateway's refusal is human-owned. Decided 2026-09-16 and
    recorded here 2026-09-17: the design it belongs to sat unmerged on a branch, and the id
    it first claimed (D-53) was taken by the GAP-067 walk in the meantime. No code exists;
    `../../signatures.md` is where the design's signature status is stated.

- id: D-65
  decision: Whether the decision path is human-owned wherever it runs
  question: >-
    `docs/agentic-workflow.md`'s recommend-versus-act boundary names `gungnir-policy`'s
    verdict logic and `gungnir-command`'s approval workflow. DN-31 moved the rest of that
    path -- the policy chain over a plan, the queue's feeding and sweep, deciding with
    engagement opening and the one handoff builder -- out of `gungnir-app`, which the list
    never named, into `gungnir-approval` (GAP-131), and then on to a node, which the list
    never contemplated (GAP-132). Does the list follow the code?
  raised_in: "GAP-131; GAP-132"
  decider: Owner
  unblocks: GAP-133
  resolved: 2026-09-17
  outcome: >-
    **It follows the code.** `gungnir-approval` and the node loop that runs it
    (`gungnir-node/src/approval.rs`) are human-owned, added to the list in
    `../../../agentic-workflow.md`. The rule is about a boundary -- nothing executes an
    intercept without a recorded human decision -- rather than about the three crates that
    happened to hold it, so a change that moves the boundary's code moves the ownership
    with it. Raised rather than folded into the change that moved it, on the precedent the
    same list records for `gungnir-remote`'s identity path (GAP-060, answered 2026-09-06),
    and answered the same way.

- id: D-66
  decision: The order a reconnecting desktop settles, forwards and switches back
  question: >-
    DN-31 §6.8 has a desktop forward the decisions it took while cut off and then reconcile
    over the node's history. GAP-134's build found that order puts contradictory decisions
    on the node's record with nothing beside them saying which stands, and makes the merge
    read the desktop's own forwarded decisions back as the node's. Keep §6.8's order, or
    settle before forwarding?
  raised_in: "GAP-134"
  decider: Owner
  unblocks: GAP-134
  resolved: 2026-09-17
  outcome: >-
    **Settle first.** The merge comes first -- the plan conflicts and, in the same pass, the
    engagements by track, with `BothActed` published before the rule settles anything
    (D-58) -- then the whole outage is forwarded as one batch carrying each settlement, which
    the node applies whole or not at all, then a person switches back (D-15). Recorded as
    DN-31 amendment 2 (§13), with `ForwardedDecision`'s `settled` field,
    `LinkEvent::DelegationsLapsed`, and the build's finding that plan conflicts cannot arise
    across an outage as built, so D-58's comparison by track is what catches two actions on
    one track. See `../../record/2026-09-17/an-outage-reaches-the-node-once.md`.

- id: D-67
  decision: How a desktop is named, and what it forwards when its key is ephemeral
  question: >-
    Every desktop's link identity carried the common name `gungnir-app`, so a node could
    not tell two apart, and a forwarded decision's `origin` could say a desktop took it but
    not which (GAP-141). Should a desktop be named by something the deployment states, or
    by its own key? And what should a desktop whose key provider is unreachable, and whose
    identity is therefore ephemeral, forward as its origin?
  raised_in: "GAP-141; GAP-137 waits on it"
  decider: Owner
  unblocks: GAP-137
  resolved: 2026-09-22
  outcome: >-
    **By its own key, and an ephemeral desktop still forwards and says so.** A desktop is
    `desktop-` and sixteen hex digits of a SHA-256 over the public half of the key its
    certificate carries, so the name is a function of what the handshake proved rather than
    a string a self-signed certificate asserts, and the node can check a forwarded batch's
    origin against the party it verified with no configuration. A desktop whose key is
    ephemeral is named `desktop-ephemeral-` and the same fingerprint: it forwards as
    before, because refusing would keep every offline decision off the node's record
    (DN-31 §9 row 8), and the name says what the origin is worth. A stated, readable label
    was not taken: two desktops could claim one name and nothing would detect it. See
    `../../record/2026-09-22/a-desktop-is-named-by-its-own-key.md`.
- id: D-68
  decision: How the node's own exchange set and a desktop's published set share one register
  question: >-
    `NodeApi::publish_exchange` replaced the held set for an item, which is the right
    contract while one desktop writes to it. Two writers now exist: the node issues
    handoffs of its own since GAP-132, and a desktop that fell back publishes its whole set
    on reconnect (GAP-133, GAP-134). Each would silently overwrite the other, and which set
    a partner saw would depend on tick order. One set per producer merged on read, the node
    as the sole writer merging what desktops post, or append per handoff?
  raised_in: "GAP-132; GAP-133; GAP-134; GAP-137"
  decider: Owner
  unblocks: GAP-137
  resolved: 2026-09-23
  outcome: >-
    **One set per producer, merged on read** (DN-18 §11). The register is keyed by item and
    then by the name the connection was verified under -- since GAP-141 a digest of the
    desktop's own key (D-67) -- with the node's own set a variant of its own so no desktop
    name can collide with it. A publish replaces that producer's set alone; a read
    concatenates every producer's, the node's first, and answers `NotHeld` only when none
    holds any. The node as sole writer would have needed a collision rule for two desktops
    claiming one product, and that rule would have lived in the transport; append per
    handoff cannot express a withdrawal, which DN-18 §5's "partial delivery is reported"
    turns on. Bounded at 64 producers an item, refused rather than evicted. The owner
    answered as proposed on 2026-09-23, the day after the build. See
    `../../record/2026-09-23/a-partner-hears-what-the-node-decided.md` and
    `../../record/2026-09-23/the-register-s-contract-is-decided.md`.
- id: D-69
  decision: What makes a producer's exchange set stale, and what a partner is told about it
  question: >-
    The exchange register holds one set per producer (D-68) and has no lifecycle. It lives
    in the node's memory, so a node restart loses every set and no desktop republishes
    until it next issues a handoff; and nothing forgets a producer that has gone away, which
    an ephemeral desktop (D-67) creates afresh every run. A republish interval a desktop
    keeps to, a node that asks for one on reconnect, or a set that expires with the session
    that wrote it?
  raised_in: "GAP-137; GAP-145"
  decider: Owner
  unblocks: GAP-145
  resolved: 2026-09-23
  outcome: >-
    **Nothing expires, the answer carries its age, and a desktop refreshes when its link
    comes back** (DN-18 §12). A handoff is a decision that was taken, so expiry would
    delete a true thing to hide an unknown one, and a partner would watch a list shrink for
    a reason no field explains. `as_of` on both `ExchangeResponse` variants is the node
    time the least recently refreshed producer wrote, which is what a partner can be told
    without learning how many consoles this deployment runs. A desktop publishes its whole
    handoff set the tick its link returns -- the edge, not the state -- and one holding none
    publishes none. The bound is unchanged: a new producer beyond sixty-four is refused
    rather than evicting a set a partner is served from. See
    `../../record/2026-09-23/a-register-that-says-how-old-it-is.md`.
- id: D-70
  decision: Whose clock a node's deadline is drawn against, and when a console is told they differ
  question: >-
    A node's queue item carries `expires_at` in the node's mission time, and PN-06 drew the
    countdown against the desktop's own clock. Both are wall clocks, so they agree only as
    far as the two machines do and nothing measured the difference (GAP-140). Should the
    node's time travel with the picture and the countdown follow it, and at what difference
    should a console be told the two clocks disagree at all?
  raised_in: "GAP-133; GAP-140"
  decider: Owner
  unblocks: GAP-140
  resolved: 2026-09-23
  outcome: >-
    **The node stamps its clock on the snapshot as it answers, the desktop measures the
    offset once per connection and draws the node's deadlines against the node's time, and
    PN-01 says the difference above one second** (DN-31 §14). The pair of readings is kept
    rather than the difference, so a countdown advances on the desktop's own clock between
    snapshots while staying on the node's scale. One second is the threshold because a
    countdown is drawn to the second: below it nothing a person reads can change, above it
    the console and the node disagree by a digit on the screen. Nothing sets or steers a
    clock. See `../../record/2026-09-23/a-deadline-in-the-node-s-own-time.md`.
- id: D-71
  decision: What a desktop that has never reached its node does
  question: >-
    A desktop judges its node's silence against the heartbeat, measured from the last thing
    heard. A link that has never been heard from has no such measure, so a desktop that
    signed in to an unreachable node was neither linked nor fallen back: it sat on a remote
    backend with a queue it could not read and a decision path it could not use, for ever
    (GAP-142). Is a node that has never answered silent, and from when?
  raised_in: "GAP-134; GAP-142"
  decider: Owner
  unblocks: GAP-142
  resolved: 2026-09-23
  outcome: >-
    **Silent, measured from the link's own start** (DN-31 §15). The link records when its
    task began asking, and silence runs from the last thing heard or from that start where
    nothing has ever been heard, against the same heartbeat timeout as any other silence.
    The desktop falls back and the sentence says which it is: "has not answered since this
    desktop signed in" rather than "silent for 12 s", because an operator reads the two
    differently. See `../../record/2026-09-23/an-outage-outlives-its-process.md`.
- id: D-75
  decision: What a desktop's link does with a publish the node refuses, and what the console is told
  question: >-
    The link kept any exchange batch the node did not take and offered it again every
    forward tick, whatever the answer. An Operator's console is refused `403` on every
    publish, because `PUBLISH_EXCHANGE` is not an Operator's, so it retried four times a
    second for as long as it ran and said nothing anywhere (GAP-146). How should the link
    tell a refusal that cannot succeed from one that can, when should it ask again, and
    what should the console say?
  raised_in: "GAP-145; GAP-146"
  decider: Owner
  unblocks: GAP-146
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** Read each answer for what it
    says about the caller (DN-18 §13): `2xx` delivered; no answer, `408`, `425`, `429` or
    a `5xx` (the full register's `507` included) is "not now", retried after an interval
    doubling from one forward tick to thirty seconds and reset on every new connection;
    `401` or `403` is "not you", and the link keeps every set and offers nothing more
    until it signs in again, which every connection does and which a sign-in on the
    console brings about; any other `4xx` drops that one set, counted. PN-09 carries one
    line for a linked console, giving the node's reason, what is held and the roles the
    authority matrix lets publish, read from the matrix itself; nothing goes to the alert
    list. The reconnection edge republishes launch warnings with handoffs. A timed retry
    of a `403` was rejected because it asks the same session the same question; stopping
    the Operator's console from queuing at all was rejected because the node, not the
    desktop's copy of the matrix, answers for the session, and the held set is what a
    Supervisor signing in at that console should send. See
    `../../record/2026-09-25/a-console-that-may-not-publish-says-so.md`.
- id: D-76
  decision: How the desktop's exchange outbox is bounded
  question: >-
    `queue_exchange` bounded nothing: one batch per handoff issued, for as long as the node
    did not take them (GAP-146). The detection outbox drops its oldest past a capacity and
    counts it, and `gungnir_resilience::StoreAndForwardQueue` (GAP-121) does the same for
    envelopes. Should the exchange outbox take either rule, or another?
  raised_in: "GAP-146; GAP-121"
  decider: Owner
  unblocks: GAP-146
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** One set per item, the newest
    (DN-18 §13). Every set is its producer's whole current set, so a newer one makes any
    older one waiting for the same item obsolete: the outbox replaces it in place and
    counts the replacement, and a set already on its way is removed by its generation so a
    newer one survives. A capacity with the oldest dropped was rejected because it would
    keep obsolete sets while dropping by age across items, and post every obsolete set on
    reconnection; `StoreAndForwardQueue` was rejected for the same rule over a different
    type and for a `gungnir-remote` to `gungnir-resilience` edge `ARCHITECTURE.md` §7.1
    does not show, and GAP-121 is left open. See
    `../../record/2026-09-25/a-console-that-may-not-publish-says-so.md`.
- id: D-79
  decision: Which layout engine the If-Sr diagrams are rendered by
  question: >-
    `build_uaf.py` pinned every If-Sr diagram to smetana, PlantUML's Java port of Graphviz
    dot, as a measured choice for squarer layouts. Since GAP-132 smetana throws in
    `mincross` on the plans-effectors-handoff diagram, so that one SVG was rendered by
    Graphviz and every other If-Sr SVG by smetana, and a reader compared two engines'
    layouts in one family (GAP-139). Pin the engine per diagram, pin a PlantUML version
    with the defect fixed, or render the family through Graphviz?
  raised_in: "GAP-132; GAP-139"
  decider: Owner
  unblocks: GAP-139
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** Every If-Sr diagram, the overview
    included, is laid out by Graphviz dot, and the render scripts pin the Docker image,
    `plantuml/plantuml:1.2026.8`, whose SVGs record the version that drew them. Measured
    with that image on all nine: dot's left-to-right layouts cover 1.05x to 1.66x smetana's
    area, and the 30-40x the pin's comment recorded was the top-to-bottom default, which
    left-to-right cures under either engine. A per-diagram engine was rejected because it
    keeps two engines in one family, which is the defect; a fixed version was rejected
    because none exists (1.2026.8 is the latest image), and smetana would stay one graph
    change away from the next crash while the check needs every element positioned. The
    Rs-Cn family renders cleanly under smetana and keeps it, one engine per family. See
    `../../record/2026-09-25/housekeeping-after-dn-31.md`.
- id: D-80
  decision: Whether the unreachable plan-keyed decision type is removed or documented
  question: >-
    `gungnir_api::v3::ApprovalRequest`, a plan decision naming its own operator in the
    body, has been reachable from no route since GAP-132, and `ApiHandler::decide`, the only
    thing naming it, has no implementor (GAP-138). Remove both, or keep them and say in the
    trait what implements it and when?
  raised_in: "GAP-132; GAP-138"
  decider: Owner
  unblocks: GAP-138
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** Removed, both. A decision is taken
    on a queue item through `DecisionRequest`, whose caller is whoever the session token
    says; a second, plan-keyed description that names an operator is a contract nothing
    honours and every reader has to be told not to believe. Documenting it was rejected
    because no implementation is planned that would take a decision on a plan rather than
    on the item that carries its deadline and its roles (DN-31 §7). `ApiHandler` keeps its
    two methods, both of which describe routes the node serves, and now says that nothing
    implements it. The UAF's IE-23, the operator's decision carried over the API, names
    `DecisionRequest` as the type that carries it. Human-owned: a `gungnir-api` write path;
    see `docs/signatures.md`. See `../../record/2026-09-25/housekeeping-after-dn-31.md`.

- id: D-77
  decision: How the journal holds an envelope carrying a NaN or an infinity
  question: >-
    JSON has no spelling for a non-finite float and `serde_json` writes one as `null`, so
    such an envelope made a journal line that could not be read back: mid-session it failed
    the whole session, as the last line it was dropped as torn (GAP-126). Should `append`
    refuse the envelope with a named error, or should the journal carry the value?
  raised_in: "GAP-126"
  decider: Owner
  unblocks: GAP-126
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** The journal carries it,
    losslessly: an envelope whose floats are all finite is written byte for byte as
    before, and one that carries a non-finite float is written as a marked line (`~`) in
    which each such float is a string token holding its bits and a genuine string that
    could be mistaken for one is escaped. `append` re-reads a marked line before writing it
    and refuses with `StoreError::Unfaithful` a line that would not come back as written.
    A refusal was rejected because a real producer can emit one (a deadline typed as "inf"
    into PN-10, now also refused where it is typed), and a refused envelope is a lost
    event: the record of the fault is exactly what an investigation of it needs. A
    per-field serde attribute was rejected because several hundred float fields reach the
    journal, some inside internally tagged enums serde buffers first, and one forgotten
    field would reopen the defect; the adapter wraps `serde_json` once and covers every
    field by construction. See
    `../../record/2026-09-25/every-float-kept-old-sessions-purged-on-purpose.md`.
- id: D-78
  decision: When the journal is purged, what a purge may never take, and who chooses the age
  question: >-
    `RetentionPolicy` existed with a 90-day default and no code applied it, so journals
    grew without bound (GAP-122). Building the purge needs a production answer to when it
    runs, what "age" is measured from, what it must never remove, how an interrupted purge
    is survived and seen, and whether a deployment that never declared a policy starts
    deleting on an upgrade.
  raised_in: "GAP-122"
  decider: Owner
  unblocks: GAP-122
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** Retention is declared in the
    baseline (`ConfigBaseline::retention`) or nothing is purged, and both binaries say which
    at start: the period is the customer's record-keeping obligation (data architecture
    §4), and a default nobody chose must not begin deleting mission records on an upgrade.
    Age is days since the session's journal was last written, from the file's own time, so
    a session sealed under a key a later process cannot open is still reached. Both
    binaries purge after the live session exists and hourly; never while opening the
    journal. Never purged: the session open for appending, a session under a hold file
    (placed and released by the after-action review, or by an administrator), and what the
    caller protects -- on the desktop, every session an open requirement's events are in,
    the sessions holding the highest requirement identifier and launch-warning serial, and
    an unfinished outage's session. A purge renames the journal out of the listing, removes
    the mission record, then deletes the file, so an interrupted purge leaves every session
    whole or gone and the next finishes it. Each removal is a `RetentionEvent` in the live
    session, a log line, a count, and on the desktop an alert. The audit-log age governs
    nothing until a durable audit log exists (GAP-152). See
    `../../record/2026-09-25/every-float-kept-old-sessions-purged-on-purpose.md`.

- id: D-83
  decision: How the risk score reads time to impact
  question: >-
    The `gungnir-assessment` criterion is a score monotonic in time to impact, and the score
    read range and whether a track closed, never how soon it arrived (GAP-124). Which time
    to impact -- at the current closing speed, or to the closest point of approach -- how
    does it combine with range, priority and lethality, and what does the track's
    covariance change?
  raised_in: "GAP-124"
  decider: Owner
  unblocks: GAP-124
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** **Time to impact stays range to
    the boundary over closing speed, and a closing track scores on it alone** (DN-01 §10).
    Urgency is `τ / (τ + T)` with `τ` the baseline's `assessment.urgency_half_time_s`
    (60 s by default); a confidently closing track's kinematic factor is `1/2 + u/2`, one
    not closing keeps `p/2` on proximity, and the track's own closing-speed sigma blends
    the two, so a closing speed within two sigma of zero earns little. Priority and
    lethality multiply it as before. The time to the closest point of approach was
    rejected as the time to impact: it ignores the miss distance, so a track passing 20 km
    off would be "10 s from impact" and trigger impact warnings DN-03 keeps for arrivals,
    and it halves the score the instant a track passes. A range-and-time product was
    rejected because a near-slow track then outscores a far-fast one that arrives sooner,
    which is the defect. See
    `../../record/2026-09-25/time-to-impact-and-sensor-sectors.md`.

- id: D-84
  decision: What a sensor's azimuth sector is and where it is stated
  question: >-
    `CoverageVolume` had no bearing, so the coverage-accuracy criterion's bearing clause
    could not be checked and a sectored sensor could not be represented (GAP-118). Give it
    a sector, or take bearing out of the criterion? And if a sector: stated how, against
    which north, and where -- the sensor, the laydown, or both?
  raised_in: "GAP-118"
  decider: Owner
  unblocks: GAP-118
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** **A sector, as a boresight and a
    width in (0, 2π], against true north at the sensor, on the sensor's declaration and
    optionally on a laydown placement; absent is the full circle** (DN-12 §9). Removing
    bearing from the criterion was rejected: real sensors have sectors, and a panel radar
    counted as covering all round is coverage that is not there, which DN-12 exists to
    prevent. True north at the sensor because that is what a survey states; the local
    frame's north departs from it by the meridian convergence, 0.35 degree 39 km east at
    45 degrees north, so the frame turns each sector as it places it. Two edges were
    rejected for a boresight and width because the width is what validation bounds and a
    sector across north then needs no special case. A placement may re-aim its sensor, and
    one that does not inherits the declaration's sector. See
    `../../record/2026-09-25/time-to-impact-and-sensor-sectors.md`.

- id: D-85
  decision: What "identical projections" means for a plan kept from an earlier solve
  question: >-
    The backend-switching row asks for identical `AppState` projections from one scenario
    through the embedded and the remote backends. A plan keeps the geometry, value and time
    of the solve that first made its pairing (GAP-097), and which solve that was depends on
    which frame first saw the asynchronous pipeline's report -- so two runs of the same
    embedded desktop can hold one pairing under different geometry. What does the parity
    test compare for the plan, and what does it compare exactly?
  raised_in: "GAP-120"
  decider: Owner
  unblocks: GAP-120
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** The picture, the health strip,
    PN-09's bearing line, the withheld resources, the scenario's alerts and a selected
    track's what-if are compared exactly; a linked desktop's plan is compared exactly with
    the node's; the two backends' plans are compared by their pairing, and their planners
    by one solve of the final picture at one time, equal in all but the minted identifier.
    Comparing plan vintages exactly was rejected because it would pass or fail on the
    scheduler; comparing them within a tolerance was rejected because it would hide a real
    planner difference behind one -- the common solve is what caught the node's missing
    frame. The row and its criterion are the owner's walk. See
    `../../record/2026-09-25/one-scenario-through-both-backends.md`.
- id: D-86
  decision: How a node's picture stays live on a linked desktop between snapshots
  question: >-
    A linked desktop reads the node's snapshot once per connection and follows the stream,
    and the stream carried plans but no track and no health: nothing in the workspace
    produced a `TrackingEvent`, and a linked desktop's health was the link's (GAP-160,
    GAP-161). Should the node publish the track lifecycle and the desktop read the node's
    health events, or should the link re-read the snapshot on an interval?
  raised_in: "GAP-120; GAP-160; GAP-161"
  decider: Owner
  unblocks: GAP-160, GAP-161
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** The node diffs its picture each
    tick against what it last announced and publishes `TrackInitiated`, `TrackUpdated` for
    any changed field, and `TrackDeleted`, deletions first so a reader appending keeps the
    host's order (`TrackLifecycle`, `picture::Announcer`); the link keeps the node's health
    from the snapshot and every `HealthEvent::Changed`, and a remote service is healthy only
    when the link is up and the node says its service is. Re-reading the snapshot was
    rejected: it polls the whole picture per desktop, leaves the journal, the partner stream,
    the reports, the replay and the entity fold without the events all five were written
    against, and delays every change by the interval. See
    `../../record/2026-09-25/one-scenario-through-both-backends.md`.

- id: D-72
  decision: What truth a rehearsal re-observes, when scans fall between truth records
  question: >-
    DN-32 §5.1 had both generators write truth at the finest scan period any sensor uses,
    and a rehearsal refuse to interpolate, on the premise that most scans fall between
    truth samples. The build found that the generators observe each scan against the state
    of the first truth tick at or after it. Rewrite all ten sample sets at the finest scan
    period, or re-observe on the recording's own tick by the rule that made it?
  raised_in: "GAP-105; `../../design/DN-32-re-observation-for-a-laydown.md` §12"
  decider: Owner
  unblocks: GAP-105
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25: the recording's own tick, by the
    recording's own rule.** A scan at a given time sees the truth record of the first tick
    at or after it, which is exactly what every recorded detection saw, so no position is
    ever computed between two records; a truth record off the tick grid is refused. The
    finer tick was rejected because it would not have delivered its own aim -- every
    sensor's first scan is at a random phase, so scans would still fall between 0.5 s
    samples -- and because it would have rewritten all ten committed sets, which gated rows
    elsewhere measure, for no gain in what §5.1 protects. Interpolation stays refused, as
    §5.1 said. DN-32 §12; see
    `../../record/2026-09-25/gap-105-re-observation-for-a-laydown-built.md`.

- id: D-73
  decision: Whether a recording's sensor losses and jamming apply to a deployment's sensors
  question: >-
    A recording's `environment.json` holds its sea state and, per sensor, its losses and
    electronic-attack windows, which name the recording's own sensors. DN-32 §5.3 designed
    the sidecar and was silent on how a window naming the recording's sensor 1 meets a
    deployment's sensors. Apply it by identifier, transfer it by sensor type, or count it
    and not apply it?
  raised_in: "GAP-105; `../../design/DN-32-re-observation-for-a-laydown.md` §5.3 and §12"
  decider: Owner
  unblocks: GAP-105
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25: counted, not applied, and the sea
    state applied to every sensor.** A window naming the recording's sensor is a fact about
    that sensor, and applying it by identifier is the accidental match DN-32 §5.4 refuses
    for detection models. Transfer by type was rejected because jamming depends on where
    the jammer stands, which no recording states, so a transferred window would invent an
    effect. The rehearsal record counts what it did not apply and PN-16 says so; when the
    placed sensors are the recording's own, as in the statistical check, every event
    applies by identifier as the generator applied it. See
    `../../record/2026-09-25/gap-105-re-observation-for-a-laydown-built.md`.

- id: D-74
  decision: How a rehearsal's random draws are seeded
  question: >-
    DN-32 §7 seeded a rehearsal's stream from the recording's seed and the laydown's
    identifier, so the same laydown rehearsed twice gives the same detections. Seeded by the
    laydown, two laydowns draw differently everywhere, and a sensor both place identically
    detects differently under each -- so a comparison names sensors nothing moved. Keep the
    laydown in the seed, or key the draws by what they concern?
  raised_in: "GAP-105; `../../design/DN-32-re-observation-for-a-laydown.md` §7 and §12"
  decider: Owner
  unblocks: GAP-105
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25: common random numbers, keyed by the
    recording's seed and by sensor and target, never by the laydown.** One stream per
    sensor for its scan phase, one per sensor for its false alarms, one per sensor and
    target for detection. The same laydown still gives the same answer twice, which is what
    §7 asked, and two laydowns differ only where their geometry does: with round 1's
    baseline, `current` and `c` give S1 the same 634 detections and S2 1 241 and 1 260, and
    the comparison names S2 alone. One interleaved stream, as the generator uses, was
    rejected for the same reason as seeding by laydown: moving one sensor would reshuffle
    every other's detections. See
    `../../record/2026-09-25/gap-105-re-observation-for-a-laydown-built.md`.
- id: D-81
  decision: How long the planner may solve in a tick, and what it does when that is not enough
  question: >-
    The `gungnir-intercept-service` row's degradation clause names an over-budget solve,
    and no budget existed: the planner ran the exact dynamic program inline in the tick
    for as long as it took (GAP-119). What is the budget, where is it set, and what does a
    solve that has not finished inside it do -- stop and start again next tick, move to a
    thread, or something else?
  raised_in: GAP-119
  decider: Owner
  unblocks: GAP-119
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** **A planning call spends at most
    `plan_solve_budget_ms` solving, 4 ms by default, and a solve not finished by then keeps
    its place and carries on at the next call** (DN-04 §10). The figure is MOP-06's own
    target (`../measures.md` §2), so none was invented; validation refuses anything not
    above zero or past 100 ms, the ceiling sized so a node's tick keeps the rest of
    MOP-02's 150 ms. The solve is sliced rather than restarted because an ordinary
    picture -- eight tracks, four effectors, the default horizon -- takes about thirteen
    milliseconds on the development machine, so a budget that discarded unfinished work
    would leave that picture stale for as long as it lasted; and rather than moved to a
    thread because slicing never holds the frame either, while a thread adds a result that
    lands at a time nothing chose and an overrun no test can decide. An unchanged problem
    is answered from the last solve without spending anything, and a problem that changes
    mid-solve drops the old solve. Time is read through an injected clock so a test steps
    it. Rejected: a budget in solver iterations, which is deterministic but is not the
    milliseconds MOP-06 measures and would mean something different on every machine. See
    `../../record/2026-09-25/a-stale-plan-says-how-old-it-is.md`.
- id: D-82
  decision: Whether a stale plan may be approved, and how the operator is told it is stale
  question: >-
    With a solve budget the planner can answer a tick with the last plan it computed
    rather than one for the picture on screen (GAP-119). Until now a stale plan looked
    exactly like a fresh one on PN-05, and PN-07 said only that the plan "may be stale".
    May an operator accept a plan while the planner reports it stale, and what must they
    have seen first?
  raised_in: GAP-119
  decider: Owner
  unblocks: GAP-119
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** **Yes, after acknowledging that
    it is stale; and PN-05 says so above the plan, with its age and the reason, whenever
    it is** (DN-04 §10). PN-05 draws "STALE", when the plan was computed, how long before
    the planner was last asked and why; "NO PLAN" and why when the planner has never
    answered; and nothing when the plan is current, because a standing line is one that
    gets read past. PN-07 names the stale plan among the degraded conditions with the same
    age and reason, and accept waits on the acknowledgement of that condition as it does
    for every other. Refusing accept outright was rejected: during an engagement the last
    good plan may be the best recommendation there is, the override and reject paths would
    remain, and a control that disappears is one an operator works around rather than one
    that informs them. The acknowledgement, and the health change the journal already
    carries before the decision, are what MOE-06 counts. See
    `../../record/2026-09-25/a-stale-plan-says-how-old-it-is.md`.


- id: D-89
  decision: When a linked desktop renews its session with the node
  question: >-
    A node's token lapses after its lifetime and the stream never asks for another, so a
    linked desktop's writes are refused from then on (GAP-165). Should the link renew on a
    timer ahead of expiry, only when the node refuses a token, or should the node stop
    expiring tokens on a live stream?
  raised_in: "GAP-120; GAP-165"
  decider: Owner
  unblocks: GAP-165
  resolved: 2026-09-26
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** Both, on the link: it renews at
    three quarters of the lifetime the node issued -- the expiry against the node's own
    time on the snapshot -- and at once whenever a request is refused `401`, keeping what
    it offered and sending it again under the new token. A `401` is never delivered as an
    answer to a decision, a task or an exchange set. A refused renewal ends the connection,
    so the link is seen down rather than looking up while every write is refused. The
    desktop's own session still bounds the link: an expired desktop session drops it.
    Renewing only on refusal was rejected because every lapse would cost a refused request
    and a round trip on the path an operator is waiting on; tokens that do not expire on a
    live stream were rejected because DN-23 §5 makes a node-issued session always expire,
    and that is a `gungnir-api` authentication change. See
    `../../record/2026-09-26/a-live-link-keeps-its-session.md`.
- id: D-87
  decision: What a node audits, where the record lives, and how it stays bounded
  question: >-
    The node wrote no audit entry but its queue's, and kept those in memory, so a sign-in,
    a refused token or a sensor task left no trace; the desktop's log was in memory too and
    gone at every restart (GAP-111). Which node events are audited, where the record lives,
    is it tamper-evident, and how is it kept from turning a flood of refused requests into a
    full disk or a slow route?
  raised_in: "GAP-111; the GAP-067 walk"
  decider: Owner
  unblocks: GAP-111, GAP-152
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** Every sign-in attempt, every
    refusal on every route, every act a role-gated route performs (with its outcome), every
    queue decision and refusal as DN-31 already had it, and every account change made by the
    provisioning command, one entry each, naming the operator the token verified and the
    machine the handshake verified and never a claimed one. Served reads and accepted
    detection submissions are not recorded one by one; their refusals are. The record is
    `gungnir_security::FileAuditLog` under `<data dir>/audit/` in both binaries, one
    hash-chained JSON-lines segment per run, not sealed, holding no secret. Route handlers
    write to a rate-limited two-lane outbox the node loop drains and syncs once a tick; what
    a lane turns away is counted as an entry. Rejected: logging every served read (a desktop
    polls, and the session was already recorded at sign-in), putting audit entries on the
    event journal (they would be streamed to every desktop and partner, and lost with the
    journal key), sealing the file (an investigation needs it most when the key is lost),
    and an unbounded queue or disk writes in the handler. DN-23 §13; see
    `../../record/2026-09-26/the-security-row-tested-and-the-node-audited.md`.
- id: D-88
  decision: Where role_permits and the authority matrix disagreed, which side was right
  question: >-
    GAP-111's test compares `role_permits` with `mission/roles-and-stakeholders.md` §4 for
    every role and every action. It found thirteen disagreements, and §4 had no row at all
    for several actions the code grants. For each, is the code or the document wrong?
  raised_in: "GAP-111"
  decider: Owner
  unblocks: GAP-111
  resolved: 2026-09-25
  outcome: >-
    **Taken under the owner's delegation of 2026-09-25.** The code was wrong in four ways
    and is corrected: the supervisor sets weapons control status (§4, §1 and §2 all say so);
    the administrator holds everything except the engagement chain and escrow recovery, so
    it no longer accepts engagements, overrides, sets control status, recovers a sealed
    journal's key or tops the escalation ladder (§1, §2 and the layout say it is not a
    decision-maker in the engagement chain; the escrow row says the security officer
    alone); the requirement, review and handover actions are held by the intelligence
    analyst and sensor manager, the analyst, and the watch-standing roles, as §1, DN-11,
    DN-20 and DN-21 describe their work; and `actions::ALL` names `requirement.state` and
    `account.assign_role`. The document was wrong where the code's grants were long-standing
    and gated elsewhere: §4 gains rows for viewing, submitting, overriding, reporting and
    applying a calibration baseline, the reconciliation row follows D-53, and §2's operator
    no longer overrides. Rejected: keeping the administrator's blanket grant (it defeats the
    separation of duties the security officer role exists for) and inferring new authority
    for the planner (the owner set it view-only). See
    `../../record/2026-09-26/the-security-row-tested-and-the-node-audited.md`.
- id: D-91
  decision: What a person may apply of a configuration baseline
  question: >-
    `config.apply` was one action for a whole baseline, and the sensor manager held it for
    its calibration row, so a baseline it applied could change weapons control status and
    the authority rules; and `ConfigEditorState::apply` checked no permission (GAP-162).
    How is the sensor manager's authority expressed, who may change the engagement chain
    and the security section through a baseline, and what happens to a candidate that
    changes some sections its applier may change and some it may not?
  raised_in: "GAP-162"
  decider: Owner
  unblocks: GAP-162
  resolved: 2026-09-26
  outcome: >-
    **Four answers, taken by the owner as recommended.** A new action,
    `config.apply_sensing`, for a baseline that changes only sensing sections, held by the
    sensor manager and by every role that may apply a whole one; the sensor manager no
    longer holds `config.apply`. The engagement chain (every policy section, resources,
    assets, geofences, hazards, approaches, the allocation horizon and solve budget,
    assessment) needs `weapons.control_status` as well, so only the supervisor and the
    commander change it through a file, as at the console (D-88). The security section
    (accounts and authentication, keys, TLS, escrow, machine identities, retention) needs
    `account.assign_role`, the administrator's alone. A candidate that changes any section
    its applier may not change is refused whole, nothing written, each section named with
    the action it needs. Rejected: one action with a per-role check (it keeps a coarse
    grant wider than its §4 cell), the commander alone for the engagement chain, any
    whole-baseline role for security, and applying the permitted part (it writes a version
    nobody validated). DN-08 §10; `../../../record/2026-09-26/a-baseline-applied-section-by-section.md`.
