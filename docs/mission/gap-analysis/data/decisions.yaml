    one screen and the queue on another). The plan 06 designs assume one window with a
    fixed grid per role and collapsible panels; docking would add a dependency
    (`egui_dock` or similar, a §2.9 sign-off).
  raised_in: >-
    `docs/ux/information-architecture.md` §1; `rust-ui-tech-stack-summary.md` §5
  decider: Owner with the UI engineer
  unblocks: GAP-055
