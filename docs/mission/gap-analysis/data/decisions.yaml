- id: D-22
  decision: Cipher and test-certificate crates
  question: >-
    Which authenticated cipher stands behind DN-22's `seal`/`unseal`, and how a test
    makes a certificate so mutual TLS can be verified at all. D-20 covered
    authentication and **explicitly not these**: `hmac` authenticates and does not
    encrypt, and the workspace has no certificate-generation crate and must not gain a
    checked-in private key. DN-22 amendment 1 (§9) recommends `aes-gcm` for the cipher
    and `rcgen` as a dev-dependency only.
  raised_in: >-
    `docs/design/DN-22-key-management.md` §9; `agentic-coding-standards.md` §2.9
  decider: Owner with the security engineer
  unblocks: GAP-060, GAP-084
  resolved: 2026-09-05
  outcome: >-
    **Raised by GAP-060, which could not start without it.** DN-22 designs a custody
    boundary and names no algorithm; `seal` and `unseal` need an authenticated cipher,
    and none is in the workspace. Mutual TLS additionally needs certificates **in
    tests**, and a private key checked into the repository is key material in the
    repository whatever the comment above it says. Recommended: `aes-gcm` (AES-256-GCM,
    FIPS-approved and hardware-accelerated on both targets) and `rcgen` in
    `[dev-dependencies]` only. AES-256-GCM rather than ChaCha20-Poly1305 because both
    targets have AES hardware acceleration and AES-GCM is FIPS-approved; `rcgen` never
    ships, because a certificate generator in a deployed binary is a way to mint an
    identity. Duplicate linkage checked the same day. **The third row was taken later
    the same day**: `p256` (ECDSA P-256) for `KeyPurpose::BaselineSigning` and for the
    asymmetric provider a cloud deployment's TLS identity needs. It had been left open
    because no gap needed it, and what it was actually blocking was a *decision* rather
    than code -- GAP-060's remaining half could not be argued without it. P-256 rather
    than Ed25519 because it is FIPS-approved, which is what the accreditor these
    documents keep in view will ask; Ed25519 is the better curve on most other grounds
    and loses on that one. A signature scheme at all rather than reusing `hmac`, because
    DN-22 amendment 1 (a) needs a signature over a TLS transcript and there is no shared
    secret with the peer to MAC against. **In the workspace manifest and used by
    nothing**: no gap builds the asymmetric provider and none may depend on it until one
    does, the same condition D-21 put on `tonic`. Duplicate linkage checked, and
    checking it surfaced something worth writing down -- **an unused
    `[workspace.dependencies]` entry is never resolved at all**, so it is absent from
    the lockfile and `cargo tree -i` reports the package does not exist; the crate has
    to be added to a member temporarily and the lockfile read. Done that way: one copy
    each of `p256` 0.13.2, `elliptic-curve` 0.13.8, `ecdsa` 0.16.9, `primeorder` 0.13.6
    and `sec1` 0.7.3, and no second copy of the `sha2`, `digest`, `generic-array`,
    `crypto-common`, `base64ct` or `subtle` beneath D-20's crates.

- id: D-23
  decision: Heartbeat interval and the connectivity budget
  question: >-
    The connectivity budget said fallback under 2 s from the last heartbeat; the node
    beat every 10 s with an independent 35 s timeout, so a node that went silent with
    the socket open -- the case the budget exists for -- was unnoticed for 35 s. Found
    by GAP-056's connectivity test. Tightening the timeout alone cannot meet the figure,
    and meeting it by force would make every 2 s stall on an intermittent link a full
    reconnect.
  raised_in: "`performance-budgets.md` connectivity; `gungnir-api/src/transport.rs`"
  decider: Owner
  unblocks: GAP-056
  resolved: 2026-09-06
  outcome: >-
    **Recommended by the agent, accepted by the owner, implemented the same day.** The
    budget was conflating two things and both are now stated: **visibility** -- the
    operator can see the picture going stale within 2 s of the last beat, which needs no
    timeout because PN-01 shows 'heard N s ago' ticking up in real time -- and
    **declaration** -- the desktop decides the link is gone within four beats.
    `HEARTBEAT_INTERVAL` 10 s to 2 s: a WebSocket ping is a handful of bytes, half a
    ping per second per desktop and five per second per node at the ten-desktop fan-out
    budget, and at 10 s the display would have read '9 s' on a perfectly healthy quiet
    link. `HEARTBEAT_TIMEOUT` 35 s to 7 s, and **derived in code from the beat** (three
    tolerated misses plus a one-second margin) rather than written down beside it,
    because two independently edited constants is precisely how the conflict was created
    and how it would recur. Three misses rather than one so a single stall on an
    intermittent link does not cost a reconnect. Raising the budget to 35 s to match the
    code was rejected: that is the widen-the-criterion move the workspace forbids for
    verification rows, and the spirit applies. The plan was recorded here and executed
    in order: constants, the link's `last_heard`, `LinkFreshness` on PN-01 judged by the
    binary against the beat, the pinned test flipped from 'the budget is not met' to
    'the relationship holds', and the documents. `gungnir-app` reaches the beat through
    `gungnir_remote::link`'s re-export rather than a new manifest edge to `gungnir-api`.

- id: D-21
  decision: gRPC as a second transport
  question: >-
    Whether `tonic` and `prost` enter the stack for the gRPC surface `gungnir-api-v1.md`
    plans for peer C2 systems that cannot speak the v2 HTTP contract; a §2.9 sign-off
    that D-18 explicitly left open.
  raised_in: "`agentic-coding-standards.md` §2.9 rule 5; `gungnir-api-v1.md`"
  decider: Owner with the services engineer
  unblocks: None blocking
  resolved: 2026-09-05
  outcome: >-
    Signed off: `tonic` 0.14 and `prost` 0.14 for the gRPC surface, which D-18 had left
    a later question. Resolution checked the same day against the whole transport stack
    -- one `hyper` (1.11.1), one `tower` (0.5.3) and one `http` (1.5.0) shared with
    `axum` 0.8.9 -- because a gRPC stack that pulled a second HTTP implementation into
    the SBOM would have failed D-18's own test. In the workspace manifest and used by no
    member: **no gap builds the gRPC surface yet**, and one must be opened before a
    `.proto` schema or the `tonic-build` codegen dependency is added. It is a second
    transport and never a replacement; the v2 contract stays primary, and both are
    generated from the same `gungnir-model` types so that two transports do not become
    two contracts.

- id: D-20
  decision: Authentication crates
  question: >-
    Which key-derivation, message-authentication, and constant-time-comparison crates
    operator authentication is built on; a §2.9 sign-off. **No cryptographic crate is in
    the workspace at all**, and D-02 chose the mechanism without choosing the libraries
    -- the same gap D-18 filled for the transport before GAP-041 could be written. DN-23
    §9 recommends `argon2` with `password-hash`, `hmac` with `sha2`, and `subtle`, and
    argues the load-bearing choice: a symmetric MAC rather than public-key signing,
    because the node issues and verifies its own tokens, and a public-key scheme would
    put a private key in the process -- the same conflict that stopped TLS in GAP-041.
  raised_in: >-
    `docs/design/DN-23-operator-authentication.md` §9; `agentic-coding-standards.md`
    §2.9
  decider: Owner with the security engineer
  unblocks: GAP-057, GAP-059
  resolved: 2026-09-05
  outcome: >-
    **Signed off: `argon2` with `password-hash`, `hmac` with `sha2`, and `subtle`.** No
    cryptographic crate was in the workspace at all before this, and DN-23 needs a
    memory-hard key-derivation function for passphrases and a message authentication
    code for short-lived tokens. DN-23 §9 recommended `argon2` with `password-hash`,
    `hmac` with `sha2`, and `subtle`. **Signed off 2026-09-05.** The load-bearing choice
    is a symmetric MAC rather than public-key signing: D-02 has the node issue and
    verify its own tokens, so there is no third party to verify a signature, and a
    public-key scheme would put a private key in the process -- the conflict that
    stopped TLS in GAP-041 against DN-22's `seal`/`unseal` boundary. All RustCrypto, so
    one audit surface; resolution checked the same day, one copy each of the five and of
    `digest`, `generic-array`, `crypto-common` and `base64ct` beneath them. **Two
    purposes stay unnamed and are not covered**: DN-22 needs an authenticated cipher for
    the journal at rest and a signature scheme for baseline signing, and `hmac`
    authenticates without encrypting. Those are GAP-060 and GAP-084 to raise, with
    AES-256-GCM and ECDSA P-256 the recommendation to argue there. DN-23 itself remains
    an unsigned draft.

- id: D-24
  decision: AIS and ADS-B editions and fixtures
  question: >-
    Which ITU-R M.1371 edition and which ICAO Doc 9871 edition the cooperative-identity
    codecs are written against, and which public captures may be fixtures under what
    terms -- the same decision GAP-064 needed for ASTERIX, without which a codec is
    written from memory.
  raised_in: "`docs/design/external-standards.md` §3, §4"
  decider: Owner
  unblocks: GAP-010
  resolved: 2026-09-06
  outcome: >-
    **Pin both, verify first** (the recommended option). AIS: ITU-R M.1371-6 (02/2026)
    is current and M.1371-5 (02/2014) is what deployed transponders were certified to;
    the gpsd AIVDM/AIVDO document v1.58 is the public framing reference and gpsd's five
    AIS regression logs with their `.chk` decodes, BSD-2-Clause, are the fixture
    candidate. ADS-B: ICAO Doc 9871 2nd edition with Amendment 2 (2023), paid; *The
    1090MHz Riddle* is CC BY-NC-SA 4.0 and flagged as reading only; pyModeS and dump1090
    are GPL with no visible captures; a self-recorded 1090ES capture is recommended. All
    recorded in `external-standards.md` §3 and §4 with what was and was not verified.
    **Nothing is pinned**: the owner pins once the M.1371 -5 to -6 layout delta for the
    message types in scope is checked and the fixtures are copied with a `SOURCE.md`. No
    codec until then.

