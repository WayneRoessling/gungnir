# The decision ledger's data: one entry per decision the owner takes. `../tools/gen_gaps.py`
# renders decisions-needed.md from it.
#
# A decision is Open until it has a `resolved` date, and its status column is rendered
# from `resolved` and `amended`, never written by hand. An amendment appends its date to
# `amended` and its substance to `outcome`. Ids are never reused.

- id: D-01
  decision: Scope lock
  question: >-
    Which crates and capabilities ship in the first release. Everything appropriate is
    scaffolded; the register assumes all of it is in scope until locked.
  raised_in: "`ARCHITECTURE.md` §10"
  decider: Owner
  unblocks: "All gaps; the roadmap's I4 column"
  resolved: 2026-09-04
  outcome: >-
    Everything in one release: all scaffolded crates and all 56 capabilities through I4
    ship together. The register's I4 column is the release content; no crate is dropped
    at lock.

- id: D-02
  decision: Credential mechanism
  question: >-
    Mutual TLS or tokens for operators and API callers, and how sensor owners are issued
    credentials.
  raised_in: "`ARCHITECTURE.md` §10; `ARCHITECTURE.md` §8.5"
  decider: Owner with the security engineer
