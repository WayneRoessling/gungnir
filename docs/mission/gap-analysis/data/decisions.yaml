- id: D-10
  decision: Repository hosting, runners, registry, vulnerability response
  question: >-
    The CI and release workflows run only once the repository is hosted with runners;
    the container registry and the vulnerability-response objective are open in
    `release-governance.md`.
  raised_in: "`release-governance.md`; `ARCHITECTURE.md` §10"
  decider: Owner
  unblocks: GAP-061, GAP-067
  resolved: 2026-09-04
  amended: [2026-09-07, 2026-09-08]
  outcome: >-
    **Amended 2026-09-08: the `gpu` runner exists, and `gpu-fusion.yml` stays on
    `workflow_dispatch` permanently.** The runner the 2026-09-07 amendment said this
    workflow still needed is registered: `gungnir-rtx-5060ti`, labels `self-hosted,
    Windows, X64, gpu`, on the owner's workstation and its NVIDIA RTX 5060 Ti. **The
    trigger is not restored with it, and that is a decision rather than a wait.** A
    `workflow_dispatch` job on a self-hosted runner already *is* local execution -- the
    compute happens on the owner's hardware, and GitHub contributes the trigger and the
    log -- and dispatch can only be fired by a caller with write access, so no fork's
    pull request can reach the machine. A `pull_request` trigger would reverse exactly
    that: this repository is public, the runner is a workstation, and GitHub's own
    guidance is against the pairing. The cost accepted is that each GPU validation run
    is fired by hand (`gh workflow run gpu-fusion.yml`), which is a trivial cadence for
    a path that changes rarely. The alternative considered and declined was dropping the
    workflow and running `cargo test -p gungnir-data-fusion --features gpu-tests --
    --ignored` on the host: it is the same command and the same hardware, but it
    produces no CI log, and `release-governance.md` defines the evidence package as the
    logs of every gate that ran, assembled by nobody. The repository's fork-PR approval
    policy is therefore left as it stands, because no self-hosted job is reachable from
    a pull request. **Amended 2026-09-07: GitHub, not a self-hosted GitLab.** The
    repository is hosted at `https://github.com/WayneRoessling/gungnir`, CI is GitHub
    Actions, and images go to the GitHub Container Registry. The eight workflows under
    `.github/workflows/` therefore stay where they are and are not ported, and the gate
    names and pass criteria do not change. **Two things the forge change does not
    remove.** `gpu-fusion.yml` still needs a self-hosted runner labelled `gpu`
    registered to the repository, because GitHub's hosted runners have no GPU -- that
    requirement belonged to the workflow rather than to the forge it ran on
    (`docs/agentic-workflow.md` already says so). And this workspace **is not a git
    repository**, so GAP-061 begins with an initial commit; the amendment changes where
    the history goes, not the fact that there is not one yet. **No forge credential
    appears in this repository or in any configuration baseline**, and none can: GitHub
    does not accept a password for git operations, so access is a personal access token
    or an SSH key held by the owner outside the workspace. Repository visibility is not
    fixed by this decision; nothing in the register depends on it, except that a public
    repository publishes the evidence package -- the `cargo deny` and `cargo audit`
    reports, the SBOM and the CI logs -- along with the code. The vulnerability-response
    objective is unchanged: critical advisories within 7 days of publication, high
    within 30 days, lower at the next release. **What this replaced**, resolved
    2026-09-04: a self-hosted GitLab with its runners (including a GPU runner) and the
    GitLab Container Registry, with the GitHub workflows ported to GitLab CI under
    GAP-061.

