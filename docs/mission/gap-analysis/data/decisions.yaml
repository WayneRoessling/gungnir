- id: D-16
  decision: Agree the open targets
  question: >-
    The measures marked proposed or to be agreed in `mission/measures.md` and
    `mission/capabilities/measures-catalogue.md`, and the verification rows marked to be
    agreed, cannot become gates until the owner sets them.
  raised_in: >-
    `mission/capabilities/measures-catalogue.md`; `verification-capability-table.md` §2
  decider: Owner
  unblocks: GAP-047, GAP-067
  resolved: 2026-09-04
  outcome: >-
    Walked measure by measure. Every proposed value confirmed or adjusted (raised MOE-08
    to 0.9; tightened MOE-10 to 30 s and MOP-07 to 500 ms; loosened MOE-13 to 0.95,
    MOP-19 calibration optional, MOP-22 timing where supplied, MOP-23, MOP-27, and
    MOP-34 to two cycles; set MOP-04 under 1 per hour, MOP-32 under 500 ms, MOP-40 zero
    open findings); absolutes marked doctrine or table; MOP-25, MOP-35, MOP-37 deferred
    to plans 07, 08, 06. The six to-be-agreed verification rows were set: snapshot p99 1
    ms, ICP 0.05 m and 0.5 mrad, GPU within 1e-3 and inlier ratio 0.01, egui pass p99 8
    ms, coverage 1 percent and 0.1 degree, interop round-trip exact with best-effort
    decoding. Recorded in `mission/measures.md`,
    `mission/capabilities/measures-catalogue.md`, and `verification-capability-table.md`
    §2.

