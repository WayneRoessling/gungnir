- id: D-33
  decision: Whether SD-16 (Cursor-on-Target) is in scope, and what it is pinned to
  question: >-
    D-01 locked the release to the capabilities and crates then registered, and DN-25
    adds a standard that was not among them. Three sub-questions: is SD-16 release
    content or a later increment; is the schema pinned now or with the codec; and is the
    protobuf framing pinned at a commit of a GPLv3 repository. Extended 2026-09-07 by a
    fourth: the type tree, which gives the `type` attribute its meaning and which the
    schema pin does not cover. Extended 2026-09-08 by three more, out of
    `docs/design/tak-interoperability-research.md` §7: (e) whether the framing is pinned
    now that a stock client is known to send it on the mesh; (f) how the codec learns
    the field numbers; (g) which client pair records the corpus.
  raised_in: >-
    `docs/design/DN-25-cursor-on-target.md`; `docs/design/external-standards.md` §5
  decider: Owner
  unblocks: GAP-090, GAP-091
  resolved: 2026-09-06
  amended: [2026-09-07, 2026-09-08]
  outcome: >-
    **In scope; three artifacts, two of them pinned.** SD-16 is release content and not
    a later increment: GAP-090 and GAP-091 target I3 with the stream sink in I4, so
    under D-01's rule the release carries them. That is an addition to the scope lock,
    taken deliberately and recorded, not an exception granted quietly. **The schema is
    pinned now**, ahead of the codec rather than behind it: the CoT event schema version
    2.0 (13 June 2003, MITRE case #11-3895, approved for public release), with the
    attributes the mapping depends on transcribed in `docs/design/external-standards.md`
    §5.2 -- including the finding that `ce` and `le` carry no stated confidence level,
    so the mapping must declare which multiple of sigma it writes. **The protobuf
    framing is deliberately not pinned**: it carries no version and no date, its only
    identifier is a commit of a GPLv3 repository, and nothing in the first increment
    needs it because negotiation begins in XML. The licence question a commit-pin would
    raise is deferred with the pin rather than answered by taking it. Edge (s),
    `gungnir-remote` to `gungnir-interop`, accepted the same day by the owner as
    engineering reviewer and recorded in `docs/design/dependency-edges.md` §13.
    **Extended 2026-09-07 at the owner's direction: the type tree is pinned too**, which
    the 2026-09-06 answer had left open and `docs/design/external-standards.md` §5.6 had
    named as the gap. The specification of record is MITRE's *The Developer's Guide to
    Cursor on Target*, August 2005, case #06-0249, approved for public release and read
    rather than summarised; the pin this system acts on is the guide's own `friend`
    predicate, the anchored case-sensitive expression `^a-f-`, and nothing else -- the
    other affiliations are recorded and act on nothing, so pinning their letters would
    be pinning from memory. Two findings came back to DN-25 with it: affiliation exists
    only in the atoms branch, so a positional read would invent one for a chat message,
    and case is significant, upper case being MIL-STD-2525B and lower case a CoT
    extension. **MIL-STD-2525 is deliberately not the pin**: the guide records that
    CoT's atoms tree is 2525B pruned, so pinning any edition of 2525 would name the
    ancestor rather than the artifact. The official predicate file is unobtainable (it
    ships with a non-public debugger) and the permissively licensed type-mapping file is
    named at revision 1.80 rather than copied, because one predicate is all this system
    asks of a type. **Extended 2026-09-08 at the owner's direction, adopting the
    recommendations of `docs/design/tak-interoperability-research.md` §7 as written.**
    (e) **The framing is pinned now**, at `TAK-Product-Center/atak-civ` release tag
    5.5.1.8, because the client's own contact manager starts a mesh client at protocol
    version 1 and drops to XML only for a contact that advertises nothing higher than 0:
    the I3 mesh feed and mesh sink meet protobuf on their first datagram, so 'nothing in
    the first increment needs it' was false and is withdrawn. The 2026-09-06 refusal is
    kept in `docs/design/external-standards.md` §5.4 as history. (f) **Transcription**:
    the framing and the ten-message set are transcribed into
    `docs/design/external-standards.md` §5.4.1 and §5.4.2, the codec's `prost` structs
    are hand-written against that table, no `.proto` file is copied and no code is
    generated from the reference tree -- the route §5.2 took for the XSD. Recorded as
    the owner's decision, not as a reading of the licence. (g) **ATAK-CIV on an Android
    phone plus WinTAK-CIV on the recording host** records the corpus, giving two
    senders, both wire forms and a client on each side of the emulator limitation;
    ATAK-CIV plus iTAK is the no-account alternative and tests iTAK's mesh wire form in
    passing. The recorder's `--tcp` and `--unicast` modes were built the same day; **the
    recording itself remains the one open step.**

- id: D-32
  decision: Who verifies and pins AIS and ADS-B
  question: >-
    `external-standards.md` §3 and §4 hold candidates with named unverified claims (the
    M.1371-5 to -6 layout delta, the gpsd logs' licence header, a permissively licensed
    1090ES capture); D-24 said pin both, verify first, and left who does the verifying
    open.
  raised_in: "`docs/design/external-standards.md` §3, §4"
  decider: Owner
  unblocks: GAP-010
  resolved: 2026-09-06
  outcome: >-
    **The agent verifies and pins, the owner reviews** (the recommended option): fetch
    M.1371-6 from the ITU and diff the eight message tables in scope against -5; copy
    gpsd's five AIS logs under `testdata/ais/` with a `SOURCE.md` on §1.5's terms; pin
    M.1371-6 and ICAO Doc 9871 2nd edition Amendment 2 in `external-standards.md` with
    what was and was not confirmed. The AIS codec follows the pins; ADS-B waits for a
    capture the owner records. The owner reviews the note before any codec is written.
    Not yet done. **Done 2026-09-06**: M.1371-6 pinned after the two editions were
    compared table by table (identical for the eight types; two backward-compatible
    additions read); the gpsd captures copied with `SOURCE.md` and the contributor
    headers stripped; the AIS decoder built and gated on gpsd's decodes. ADS-B: Doc 9871
    2nd edition with Amendment 2 pinned as the specification of record; no permissively
    licensed capture exists, so the fixture is the owner's self-recorded one (GAP-010).

- id: D-28
  decision: How MOP-37 gets its targets
  question: >-
    The usability measure has no target because no session with participants has
    completed, and the test plan's round 1 was written for wireframes the built panels
    have outrun: run round 1 on the built panels, set provisional targets from the
    heuristic walkthrough, or leave it open until increment 3.
  raised_in: "`docs/ux/usability-test-plan.md` §7"
  decider: Owner with the plan 06 lead
  unblocks: GAP-074
  resolved: 2026-09-06
  outcome: >-
    **Round 1 on the built panels** (the recommended option): skip the wireframe round,
    run one participant per role against the rendered panels, and propose the MOP-37
    targets from the measured values (median as target, worst case as floor, provisional
    under four sessions). The session package is written; the owner names participants
    and dates. Ten of sixteen tasks can run, six of those only once GAP-089 seeds the
    desktop with tracks and plans, and six tasks are round 2's because their panel is
    unbuilt or their write does not reach the desktop; those are reported as not run,
    never scored. **Re-examined 2026-09-08 against the code the round was going to be
    run on.** Three of D-28's own numbers had gone stale in the two days since: the
    allocator and the tracking pipeline the six-task split rested on both closed the
    same day D-28 was resolved (GAP-011, GAP-029), and GAP-050, GAP-057 and
    GAP-041/GAP-004 closed the day after -- so the round's queue-emptiness rationale for
    group B no longer holds, and three of the six 'round 2' tasks (US-04, US-08, US-09)
    and part of a fourth (US-15, via GAP-045's PN-16 rehearsal, landed 2026-09-08) are
    no longer blocked by an unbuilt panel or an unwired write. **The re-plan is held
    rather than executed**: proving this by tracing the seed found that the live
    allocator now re-proposes an unchanged assignment every tick, flooding the approval
    queue at the redraw cadence (GAP-097, filed the same day) -- a general defect, not a
    rehearsal artifact, since a node's own tick runs the same service and would flood
    identically under US-04/US-08/US-09. Round 1 does not run, on the ten tasks or the
    fourteen, until GAP-097 closes. Once it does, the plan is fourteen tasks (the
    original ten, plus US-04, US-08, US-09 and US-15, each carrying the heavier session
    setup a real node or a real rehearsal needs beyond the single `--rehearsal` flag),
    and US-07 and US-16 stay round 2's -- their blockers (an unwired control-status
    write; an undesigned gap-acceptance control) are unchanged. **Confirmed by the owner
    2026-09-08**: the hold, the fourteen-task re-plan, and GAP-097's filing. **The hold
    lifted the same day**: GAP-097 closed, and with it the reason round 1 could not run
    on either scope. The session package is now prepared to the fourteen-task plan --
    setups and a required dry run per group D task, both seed timing gaps fixed and
    pinned by tests that fail when they regress, US-15's card corrected to what PN-16
    actually draws, and the report's stale seed hash replaced -- so what D-28 still owes
    is the fourteen sessions themselves and the target proposal they feed. That is the
    one part of this decision no agent can discharge: rule 3 above admits only measured
    values, and this round's participant is the owner. GAP-074 carries the detail,
    including a scenario-design question D-28 did not anticipate: PN-16 reads coverage
    from sensor placements alone, so round-1's two laydowns -- which differ only in
    where a battery stands -- cannot be told apart on the table US-15 compares them on.
    **The owner ruled on that question the same day and it is built**: `round-1.json`
    declares a third laydown `c`, the same two radars with S2 forward-sited 10 km up the
    declared approach, and US-15 now compares `current` with `c` on a measured
    difference of -5 250 m uncovered approach (7 000 m against 1 750 m) with `b` kept as
    the option that changes no coverage. It is scenario content only: the seed and its
    hash are untouched.

- id: D-34
  decision: The repository's licence
  question: >-
    The workspace shipped `license = "UNLICENSED"` and no `LICENSE` file, so nothing
    said what a reader of the hosted repository may do with the code, and plan 01 §8's
    licence-plus-support model had no instrument behind it. Three sub-questions: which
    licence; whether crediting Roessling Digital Solutions LLC is a request or an
    enforceable term; and whether contributions can be relicensed commercially.
  raised_in: >-
    `../../plans/01-product-business-plan.md` §8;
    `../../gungnir-workspace-structure.md`; D-10 (visibility left open)
  decider: Owner
  unblocks: GAP-061
  resolved: 2026-09-07
  outcome: >-
    **AGPL-3.0-or-later, with additional terms under section 7, a commercial licence
    beside it, and a CLA.** Chosen over the permissive options because of what the
    deployment profiles are: under Apache-2.0 or MIT a competitor could run a modified
    `gungnir-node` as a hosted service for a customer, never convey a binary, and owe
    nothing — and `../../../ARCHITECTURE.md` §8 makes exactly that shape the normal
    deployment. AGPL section 13 closes it. **Attribution is a term, not a request**:
    section 7(b) requires the `NOTICE` text be preserved in the Appropriate Legal
    Notices of a derivative's interactive interface, 7(c) forbids misrepresenting origin
    and requires modified versions be marked as different, and 7(e) declines trademark
    rights — the last of these restoring a protection Apache-2.0 §6 would have given for
    free and AGPL's base text does not. All three are in
    `../../../LICENSE-ADDITIONAL-TERMS.md`. **The commercial half is the reason the CLA
    exists**: `../../../CLA.md` takes a relicensing grant, without which one outside
    contribution freezes the dual licence permanently. **Two consequences that are not
    licence text.** Section 5(d) makes the interface obligation conditional on Gungnir's
    own interface carrying the notices first, so `gungnir-app` needs an About panel
    displaying them or every future fork is released from the requirement — **built
    2026-09-07 as PN-21**, opened from the status strip so that every role reaches it
    and none docks it (`WorkspaceLayout::ALWAYS_AVAILABLE`), with a render test
    asserting all four of section 0's elements reach the screen and
    `appropriate_legal_notices.rs` asserting the panel still says what `NOTICE` says.
    And `deny.toml`'s allow-list is now a distributability control rather than hygiene:
    `OpenSSL` was removed the same day, being the only GPL-incompatible entry on it,
    though nothing in the resolved graph declared it. **Landed 2026-09-07**: `LICENSE`
    (AGPL-3.0 verbatim), `LICENSE-ADDITIONAL-TERMS.md`, `NOTICE`, `CLA.md`, `license =
    "AGPL-3.0-or-later"` inherited by all 50 crates, and the three-line SPDX header on
    all 365 source files. `testdata/asterix/` stays GPL-2.0 as an aggregate and gained
    the `COPYING` its redistribution requires. **Not reviewed by counsel**; plan 01 §10
    owes that pass, together with the export-control question D-10 left open when it
    declined to fix repository visibility.

- id: D-35
  decision: "Theme tokens: flat constants, or a swappable Palette"
  question: >-
    An outside review of `gungnir-ui/src/theme.rs` (item 89) asked whether the theme's
    DS-01 tokens should become a `Palette` value so a night variant could be swapped in,
    or stay `Color32` constants read directly at 239 call sites across three crates.
  raised_in: "`ARCHITECTURE.md` §10 item 89; `docs/ux/design-system.md` DS-01"
  decider: Owner
  unblocks: GAP-095
  resolved: 2026-09-06
  outcome: >-
    **Keep the tokens as flat constants; file the night variant as its own gap rather
    than build it now.** Threading a `Palette` value through 239 call sites across three
    crates to make a token set swappable is its own tranche of work, not a corollary of
    the theme review that raised it. The night variant is GAP-095 -- filed as GAP-090,
    renumbered to GAP-094 the same day when GAP-090 was taken by an unrelated gap out of
    DN-25, and renumbered again 2026-09-07 on discovering GAP-094 was by then also
    carrying the advisories-gate gap, a second collision this row itself was silent
    about until the development-status review found it.

- id: D-36
  decision: "Selection halo colour: white, or a fourth map colour"
  question: >-
    The review proposed a cyan selection halo so a selected glyph reads faster; DS-04
    already reserves white as the one colour nothing else on the map uses, and the
    assignment line sat only ten units from the friendly frame's blue.
  raised_in: "`ARCHITECTURE.md` §10 item 89; `docs/ux/design-system.md` DS-04"
  decider: Owner
  unblocks: None blocking
  resolved: 2026-09-06
  outcome: >-
    **The halo stays white; the assignment line moves instead.** DS-04's rule holds --
    white is reserved for selection and drawn by nothing else on the map -- and the line
    that sat too close to the friendly frame's blue is teal now, so the five colours
    sharing the map stay pairwise apart rather than the halo gaining a sixth.

- id: D-37
  decision: "Compared numerals: monospace, or the proportional face"
  question: >-
    Time remaining, scores, positions, speeds, ages and evidence weights are numbers an
    operator compares down a column; the proportional face has no tabular figures, so a
    column of them does not line up.
  raised_in: "`ARCHITECTURE.md` §10 item 89; `docs/ux/design-system.md` DS-05"
  decider: Owner
  unblocks: None blocking
  resolved: 2026-09-06
  outcome: >-
    **Monospace, through `theme::numeral`.** Every compared numeral -- time remaining,
    scores, positions, speeds, ages, evidence weights -- is set in egui's monospace face
    at body size so a column of them lines up; DS-05 gained a 16 pt size for a panel's
    title and nothing else, declining the six-size scale the same review proposed.

- id: D-38
  decision: Viewport surface colour and coverage-ring alpha
  question: >-
    The same review's colour pass covered the viewport surfaces (`VIEWPORT_BACKGROUND`,
    the grid) and `COVERAGE_MAX_ALPHA` alongside the chrome tokens D-35 to D-37 settle.
  raised_in: "`ARCHITECTURE.md` §10 item 89; `docs/ux/design-system.md` DS-01"
  decider: Owner
  unblocks: None blocking
  resolved: 2026-09-06
  outcome: >-
    **The blue-black viewport set and the coverage alpha, both already built.**
    `VIEWPORT_BACKGROUND` (8, 16, 24), `VIEWPORT_GRID_COLOR` (31, 56, 70), and
