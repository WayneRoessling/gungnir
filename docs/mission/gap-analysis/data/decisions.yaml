- id: D-18
  decision: API transport stack
  question: >-
    Which HTTP, WebSocket, and TLS crates the `gungnir-api` transport is built on; a
    §2.9 sign-off, and the last decision standing between the decided contract and
    writing the transport.
  raised_in: "`ARCHITECTURE.md` §10; `gungnir-api-v1.md`"
  decider: Owner with the services engineer
  unblocks: GAP-041, GAP-050, GAP-063, GAP-065
  resolved: 2026-09-05
  outcome: >-
    Signed off: `axum` with its `ws` feature for the node's HTTP surface and the event
    stream, `tokio-tungstenite` for the desktop's WebSocket client, `reqwest` for its
    HTTP client, and `rustls`, `tokio-rustls`, and `rustls-pemfile` for the mutual TLS
