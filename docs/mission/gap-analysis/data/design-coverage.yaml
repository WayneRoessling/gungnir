# Design coverage per leaf capability: whether the architecture names a component for
# every part of it (full, partial, none, or planned when a plan owns it), and the
# evidence. `../tools/gen_gaps.py` renders coverage-matrix.md from it, and refuses a
# capability whose coverage is less than full and which has no gap.

- capability: CAP-1.1
  design: full
  evidence: >-
    `gungnir-ingest` gateway and adapter trait; `gungnir-interop` codec boundary;
    `DetectionView` carries provenance

- capability: CAP-1.2
  design: full
  evidence: >-
    `IngestGateway` validation and quarantine; `gungnir-security` authentication trait

- capability: CAP-1.3
  design: full
  evidence: >-
    Registry, modes, coverage regions, and the outbound control path are built as of
    2026-09-05 (GAP-003, GAP-004): a command is recorded, published, and swept for
    acknowledgement, and a requested mode is kept apart from the confirmed one. No
    adapter carries a command to a real sensor (GAP-001) and collection requirements are
    built and tasked from PN-15 but the list is not rebuilt at startup (GAP-005); DN-11
    (`docs/design/`) names a component for every remaining part

- capability: CAP-1.4
  design: full
  evidence: >-
    Coverage volumes in `gungnir-analytics`; gap detection as a function and map
    rendering of coverage are not designed; a component is now named for every part of
    it by DN-12 (`docs/design/`, first draft 2026-09-05)

