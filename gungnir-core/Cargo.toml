[package]
name = "gungnir-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CV/CA/CT motion models -- F/Q generation (exact-match closed-form oracle only) -- plus the identifier, lifecycle-status, and PSD-assertion primitives every higher crate shares (docs/agentic-coding-standards.md §1.2, §2.1)."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
nalgebra.workspace = true
serde.workspace = true

[dev-dependencies]
proptest.workspace = true
# The filterpy/Stone Soup/scipy fixture in testdata/oracles/core/ is JSON; serde_json
# is an already-approved workspace dependency (agentic-coding-standards.md 2.9) and
# this is a dev-dependency only, so no runtime edge changes.
serde_json.workspace = true
gungnir-testkit = { path = "../gungnir-testkit", version = "0.1.0" }
