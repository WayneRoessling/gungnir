[package]
name = "gungnir-eventing"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-neutral broadcast event bus (in-process today; a durable/replayable log or network stream behind the same trait later). docs/gungnir-capabilities.md §5.1 -- High. Replaces the UI polling a mutable slice every frame."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
crossbeam-channel.workspace = true
serde.workspace = true
thiserror.workspace = true
gungnir-model = { path = "../gungnir-model", version = "0.1.0" }
