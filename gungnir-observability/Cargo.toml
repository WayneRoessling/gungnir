[package]
name = "gungnir-observability"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Production-facing metrics, structured logs, distributed traces, health checks, watchdogs, and alert correlation -- extends the developer-facing tracing instrumentation into an operator-facing system-status capability. gungnir-capabilities.md §5.5 -- High."

[lib]
# `cargo bench --workspace -- --baseline main` (bench-regression.yml) passes criterion's
# flags to every bench target. A lib target's implicit harness is libtest, which rejects
# them with "Unrecognized option: 'baseline'" and fails the job. Criterion documents this
# opt-out; it removes no benchmark, because the criterion benches are `[[bench]]` targets.
bench = false

[lints]
workspace = true

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
gungnir-model = { path = "../gungnir-model" }
